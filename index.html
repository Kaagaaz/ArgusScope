<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARGUSSCOPE // WiGLE Recon Engine</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #060913;
      --bg-panel: #0d1322;
      --bg-card: #131c31;
      --border-color: #1e2d4a;
      --accent-cyan: #38bdf8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 16px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 20px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      width: 12px; height: 12px;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
      border-radius: 2px;
    }

    header h1 {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      letter-spacing: 2px;
      font-weight: 700;
      color: #fff;
    }
    header h1 span { color: var(--accent-cyan); }

    .header-actions { display: flex; align-items: center; gap: 16px; }

    .map-switcher {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .map-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .map-btn.active {
      background: var(--accent-cyan);
      color: #000;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }

    .btn-gps {
      background: var(--accent-green);
      color: #000;
      border: none;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    .sidebar {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .section-title {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .input-group { display: flex; gap: 8px; flex-direction: column; }

    input[type="text"] {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 10px 12px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    .btn-action {
      background: var(--accent-cyan);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-weight: 700;
      cursor: pointer;
    }

    .intel-terminal {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.6;
      flex: 1;
      overflow-y: auto;
    }

    .intel-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed var(--border-color);
      padding: 6px 0;
    }
    .intel-row:last-child { border-bottom: none; }
    .intel-key { color: var(--text-muted); }
    .intel-val { color: var(--accent-cyan); font-weight: 500; text-align: right; }

    .map-container {
      position: relative;
      width: 100%; height: 100%;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    #map { width: 100%; height: 100%; background: #000; }
  </style>
</head>
<body class="mode-googleSat">

  <header>
    <div class="brand">
      <div class="brand-logo"></div>
      <h1>ARGUS<span>SCOPE</span> // WiGLE ENGINE</h1>
    </div>

    <div class="header-actions">
      <button class="btn-gps" onclick="locateDeviceGPS()">📍 HARDWARE GPS</button>

      <div class="map-switcher">
        <button class="map-btn active" id="btnGoogleSat" onclick="switchMapMode('googleSat')">GOOGLE HD</button>
        <button class="map-btn" id="btnSat" onclick="switchMapMode('satellite')">ESRI SATELLITE</button>
        <button class="map-btn" id="btnDark" onclick="switchMapMode('dark')">CYBER DARK</button>
      </div>
    </div>
  </header>

  <div class="dashboard">
    <div class="sidebar">
      <div class="section-title">// 01. Standard IP Lookup</div>
      <div class="input-group">
        <input type="text" id="ipInput" placeholder="Enter Target IP (e.g., 184.84.167.84)">
        <button class="btn-action" onclick="lookupIP()">EXECUTE IP SEARCH</button>
      </div>

      <div class="section-title">// 02. WiGLE BSSID Triangulation</div>
      <div class="input-group">
        <input type="text" id="bssidInput" placeholder="MAC Address (e.g., 00:14:6C:7E:40:80)">
        <button class="btn-action" style="background:var(--accent-green);" onclick="lookupWigleBssid()">TRIANGULATE BSSID</button>
      </div>

      <div class="section-title">// 03. Telemetry Terminal</div>
      <div class="intel-terminal" id="intelTerminal">
        WiGLE Global Recon Engine ready. Enter an IP or Wi-Fi MAC Address to begin.
      </div>
    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const API_URL = "https://argusscope-backend.onrender.com";

    const layers = {
      googleSat: L.tileLayer('https://mt1.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', { maxZoom: 20, maxNativeZoom: 20 }),
      satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19 }),
      dark: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20, maxNativeZoom: 19 })
    };

    const map = L.map('map', { zoomControl: false, layers: [layers.googleSat] }).setView([20, 0], 3);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    let activeLayerKey = 'googleSat';
    let activeMarker = null;
    let activeRadiusCircle = null;

    function switchMapMode(key) {
      if (key === activeLayerKey) return;
      map.removeLayer(layers[activeLayerKey]);
      map.addLayer(layers[key]);
      activeLayerKey = key;

      document.querySelectorAll('.map-btn').forEach(btn => btn.classList.remove('active'));
      if (key === 'googleSat') document.getElementById('btnGoogleSat').classList.add('active');
      if (key === 'satellite') document.getElementById('btnSat').classList.add('active');
      if (key === 'dark') document.getElementById('btnDark').classList.add('active');
    }

    function plotCoordinates(lat, lng, label, radiusMeters = 0) {
      if (activeMarker) map.removeLayer(activeMarker);
      if (activeRadiusCircle) map.removeLayer(activeRadiusCircle);

      map.flyTo([lat, lng], 17, { duration: 1.5 });

      if (radiusMeters > 0) {
        activeRadiusCircle = L.circle([lat, lng], {
          color: '#38bdf8',
          fillColor: '#38bdf8',
          fillOpacity: 0.15,
          radius: radiusMeters
        }).addTo(map);
      }

      activeMarker = L.marker([lat, lng]).addTo(map)
        .bindPopup(`<b>${label}</b><br>LAT: ${lat.toFixed(5)}<br>LNG: ${lng.toFixed(5)}`)
        .openPopup();
    }

    async function lookupIP() {
      const ip = document.getElementById('ipInput').value.trim();
      if (!ip) return;

      const log = document.getElementById('intelTerminal');
      log.innerHTML = `Querying IP Target: ${ip}...`;

      try {
        const res = await fetch(`${API_URL}/api/v1/locate-ip?ip=${encodeURIComponent(ip)}`);
        const data = await res.json();

        if (data.latitude && data.longitude) {
          plotCoordinates(data.latitude, data.longitude, `IP Target: ${data.ip}`, data.accuracy_radius_m);
          log.innerHTML = `
            <div class="intel-row"><span class="intel-key">TARGET</span><span class="intel-val">${data.ip}</span></div>
            <div class="intel-row"><span class="intel-key">CONFIDENCE</span><span class="intel-val">${data.confidence}</span></div>
            <div class="intel-row"><span class="intel-key">LOCATION</span><span class="intel-val">${data.city}, ${data.country}</span></div>
            <div class="intel-row"><span class="intel-key">COORDINATES</span><span class="intel-val">${data.latitude}, ${data.longitude}</span></div>
          `;
        } else {
          log.innerHTML = `<span style="color:var(--accent-red)">TARGET RESOLUTION FAILED.</span>`;
        }
      } catch (err) {
        log.innerHTML = `<span style="color:var(--accent-red)">ERROR CONNECTING TO BACKEND.</span>`;
      }
    }

    async function lookupWigleBssid() {
      const bssid = document.getElementById('bssidInput').value.trim();
      if (!bssid) return;

      const log = document.getElementById('intelTerminal');
      log.innerHTML = `Querying WiGLE Registry for BSSID: <br><span style="color:var(--accent-cyan);">${bssid}</span>...`;

      try {
        const res = await fetch(`${API_URL}/api/v1/locate-bssid?netid=${encodeURIComponent(bssid)}`);
        const data = await res.json();

        if (data.latitude && data.longitude) {
          plotCoordinates(data.latitude, data.longitude, `Wi-Fi: ${data.ssid}`, data.accuracy_radius_m || 25);
          log.innerHTML = `
            <div class="intel-row"><span class="intel-key">SOURCE</span><span class="intel-val" style="color:var(--accent-green)">WiGLE REGISTRY</span></div>
            <div class="intel-row"><span class="intel-key">SSID</span><span class="intel-val">${data.ssid}</span></div>
            <div class="intel-row"><span class="intel-key">BSSID</span><span class="intel-val">${data.bssid}</span></div>
            <div class="intel-row"><span class="intel-key">CONFIDENCE</span><span class="intel-val">${data.confidence}</span></div>
            <div class="intel-row"><span class="intel-key">COORDINATES</span><span class="intel-val">${data.latitude}, ${data.longitude}</span></div>
            <div class="intel-row"><span class="intel-key">ACCURACY</span><span class="intel-val">~${data.accuracy_radius_m} meters</span></div>
          `;
        } else {
          log.innerHTML = `<span style="color:var(--accent-red)">${data.error || 'BSSID NOT FOUND IN WIGLE DATABASE.'}</span>`;
        }
      } catch (err) {
        log.innerHTML = `<span style="color:var(--accent-red)">API ERROR. CHECK BACKEND CREDENTIALS.</span>`;
      }
    }

    function locateDeviceGPS() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition((pos) => {
        plotCoordinates(pos.coords.latitude, pos.coords.longitude, "Device GPS", pos.coords.accuracy);
      }, null, { enableHighAccuracy: true });
    }
  </script>
</body>
</html>
