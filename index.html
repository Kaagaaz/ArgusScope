<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>ArgusScope // Intelligence Engine</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

:root{
  --bg:#070c15;
  --panel:#0b1321;
  --panel2:#101b2d;
  --line:#1c2b42;

  --text:#dce7f3;
  --muted:#657991;

  --cyan:#28b9ef;
  --green:#12c58b;
  --red:#ff5365;
}

/* =========================
   RESET
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;

  overflow:hidden;

  background:var(--bg);
  color:var(--text);

  font-family:
    "JetBrains Mono",
    "Courier New",
    monospace;
}

button,
input{
  font:inherit;
}

/* =========================
   APP
========================= */

#app{
  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  padding:8px;

  display:grid;

  grid-template-rows:46px minmax(0,1fr) 22px;

  gap:7px;

  overflow:hidden;
}

/* =========================
   HEADER
========================= */

.navbar{

  min-width:0;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  padding:6px 10px;

  background:var(--panel);

  border:1px solid var(--line);

  border-radius:6px;

  position:relative;

  z-index:3000;
}

.brand{

  min-width:0;

  display:flex;

  align-items:center;

  gap:7px;

  white-space:nowrap;

  overflow:hidden;

  font-size:13px;

  font-weight:bold;
}

.brand-dot{

  flex:none;

  width:10px;
  height:10px;

  background:var(--cyan);

  border-radius:2px;

  box-shadow:0 0 12px #28b9ef88;
}

.brand-name{
  color:var(--text);
}

.brand-slash{
  color:var(--cyan);
}

.brand-sub{
  color:var(--cyan);
}

/* =========================
   NAV BUTTONS
========================= */

.nav-controls{

  flex:none;

  display:flex;

  align-items:center;

  gap:5px;
}

.nav-btn{

  height:30px;

  padding:0 10px;

  border:1px solid var(--line);

  border-radius:4px;

  background:#0d1828;

  color:#7d91a8;

  font-size:9px;

  font-weight:bold;

  cursor:pointer;

  white-space:nowrap;
}

.nav-btn:hover{

  border-color:var(--cyan);

  color:var(--cyan);
}

.nav-btn.gps{

  color:#6ed4ae;

}

.nav-btn.gps:hover{

  border-color:var(--green);

  color:var(--green);
}

/* =========================
   VIEWS DROPDOWN
========================= */

.view-container{

  position:relative;
}

.view-menu{

  position:absolute;

  right:0;
  top:35px;

  width:185px;

  padding:6px;

  display:none;

  background:#0a1220;

  border:1px solid var(--line);

  border-radius:5px;

  box-shadow:0 12px 30px #0009;

  z-index:6000;
}

.view-menu.open{

  display:block;
}

.view-title{

  padding:6px 7px;

  margin-bottom:4px;

  color:#5e7590;

  font-size:8px;

  letter-spacing:1px;

  border-bottom:1px solid #ffffff0a;
}

.view-option{

  width:100%;

  padding:8px;

  border:0;

  border-radius:3px;

  background:transparent;

  color:#8093a9;

  text-align:left;

  font-size:9px;

  cursor:pointer;
}

.view-option:hover{

  background:#122036;

  color:var(--cyan);
}

.view-option.active{

  color:var(--cyan);

  background:#0e1d30;
}

/* =========================
   WORKSPACE
========================= */

.workspace{

  min-width:0;
  min-height:0;

  display:grid;

  grid-template-columns:292px minmax(0,1fr);

  gap:7px;

  overflow:hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{

  min-width:0;
  min-height:0;

  overflow-y:auto;
  overflow-x:hidden;

  padding:10px;

  background:var(--panel);

  border:1px solid var(--line);

  border-radius:6px;
}

.control-group{

  margin-bottom:13px;
}

.section-title{

  margin-bottom:6px;

  color:var(--cyan);

  font-size:9px;

  letter-spacing:1px;

  text-transform:uppercase;
}

/* =========================
   INPUT
========================= */

input[type="text"]{

  width:100%;

  height:33px;

  padding:7px 9px;

  background:var(--panel2);

  border:1px solid var(--line);

  border-radius:4px;

  color:var(--text);

  outline:none;

  font-size:10px;
}

input[type="text"]:focus{

  border-color:var(--cyan);

  box-shadow:0 0 0 1px #28b9ef22;
}

input::placeholder{

  color:#52677f;
}

/* =========================
   ACTION BUTTON
========================= */

.action-btn{

  width:100%;

  height:33px;

  margin-top:5px;

  border:0;

  border-radius:4px;

  background:var(--cyan);

  color:#031019;

  font-size:9px;

  font-weight:bold;

  cursor:pointer;
}

.action-btn:hover{

  filter:brightness(1.08);
}

.action-btn:disabled{

  opacity:.5;

  cursor:wait;
}

.action-btn.green{

  background:var(--green);
}

/* =========================
   INTELLIGENCE PANEL
========================= */

.intelligence{

  min-height:0;

  margin-bottom:13px;
}

.result{

  min-height:110px;

  padding:8px;

  background:#091321;

  border:1px solid var(--line);

  border-radius:4px;

  font-size:9px;

  overflow:auto;
}

.result.empty{

  color:#536983;
}

.result.error{

  color:var(--red);
}

.result-row{

  display:grid;

  grid-template-columns:85px minmax(0,1fr);

  gap:6px;

  padding:4px 0;

  border-bottom:1px solid #ffffff08;
}

.result-key{

  color:#607792;
}

.result-value{

  color:#d6e3ef;

  overflow-wrap:anywhere;
}

/* =========================
   TELEMETRY
========================= */

.telemetry{

  height:145px;

  padding:8px;

  overflow:auto;

  background:#060c15;

  border:1px solid var(--line);

  border-radius:4px;

  color:#71859d;

  font-size:8px;

  line-height:1.5;

  white-space:pre-wrap;

  word-break:break-word;
}

.telemetry.ok{

  color:var(--green);
}

.telemetry.error{

  color:var(--red);
}

/* =========================
   MAP
========================= */

.map-wrapper{

  min-width:0;
  min-height:0;

  position:relative;

  overflow:hidden;

  border:1px solid var(--line);

  border-radius:6px;

  background:#050a12;
}

#map{

  width:100%;
  height:100%;

  background:#050a12;
}

/* =========================
   MAP STATUS
========================= */

.map-status{

  position:absolute;

  left:8px;
  bottom:8px;

  z-index:1000;

  padding:5px 8px;

  background:#050a14dd;

  border:1px solid #1c3854;

  border-radius:4px;

  color:#72869e;

  font-size:8px;

  pointer-events:none;
}

/* =========================
   FOOTER
========================= */

.footer{

  min-width:0;

  display:flex;

  align-items:center;

  gap:14px;

  padding:3px 8px;

  background:var(--panel);

  border:1px solid var(--line);

  border-radius:4px;

  color:#536983;

  font-size:7px;

  white-space:nowrap;

  overflow:hidden;
}

.footer b{

  color:var(--cyan);
}

/* =========================
   LEAFLET CONTROLS
========================= */

.leaflet-control-zoom{

  margin-top:10px!important;
  margin-left:10px!important;
}

.leaflet-control-zoom a{

  background:#0b1423!important;

  color:#dce7f3!important;

  border-color:#233650!important;
}

.leaflet-control-attribution{

  background:#050a14cc!important;

  color:#71859c!important;
}

.leaflet-control-attribution a{

  color:#5e9dbb!important;
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip{

  background:#0b1524;

  color:#dce7f3;
}

/* =========================
   CYBER DARK
========================= */

.cyber-dark{

  filter:
    brightness(.50)
    contrast(1.18)
    saturate(.55)
    hue-rotate(8deg);
}

/* =========================
   NO RESPONSIVE RE-LAYOUT
========================= */

/*
   Deliberately no max-width media query.

   ArgusScope stays in the same two-panel layout
   when the browser/tablet changes its visual
   viewport during map gestures.
*/

</style>
</head>

<body>

<div id="app">

  <!-- =====================
       NAVBAR
  ====================== -->

  <header class="navbar">

    <div class="brand">

      <div class="brand-dot"></div>

      <span class="brand-name">
        ArgusScope
      </span>

      <span class="brand-slash">
        //
      </span>

      <span class="brand-sub">
        INTELLIGENCE ENGINE
      </span>

    </div>


    <div class="nav-controls">

      <!-- MAP VIEWS -->

      <div class="view-container">

        <button
          class="nav-btn"
          id="viewsButton"
        >
          ◈ VIEWS ▾
        </button>


        <div
          class="view-menu"
          id="viewMenu"
        >

          <div class="view-title">
            MAP VIEW
          </div>


          <button
            class="view-option active"
            data-layer="satellite"
          >
            ◈ ESRI SATELLITE
          </button>


          <button
            class="view-option"
            data-layer="osm"
          >
            □ OPENSTREETMAP
          </button>


          <button
            class="view-option"
            data-layer="dark"
          >
            ◉ CYBER DARK
          </button>


          <button
            class="view-option"
            id="googleMapsButton"
          >
            ◎ GOOGLE MAPS ↗
          </button>

        </div>

      </div>


      <!-- SEPARATE DEVICE GPS -->

      <button
        class="nav-btn gps"
        id="gpsButton"
      >
        ⌖ DEVICE GPS
      </button>

    </div>

  </header>


  <!-- =====================
       WORKSPACE
  ====================== -->

  <main class="workspace">


    <!-- SIDEBAR -->

    <aside class="sidebar">


      <!-- IP -->

      <section class="control-group">

        <div class="section-title">
          // 01. STANDARD IP LOOKUP
        </div>


        <input
          type="text"
          id="ipInput"
          autocomplete="off"
          inputmode="decimal"
          placeholder="Enter Target IP (e.g. 8.8.8.8)"
        >


        <button
          class="action-btn"
          id="ipButton"
        >
          EXECUTE IP SEARCH
        </button>

      </section>


      <!-- BSSID -->

      <section class="control-group">

        <div class="section-title">
          // 02. WIGLE BSSID LOOKUP
        </div>


        <input
          type="text"
          id="bssidInput"
          autocomplete="off"
          placeholder="AA:BB:CC:DD:EE:FF"
        >


        <button
          class="action-btn green"
          id="bssidButton"
        >
          LOCATE BSSID
        </button>

      </section>


      <!-- INTELLIGENCE -->

      <section class="intelligence">

        <div class="section-title">
          // 03. INTELLIGENCE
        </div>


        <div
          class="result empty"
          id="result"
        >
          Awaiting target acquisition...
        </div>

      </section>


      <!-- TELEMETRY -->

      <section class="control-group">

        <div class="section-title">
          // 04. TELEMETRY
        </div>


        <div
          class="telemetry"
          id="telemetry"
        >System initialized.
Awaiting target acquisition...</div>

      </section>

    </aside>


    <!-- MAP -->

    <section class="map-wrapper">

      <div id="map"></div>


      <div
        class="map-status"
        id="mapStatus"
      >
        MAP // READY
      </div>

    </section>

  </main>


  <!-- =====================
       FOOTER
  ====================== -->

  <footer class="footer">

    <b>ARGUSSCOPE</b>

    <span>
      BACKEND // RENDER
    </span>

    <span id="sourceStatus">
      SOURCE // STANDBY
    </span>

    <span id="coordStatus">
      COORD // —
    </span>

  </footer>

</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   CONFIG
===================================================== */

const BACKEND_URL =
  "https://argusscope-backend.onrender.com";


/* =====================================================
   MAP
===================================================== */

const map =
  L.map("map", {

    zoomControl:true,

    attributionControl:true,

    /* Leaflet handles touch zoom */

    touchZoom:true,

    scrollWheelZoom:true,

    doubleClickZoom:true,

    dragging:true

  }).setView(
    [20,0],
    2
  );


/* =====================================================
   MAP LAYERS
===================================================== */

const satellite =
  L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom:19,

      attribution:
        "Tiles © Esri"
    }
  );


const osm =
  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,

      attribution:
        "© OpenStreetMap contributors"
    }
  );


const dark =
  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
    {
      maxZoom:19,

      subdomains:"abcd",

      attribution:
        "© CARTO © OpenStreetMap",

      className:
        "cyber-dark"
    }
  );


/* DEFAULT */

satellite.addTo(map);


/* =====================================================
   STATE
===================================================== */

let currentMarker =
  null;

let currentCircle =
  null;

let lastLatitude =
  null;

let lastLongitude =
  null;


/* =====================================================
   DOM
===================================================== */

const ipInput =
  document.getElementById(
    "ipInput"
  );

const bssidInput =
  document.getElementById(
    "bssidInput"
  );

const ipButton =
  document.getElementById(
    "ipButton"
  );

const bssidButton =
  document.getElementById(
    "bssidButton"
  );

const gpsButton =
  document.getElementById(
    "gpsButton"
  );

const result =
  document.getElementById(
    "result"
  );

const telemetry =
  document.getElementById(
    "telemetry"
  );

const mapStatus =
  document.getElementById(
    "mapStatus"
  );

const sourceStatus =
  document.getElementById(
    "sourceStatus"
  );

const coordStatus =
  document.getElementById(
    "coordStatus"
  );

const viewsButton =
  document.getElementById(
    "viewsButton"
  );

const viewMenu =
  document.getElementById(
    "viewMenu"
  );


/* =====================================================
   TELEMETRY
===================================================== */

function setTelemetry(
  message,
  type="normal"
){

  telemetry.className =
    "telemetry";

  if(type==="ok")
    telemetry.classList.add("ok");

  if(type==="error")
    telemetry.classList.add("error");

  telemetry.textContent =
    message;
}


/* =====================================================
   SAFE RESPONSE PARSER
===================================================== */

async function readResponse(
  response
){

  const text =
    await response.text();


  /*
    This prevents:

    "Expecting value:
     line 1 column 1
     (char 0)"
  */

  if(!text.trim()){

    throw new Error(
      `Backend returned an empty response (HTTP ${response.status}).`
    );

  }


  let data;


  try{

    data =
      JSON.parse(text);

  }catch{

    throw new Error(
      `Backend returned invalid JSON (HTTP ${response.status}).`
    );

  }


  if(!response.ok){

    throw new Error(
      data.error ||
      data.detail ||
      `Backend returned HTTP ${response.status}.`
    );

  }


  return data;
}


/* =====================================================
   DISPLAY RESULT
===================================================== */

function clearResult(){

  result.className =
    "result";

  result.innerHTML =
    "";
}


function addResultRow(
  key,
  value
){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){

    return;

  }


  const row =
    document.createElement(
      "div"
    );

  row.className =
    "result-row";


  const keyElement =
    document.createElement(
      "div"
    );

  keyElement.className =
    "result-key";

  keyElement.textContent =
    key;


  const valueElement =
    document.createElement(
      "div"
    );

  valueElement.className =
    "result-value";

  valueElement.textContent =
    value;


  row.appendChild(
    keyElement
  );

  row.appendChild(
    valueElement
  );

  result.appendChild(
    row
  );
}


function displayResult(
  data
){

  clearResult();


  addResultRow(
    "IP / BSSID",
    data.ip ||
    data.bssid
  );


  addResultRow(
    "NETWORK",
    data.ssid
  );


  addResultRow(
    "CITY",
    data.city
  );


  addResultRow(
    "REGION",
    data.region
  );


  addResultRow(
    "COUNTRY",
    data.country
  );


  addResultRow(
    "LATITUDE",
    data.latitude
  );


  addResultRow(
    "LONGITUDE",
    data.longitude
  );


  addResultRow(
    "CONFIDENCE",
    data.confidence
  );


  addResultRow(
    "ACCURACY",
    data.accuracy_radius_m != null
      ? `${data.accuracy_radius_m} m`
      : null
  );


  addResultRow(
    "OBSERVATIONS",
    data.observations ||
    data.cluster_size
  );


  addResultRow(
    "SOURCE",
    data.source
  );


  if(!result.children.length){

    result.className =
      "result empty";

    result.textContent =
      "Backend returned no displayable intelligence.";

  }
}


/* =====================================================
   MAP TARGET
===================================================== */

function clearTarget(){

  if(currentMarker){

    map.removeLayer(
      currentMarker
    );

    currentMarker =
      null;
  }


  if(currentCircle){

    map.removeLayer(
      currentCircle
    );

    currentCircle =
      null;
  }
}


function renderMapPosition(
  lat,
  lon,
  radius,
  title
){

  lat =
    Number(lat);

  lon =
    Number(lon);


  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lon)
  ){

    throw new Error(
      "Backend returned invalid coordinates."
    );

  }


  lastLatitude =
    lat;

  lastLongitude =
    lon;


  clearTarget();


  currentMarker =
    L.marker(
      [lat,lon]
    )
    .addTo(map);


  currentMarker.bindPopup(
    `<b>${title}</b><br>
     Latitude: ${lat.toFixed(6)}<br>
     Longitude: ${lon.toFixed(6)}`
  );


  const radiusNumber =
    Number(radius);


  if(
    Number.isFinite(radiusNumber) &&
    radiusNumber > 0
  ){

    currentCircle =
      L.circle(
        [lat,lon],
        {

          radius:
            Math.min(
              radiusNumber,
              100000
            ),

          color:
            "#28b9ef",

          fillColor:
            "#28b9ef",

          fillOpacity:
            0.10,

          weight:1

        }
      )
      .addTo(map);

  }


  /*
    Use a sensible zoom based on
    the uncertainty radius instead
    of always forcing zoom 16.
  */

  let zoom = 9;


  if(radiusNumber > 100000){

    zoom = 4;

  }else if(radiusNumber > 50000){

    zoom = 5;

  }else if(radiusNumber > 10000){

    zoom = 7;

  }else if(radiusNumber > 3000){

    zoom = 9;

  }else if(radiusNumber > 1000){

    zoom = 11;

  }else{

    zoom = 14;

  }


  map.setView(
    [lat,lon],
    zoom,
    {
      animate:true
    }
  );


  mapStatus.textContent =
    `MAP // ${lat.toFixed(5)}, ${lon.toFixed(5)}`;


  coordStatus.textContent =
    `COORD // ${lat.toFixed(5)}, ${lon.toFixed(5)}`;


  map.once(
    "moveend",
    ()=>{
      currentMarker.openPopup();
    }
  );
}


/* =====================================================
   IP LOOKUP
===================================================== */

async function executeIpSearch(){

  const ip =
    ipInput.value.trim();


  if(!ip){

    result.className =
      "result error";

    result.textContent =
      "Enter an IP address.";

    return;
  }


  ipButton.disabled =
    true;

  ipButton.textContent =
    "QUERYING...";


  setTelemetry(
    `IP lookup requested:\n${ip}\n\nContacting ArgusScope backend...`
  );


  try{

    const response =
      await fetch(
        `${BACKEND_URL}/api/v1/locate-ip?ip=${encodeURIComponent(ip)}`,
        {
          method:"GET",

          headers:{
            "Accept":
              "application/json"
          },

          cache:"no-store"
        }
      );


    const data =
      await readResponse(
        response
      );


    if(
      data.error
    ){

      throw new Error(
        data.error
      );

    }


    displayResult(
      data
    );


    if(
      data.latitude != null &&
      data.longitude != null
    ){

      renderMapPosition(
        data.latitude,
        data.longitude,
        data.accuracy_radius_m ||
          5000,
        `IP Target: ${
          data.ip || ip
        }`
      );

    }


    setTelemetry(
      `IP LOOKUP COMPLETE\n\n`+
      `Target: ${data.ip || ip}\n`+
      `Coordinates: ${
        data.latitude ?? "—"
      }, ${
        data.longitude ?? "—"
      }\n`+
      `Source: ${
        data.source || "Unknown"
      }`,
      "ok"
    );


    sourceStatus.textContent =
      `SOURCE // ${
        data.source || "IP GEOLOCATION"
      }`;

  }catch(error){

    result.className =
      "result error";

    result.textContent =
      error.message;


    setTelemetry(
      `IP LOOKUP FAILED\n\n${error.message}`,
      "error"
    );

  }finally{

    ipButton.disabled =
      false;

    ipButton.textContent =
      "EXECUTE IP SEARCH";

  }
}


/* =====================================================
   BSSID LOOKUP
===================================================== */

async function executeBssidSearch(){

  const raw =
    bssidInput.value.trim();


  if(!raw){

    result.className =
      "result error";

    result.textContent =
      "Enter a BSSID.";

    return;
  }


  const macList =
    raw
      .split(",")
      .map(
        value =>
          value.trim()
      )
      .filter(
        Boolean
      );


  bssidButton.disabled =
    true;

  bssidButton.textContent =
    "QUERYING...";


  try{

    let endpoint;

    let options;


    if(
      macList.length > 1
    ){

      endpoint =
        `${BACKEND_URL}/api/v1/triangulate-cluster`;


      options = {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json",

          "Accept":
            "application/json"
        },

        body:
          JSON.stringify({

            scans:
              macList.map(
                mac => ({
                  netid:mac,
                  rssi:-65
                })
              )

          })

      };


      setTelemetry(
        `MULTI-BSSID LOOKUP\n\n`+
        `Nodes: ${macList.length}\n`+
        `Computing cluster position...`
      );

    }else{

      endpoint =
        `${BACKEND_URL}/api/v1/locate-bssid?netid=${
          encodeURIComponent(
            macList[0]
          )
        }`;


      options = {

        method:"GET",

        headers:{
          "Accept":
            "application/json"
        },

        cache:"no-store"
      };


      setTelemetry(
        `BSSID LOOKUP\n\n`+
        `Target: ${macList[0]}\n`+
        `Contacting ArgusScope backend...`
      );

    }


    const response =
      await fetch(
        endpoint,
        options
      );


    const data =
      await readResponse(
        response
      );


    if(
      data.error
    ){

      throw new Error(
        data.error
      );

    }


    displayResult(
      data
    );


    if(
      data.latitude != null &&
      data.longitude != null
    ){

      const label =
        data.cluster_size
          ? `Cluster Target (${data.cluster_size} Nodes)`
          : `BSSID: ${
              data.bssid ||
              macList[0]
            }`;


      renderMapPosition(
        data.latitude,
        data.longitude,
        data.accuracy_radius_m ||
          25,
        label
      );

    }


    setTelemetry(
      `BSSID LOOKUP COMPLETE\n\n`+
      `Target: ${
        data.bssid ||
        macList[0]
      }\n`+
      `Coordinates: ${
        data.latitude ?? "—"
      }, ${
        data.longitude ?? "—"
      }\n`+
      `Source: ${
        data.source || "WiGLE"
      }`,
      "ok"
    );


  }catch(error){

    result.className =
      "result error";

    result.textContent =
      error.message;


    setTelemetry(
      `BSSID LOOKUP FAILED\n\n${error.message}`,
      "error"
    );

  }finally{

    bssidButton.disabled =
      false;

    bssidButton.textContent =
      "LOCATE BSSID";

  }
}


/* =====================================================
   DEVICE GPS
===================================================== */

gpsButton.addEventListener(
  "click",
  ()=>{
    
    if(
      !navigator.geolocation
    ){

      setTelemetry(
        "DEVICE GPS FAILED\n\n"+
        "Geolocation is not supported by this browser.",
        "error"
      );

      return;
    }


    gpsButton.disabled =
      true;

    setTelemetry(
      "DEVICE GPS\n\n"+
      "Requesting location permission..."
    );


    navigator.geolocation.getCurrentPosition(

      position => {

        const lat =
          position.coords.latitude;

        const lon =
          position.coords.longitude;

        const accuracy =
          position.coords.accuracy;


        renderMapPosition(
          lat,
          lon,
          accuracy,
          "Device GPS"
        );


        clearResult();


        addResultRow(
          "SOURCE",
          "DEVICE GPS"
        );


        addResultRow(
          "LATITUDE",
          lat.toFixed(6)
        );


        addResultRow(
          "LONGITUDE",
          lon.toFixed(6)
        );


        addResultRow(
          "ACCURACY",
          `±${Math.round(accuracy)} m`
        );


        setTelemetry(
          `DEVICE GPS LOCK ACQUIRED\n\n`+
          `Latitude: ${lat.toFixed(6)}\n`+
          `Longitude: ${lon.toFixed(6)}\n`+
          `Accuracy: ±${Math.round(accuracy)} m`,
          "ok"
        );


        sourceStatus.textContent =
          "SOURCE // DEVICE GPS";

      },


      error => {

        setTelemetry(
          `DEVICE GPS FAILED\n\n${
            error.message
          }`,
          "error"
        );

      },


      {
        enableHighAccuracy:true,

        timeout:15000,

        maximumAge:30000

      }

    );


    setTimeout(
      ()=>{
        gpsButton.disabled =
          false;
      },
      500
    );

  }
);


/* =====================================================
   MAP VIEW MENU
===================================================== */

viewsButton.addEventListener(
  "click",
  event => {

    event.stopPropagation();

    viewMenu.classList.toggle(
      "open"
    );

  }
);


document.addEventListener(
  "click",
  event => {

    if(
      !viewMenu.contains(
        event.target
      ) &&
      event.target !==
        viewsButton
    ){

      viewMenu.classList.remove(
        "open"
      );

    }

  }
);


/* =====================================================
   MAP LAYER SWITCHING
===================================================== */

document
  .querySelectorAll(
    ".view-option[data-layer]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        ()=>{

          const layer =
            button.dataset.layer;


          map.removeLayer(
            satellite
          );

          map.removeLayer(
            osm
          );

          map.removeLayer(
            dark
          );


          if(
            layer ===
            "satellite"
          ){

            satellite.addTo(
              map
            );

            mapStatus.textContent =
              "MAP // ESRI SATELLITE";

          }


          if(
            layer ===
            "osm"
          ){

            osm.addTo(
              map
            );

            mapStatus.textContent =
              "MAP // OPENSTREETMAP";

          }


          if(
            layer ===
            "dark"
          ){

            dark.addTo(
              map
            );

            mapStatus.textContent =
              "MAP // CYBER DARK";

          }


          document
            .querySelectorAll(
              ".view-option[data-layer]"
            )
            .forEach(
              option =>
                option.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          viewMenu.classList.remove(
            "open"
          );

        }
      );

    }
  );


/* =====================================================
   GOOGLE MAPS
===================================================== */

document
  .getElementById(
    "googleMapsButton"
  )
  .addEventListener(
    "click",
    ()=>{

      if(
        lastLatitude === null ||
        lastLongitude === null
      ){

        setTelemetry(
          "GOOGLE MAPS\n\n"+
          "No target coordinates are available yet.",
          "error"
        );

        return;
      }


      const url =
        "https://www.google.com/maps/search/?api=1&query="+
        encodeURIComponent(
          `${lastLatitude},${lastLongitude}`
        );


      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );


      setTelemetry(
        "GOOGLE MAPS\n\n"+
        `Opening:\n`+
        `${lastLatitude}, ${lastLongitude}`,
        "ok"
      );


      viewMenu.classList.remove(
        "open"
      );

    }
  );


/* =====================================================
   ENTER KEY
===================================================== */

ipInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Enter"
    ){

      executeIpSearch();

    }

  }
);


bssidInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Enter"
    ){

      executeBssidSearch();

    }

  }
);


/* =====================================================
   STARTUP
===================================================== */

setTelemetry(
  "ArgusScope frontend initialized.\n"+
  "Backend: Render\n"+
  "Status: Ready."
);


/*
   Fix Leaflet dimensions after the page
   becomes visible / after orientation or
   browser UI changes.

   This does NOT change the page layout.
*/

window.addEventListener(
  "resize",
  ()=>{
    setTimeout(
      ()=>{
        map.invalidateSize({
          pan:false
        });
      },
      100
    );
  }
);


setTimeout(
  ()=>{
    map.invalidateSize({
      pan:false
    });
  },
  300
);

</script>
