<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ArgusScope // Intelligence Engine</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
  --bg:#050a14;
  --panel:#0b1322;
  --panel2:#101b2e;
  --line:#1a2b46;
  --text:#dce8f5;
  --muted:#667c98;
  --cyan:#29baf2;
  --green:#12c58b;
  --red:#ff5364;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:"JetBrains Mono",Consolas,monospace;
}

button,input{font:inherit}

.app{
  height:100vh;
  padding:10px;
  display:grid;
  grid-template-rows:48px 1fr 24px;
  gap:8px;
}

/* HEADER */

header{
  border:1px solid var(--line);
  border-radius:6px;
  background:var(--panel);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:7px 12px;
}

.logo{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:bold;
  letter-spacing:.5px;
}

.logo i{
  width:11px;
  height:11px;
  background:var(--cyan);
  border-radius:2px;
  box-shadow:0 0 12px #29baf288;
}

.logo span{color:var(--cyan)}

.tools{
  display:flex;
  gap:5px;
}

.tool{
  border:1px solid var(--line);
  background:#0d1829;
  color:#71849d;
  padding:6px 9px;
  border-radius:4px;
  font-size:9px;
  cursor:pointer;
}

.tool.active{
  background:var(--cyan);
  color:#031019;
  border-color:var(--cyan);
}

.tool.gps.active{
  background:var(--green);
  border-color:var(--green);
}

/* MAIN */

main{
  min-height:0;
  display:grid;
  grid-template-columns:300px 1fr;
  gap:8px;
}

.sidebar{
  min-height:0;
  overflow:auto;
  padding:11px;
  border:1px solid var(--line);
  border-radius:6px;
  background:var(--panel);
}

.section{
  margin-bottom:13px;
}

.title{
  color:var(--cyan);
  font-size:9px;
  letter-spacing:1px;
  margin-bottom:6px;
}

input{
  width:100%;
  height:34px;
  border:1px solid var(--line);
  border-radius:4px;
  background:var(--panel2);
  color:var(--text);
  padding:7px 9px;
  outline:none;
  font-size:10px;
}

input:focus{
  border-color:var(--cyan);
}

input::placeholder{
  color:#536780;
}

.action{
  width:100%;
  height:34px;
  margin-top:5px;
  border:0;
  border-radius:4px;
  background:var(--cyan);
  color:#031019;
  font-weight:bold;
  font-size:9px;
  cursor:pointer;
}

.action.green{
  background:var(--green);
}

.action:disabled{
  opacity:.5;
}

.result{
  min-height:120px;
  padding:8px;
  border:1px solid var(--line);
  border-radius:4px;
  background:#091322;
  font-size:9px;
}

.empty{
  color:#526680;
}

.error{
  color:var(--red);
}

.row{
  display:grid;
  grid-template-columns:90px 1fr;
  gap:7px;
  padding:4px 0;
  border-bottom:1px solid #ffffff08;
}

.key{
  color:#637995;
}

.value{
  overflow-wrap:anywhere;
}

.terminal{
  min-height:100px;
  max-height:160px;
  overflow:auto;
  padding:8px;
  border:1px solid var(--line);
  border-radius:4px;
  background:#060c15;
  color:#7187a2;
  font-size:8px;
  line-height:1.55;
}

.ok{color:var(--green)}
.info{color:var(--cyan)}
.err{color:var(--red)}

/* MAP */

.map{
  min-width:0;
  min-height:0;
  position:relative;
  border:1px solid var(--line);
  border-radius:6px;
  overflow:hidden;
}

#map{
  width:100%;
  height:100%;
}

.map-status{
  position:absolute;
  z-index:999;
  left:8px;
  bottom:8px;
  padding:5px 8px;
  background:#050a14dd;
  border:1px solid #1b3653;
  border-radius:4px;
  color:#6e849d;
  font-size:8px;
  pointer-events:none;
}

/* FOOTER */

footer{
  border:1px solid var(--line);
  border-radius:4px;
  background:var(--panel);
  display:flex;
  align-items:center;
  gap:15px;
  padding:4px 8px;
  color:#526680;
  font-size:7px;
  white-space:nowrap;
  overflow:hidden;
}

footer b{
  color:var(--cyan);
}

/* LEAFLET */

.leaflet-control-zoom a{
  background:#0a1220!important;
  color:#c5d7e9!important;
  border-color:#213653!important;
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip{
  background:#0b1524;
  color:#dce8f5;
}

@media(max-width:750px){
  main{
    grid-template-columns:250px 1fr;
  }

  .app{
    padding:6px;
    gap:6px;
  }

  .tool{
    padding:5px 6px;
  }

  .logo{
    font-size:11px;
  }
}

@media(max-width:600px){
  html,body{
    overflow:auto;
  }

  .app{
    height:auto;
    min-height:100vh;
    grid-template-rows:48px auto 24px;
  }

  main{
    grid-template-columns:1fr;
    grid-template-rows:auto 55vh;
  }

  .map{
    min-height:400px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">
    <i></i>
    ArgusScope <span>//</span> INTELLIGENCE ENGINE
  </div>

  <div class="tools">
    <button class="tool gps" id="gps">⌖ GPS</button>
    <button class="tool active" id="sat">◈ SATELLITE</button>
    <button class="tool" id="dark">◉ DARK</button>
  </div>
</header>

<main>

<aside class="sidebar">

  <section class="section">
    <div class="title">// 01. STANDARD IP LOOKUP</div>

    <input
      id="ip"
      placeholder="Enter target IP (e.g. 8.8.8.8)"
      autocomplete="off"
    >

    <button class="action" id="ipBtn">
      EXECUTE IP SEARCH
    </button>
  </section>


  <section class="section">
    <div class="title">// 02. WIGLE BSSID LOOKUP</div>

    <input
      id="bssid"
      placeholder="AA:BB:CC:DD:EE:FF"
      autocomplete="off"
    >

    <button class="action green" id="bssidBtn">
      LOCATE BSSID
    </button>
  </section>


  <section class="section">
    <div class="title">// 03. INTELLIGENCE</div>

    <div class="result empty" id="result">
      Awaiting target...
    </div>
  </section>


  <section class="section">
    <div class="title">// 04. TELEMETRY</div>

    <div class="terminal" id="terminal"></div>
  </section>

</aside>


<section class="map">

  <div id="map"></div>

  <div class="map-status" id="mapStatus">
    MAP // READY
  </div>

</section>

</main>


<footer>
  <b>ARGUSSCOPE</b>
  <span>BACKEND // RENDER</span>
  <span id="source">SOURCE // STANDBY</span>
  <span id="coords">COORD // —</span>
</footer>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API =
"https://argusscope-backend.onrender.com";


/* MAP */

const map=L.map("map").setView([20,0],2);

const satellite=L.tileLayer(
"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
{
  maxZoom:19,
  attribution:"Esri"
}
).addTo(map);

const dark=L.tileLayer(
"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
{
  maxZoom:20,
  attribution:"OpenStreetMap / CARTO"
}
);

let marker=null;
let circle=null;


/* ELEMENTS */

const ip=document.getElementById("ip");
const bssid=document.getElementById("bssid");

const ipBtn=document.getElementById("ipBtn");
const bssidBtn=document.getElementById("bssidBtn");

const result=document.getElementById("result");
const terminal=document.getElementById("terminal");

const mapStatus=document.getElementById("mapStatus");
const source=document.getElementById("source");
const coords=document.getElementById("coords");


/* TELEMETRY */

function log(text,type="info"){

  const line=document.createElement("div");

  line.className=type;

  line.textContent=
    "["+
    new Date().toLocaleTimeString()+
    "] "+
    text;

  terminal.appendChild(line);

  terminal.scrollTop=terminal.scrollHeight;
}


/* RESULT */

function display(data){

  result.className="result";
  result.innerHTML="";

  const fields=[
    ["IP / BSSID",data.ip||data.bssid],
    ["NETWORK",data.ssid],
    ["CITY",data.city],
    ["COUNTRY",data.country],
    ["LATITUDE",data.latitude],
    ["LONGITUDE",data.longitude],
    ["CONFIDENCE",data.confidence],
    ["RADIUS",data.accuracy_radius_m?
      data.accuracy_radius_m+" m":null],
    ["OBSERVATIONS",
      data.observations||data.cluster_size],
    ["SOURCE",data.source]
  ];

  fields.forEach(([key,value])=>{

    if(value===undefined||value===null) return;

    const row=document.createElement("div");
    row.className="row";

    row.innerHTML=
      `<div class="key">${key}</div>
       <div class="value">${value}</div>`;

    result.appendChild(row);
  });
}


/* MAP RESULT */

function plot(data){

  const lat=Number(data.latitude);
  const lon=Number(data.longitude);

  if(!Number.isFinite(lat)||!Number.isFinite(lon)){
    throw new Error("Invalid coordinates received.");
  }

  if(marker) map.removeLayer(marker);
  if(circle) map.removeLayer(circle);

  marker=L.marker([lat,lon]).addTo(map);

  marker.bindPopup(
    `<b>ARGUSSCOPE TARGET</b><br>
     ${lat.toFixed(5)}, ${lon.toFixed(5)}`
  ).openPopup();

  const radius=Number(data.accuracy_radius_m);

  if(Number.isFinite(radius)){

    circle=L.circle(
      [lat,lon],
      {
        radius:Math.min(radius,100000),
        color:"#29baf2",
        fillColor:"#29baf2",
        fillOpacity:.08
      }
    ).addTo(map);
  }

  let zoom=8;

  if(radius>50000) zoom=5;
  else if(radius>10000) zoom=7;
  else if(radius>1000) zoom=10;
  else zoom=13;

  map.setView([lat,lon],zoom);

  mapStatus.textContent=
    `MAP // ${lat.toFixed(5)}, ${lon.toFixed(5)}`;

  coords.textContent=
    `COORD // ${lat.toFixed(5)}, ${lon.toFixed(5)}`;

  source.textContent=
    `SOURCE // ${data.source||"UNKNOWN"}`;
}


/* IP LOOKUP */

async function locateIP(){

  const target=ip.value.trim();

  if(!target){
    result.className="result error";
    result.textContent="Enter an IP address.";
    return;
  }

  ipBtn.disabled=true;
  ipBtn.textContent="QUERYING...";

  log(`IP lookup: ${target}`);

  try{

    const response=await fetch(
      API+
      "/api/v1/locate-ip?ip="+
      encodeURIComponent(target)
    );

    if(!response.ok){
      throw new Error(
        "Backend HTTP "+response.status
      );
    }

    const data=await response.json();

    if(data.error){
      throw new Error(data.error);
    }

    display(data);
    plot(data);

    log(
      `Resolved ${data.ip||target}`,
      "ok"
    );

    log(
      `Coordinates: ${data.latitude}, ${data.longitude}`,
      "info"
    );

  }catch(error){

    result.className="result error";
    result.textContent=error.message;

    log(error.message,"err");

  }finally{

    ipBtn.disabled=false;
    ipBtn.textContent="EXECUTE IP SEARCH";
  }
}


/* BSSID */

async function locateBSSID(){

  const target=bssid.value.trim();

  if(!target){
    result.className="result error";
    result.textContent="Enter a BSSID.";
    return;
  }

  bssidBtn.disabled=true;
  bssidBtn.textContent="QUERYING...";

  log(`BSSID lookup: ${target}`);

  try{

    const response=await fetch(
      API+
      "/api/v1/locate-bssid?netid="+
      encodeURIComponent(target)
    );

    if(!response.ok){
      throw new Error(
        "Backend HTTP "+response.status
      );
    }

    const data=await response.json();

    if(data.error){
      throw new Error(data.error);
    }

    display(data);
    plot(data);

    log(
      `BSSID resolved: ${data.bssid}`,
      "ok"
    );

  }catch(error){

    result.className="result error";
    result.textContent=error.message;

    log(error.message,"err");

  }finally{

    bssidBtn.disabled=false;
    bssidBtn.textContent="LOCATE BSSID";
  }
}


/* GPS */

document.getElementById("gps").onclick=()=>{

  if(!navigator.geolocation){

    log("Browser GPS unavailable.","err");
    return;
  }

  log("Requesting device GPS...");

  navigator.geolocation.getCurrentPosition(

    position=>{

      const lat=position.coords.latitude;
      const lon=position.coords.longitude;

      L.marker([lat,lon])
        .addTo(map)
        .bindPopup("DEVICE GPS")
        .openPopup();

      map.setView([lat,lon],15);

      log(
        `GPS: ${lat.toFixed(5)}, ${lon.toFixed(5)}`,
        "ok"
      );
    },

    error=>{
      log(
        "GPS failed: "+error.message,
        "err"
      );
    }
  );
};


/* MAP MODES */

document.getElementById("sat").onclick=()=>{

  if(!map.hasLayer(satellite))
    map.addLayer(satellite);

  if(map.hasLayer(dark))
    map.removeLayer(dark);

  document.getElementById("sat")
    .classList.add("active");

  document.getElementById("dark")
    .classList.remove("active");
};


document.getElementById("dark").onclick=()=>{

  if(!map.hasLayer(dark))
    map.addLayer(dark);

  if(map.hasLayer(satellite))
    map.removeLayer(satellite);

  document.getElementById("dark")
    .classList.add("active");

  document.getElementById("sat")
    .classList.remove("active");
};


/* BUTTONS */

ipBtn.onclick=locateIP;
bssidBtn.onclick=locateBSSID;

ip.onkeydown=e=>{
  if(e.key==="Enter") locateIP();
};

bssid.onkeydown=e=>{
  if(e.key==="Enter") locateBSSID();
};


/* STARTUP */

log("ArgusScope frontend initialized.","ok");
log("Backend connection: Render","info");
log("Awaiting target...");

</script>

</body>
</html>
