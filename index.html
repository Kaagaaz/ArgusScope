<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArgusScope // Geospatial Intelligence Dashboard</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Control Panel */
        .sidebar {
            width: 420px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .header {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-cyan);
            margin-bottom: 20px;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .section-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            background-color: #030712;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        button {
            width: 100%;
            background-color: var(--accent-green);
            color: #030712;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Telemetry Terminal Output */
        .terminal {
            background-color: #030712;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
            font-size: 0.75rem;
            color: var(--accent-cyan);
            height: 220px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Map Container */
        #map {
            flex-grow: 1;
            height: 100%;
            background-color: var(--bg-color);
        }

        .helper-text {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Control Operations Sidebar -->
    <div class="sidebar">
        <div class="header">ArgusScope // RECON ENGINE</div>

        <!-- 01. IP Geolocation Lookup -->
        <div class="control-group">
            <div class="section-title">// 01. Standard IP Lookup</div>
            <input type="text" id="ipInput" placeholder="Enter target IP (e.g., 8.8.8.8)">
            <button onclick="executeIpSearch()">Execute IP Search</button>
        </div>

        <!-- 02. BSSID / Cluster Triangulation -->
        <div class="control-group">
            <div class="section-title">// 02. WiGLE BSSID Triangulation</div>
            <input type="text" id="bssidInput" placeholder="Single BSSID or comma-separated cluster">
            <div class="helper-text">Tip: Enter 1 MAC for standard lookup, or multiple separated by commas for multi-point cluster fusion.</div>
            <button onclick="executeBssidSearch()" style="background-color: var(--accent-cyan);">Triangulate Target</button>
        </div>

        <!-- 03. Telemetry Terminal -->
        <div class="control-group" style="flex-grow: 1; display: flex; flex-direction: column;">
            <div class="section-title">// 03. Telemetry Terminal</div>
            <div id="telemetryOutput" class="terminal">System initialized. Awaiting target acquisition parameters...</div>
        </div>
    </div>

    <!-- Map Canvas -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Initialize Leaflet Map centered over Europe/Global view
        const map = L.map('map').setView([30.0, 10.0], 3);

        // Add Dark Tactical Map Tiles (CartoDB Dark Matter)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
        }).addTo(map);

        let currentMarker = null;
        let currentAccuracyCircle = null;

        // Change this to your live Render backend URL once deployed
        const BACKEND_URL = "https://argusscope-backend.onrender.com";

        function renderMapPosition(lat, lon, radiusMeters, titleInfo) {
            if (currentMarker) map.removeLayer(currentMarker);
            if (currentAccuracyCircle) map.removeLayer(currentAccuracyCircle);

            // Drop Precise Coordinate Marker
            currentMarker = L.marker([lat, lon]).addTo(map)
                .bindPopup(`<b>${titleInfo}</b><br>Lat: ${lat}<br>Lon: ${lon}`).openPopup();

            // Draw Dynamic Precision Radius Ring
            currentAccuracyCircle = L.circle([lat, lon], {
                radius: radiusMeters,
                color: '#06b6d4',
                fillColor: '#06b6d4',
                fillOpacity: 0.15
            }).addTo(map);

            map.setView([lat, lon], 16); // High zoom snap to target
        }

        async function executeIpSearch() {
            const ip = document.getElementById("ipInput").value.trim();
            if (!ip) return;

            document.getElementById("telemetryOutput").innerText = `Querying IP telemetry for ${ip}...`;

            try {
                const response = await fetch(`${BACKEND_URL}/api/v1/locate-ip?ip=${encodeURIComponent(ip)}`);
                const data = await response.json();

                document.getElementById("telemetryOutput").innerText = JSON.stringify(data, null, 2);

                if (data.latitude && data.longitude) {
                    renderMapPosition(data.latitude, data.longitude, data.accuracy_radius_m || 5000, `IP Target: ${data.ip}`);
                } else {
                    alert("IP resolution failed: " + (data.error || "Unknown error"));
                }
            } catch (err) {
                document.getElementById("telemetryOutput").innerText = `Critical Network Error: ${err.message}`;
            }
        }

        async function executeBssidSearch() {
            const rawInput = document.getElementById("bssidInput").value.trim();
            if (!rawInput) return;

            const macList = rawInput.split(',').map(m => m.trim()).filter(m => m.length > 0);
            
            let endpoint = "";
            let options = {};

            if (macList.length > 1) {
                // Multi-Point Cluster Centroid Payload
                endpoint = `${BACKEND_URL}/api/v1/triangulate-cluster`;
                options = {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        scans: macList.map(mac => ({ netid: mac, rssi: -65 })) 
                    })
                };
                document.getElementById("telemetryOutput").innerText = `Computing multi-point sensor fusion across ${macList.length} nodes...`;
            } else {
                // Single BSSID Lookup Payload
                endpoint = `${BACKEND_URL}/api/v1/locate-bssid?netid=${encodeURIComponent(macList[0])}`;
                options = { method: "GET" };
                document.getElementById("telemetryOutput").innerText = `Querying single BSSID telemetry for ${macList[0]}...`;
            }

            try {
                const response = await fetch(endpoint, options);
                const data = await response.json();

                document.getElementById("telemetryOutput").innerText = JSON.stringify(data, null, 2);

                if (data.latitude && data.longitude) {
                    const label = data.cluster_size ? `Cluster Target (${data.cluster_size} Nodes)` : `BSSID: ${data.bssid}`;
                    renderMapPosition(data.latitude, data.longitude, data.accuracy_radius_m || 25, label);
                } else {
                    alert("Triangulation failed: " + (data.error || "Target not found"));
                }
            } catch (err) {
                document.getElementById("telemetryOutput").innerText = `Critical Network Error: ${err.message}`;
            }
        }
    </script>
</body>
</html>
