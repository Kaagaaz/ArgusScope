<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#070b12"
    >

    <title>ArgusScope</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >

    <style>

        /* =====================================================
           ARGUSSCOPE
           COMPACT OSINT GEOLOCATION FRONTEND
        ===================================================== */

        :root {
            --bg: #070b12;
            --panel: #0c121c;
            --panel2: #101824;

            --border: #1b2939;

            --text: #dce7f0;
            --muted: #708496;

            --cyan: #20b8ec;
            --green: #10c991;
            --red: #ef5968;
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {
            background: var(--bg);
            color: var(--text);

            font-family:
                "Courier New",
                Courier,
                monospace;

            overflow: hidden;

            -webkit-tap-highlight-color: transparent;
        }


        button,
        input {
            font-family: inherit;
        }


        button {
            user-select: none;
        }


        /* =====================================================
           TOP BAR
        ===================================================== */

        .topbar {
            position: relative;
            z-index: 3000;

            height: 54px;

            margin: 7px;

            padding: 0 9px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 8px;

            background: var(--panel);

            border: 1px solid var(--border);

            border-radius: 7px;
        }


        .brand {
            flex-shrink: 0;

            font-size: 13px;
            font-weight: bold;

            white-space: nowrap;
        }


        .brand-mark {
            color: var(--cyan);
            margin-right: 5px;
        }


        .brand-sub {
            color: var(--cyan);
            font-size: 9px;
        }


        /* =====================================================
           TOP BUTTONS
        ===================================================== */

        .top-actions {
            position: relative;

            display: flex;
            align-items: center;

            gap: 5px;
        }


        .top-btn {
            min-height: 33px;

            padding: 6px 9px;

            background: var(--panel2);

            color: var(--muted);

            border: 1px solid var(--border);

            border-radius: 5px;

            font-size: 8px;
            font-weight: bold;

            cursor: pointer;

            white-space: nowrap;
        }


        .top-btn:hover {
            color: var(--cyan);
            border-color: #28506a;
        }


        .top-btn.active {
            color: #041017;

            background: var(--cyan);

            border-color: var(--cyan);
        }


        #gpsButton {
            color: var(--green);

            border-color: #155540;
        }


        #gpsButton.active {
            color: #04140e;

            background: var(--green);

            border-color: var(--green);
        }


        /* =====================================================
           MAP MENU
        ===================================================== */

        .map-menu {
            position: absolute;

            top: 39px;
            right: 0;

            width: 180px;

            padding: 5px;

            display: none;
            flex-direction: column;

            gap: 3px;

            background: #0b121d;

            border: 1px solid var(--border);

            border-radius: 6px;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, .55);

            z-index: 5000;
        }


        .map-menu.open {
            display: flex;
        }


        .map-option {
            width: 100%;

            min-height: 35px;

            padding: 7px 9px;

            text-align: left;

            color: #8ca1b3;

            background: transparent;

            border: 0;

            border-radius: 4px;

            font-size: 8px;

            cursor: pointer;
        }


        .map-option:hover {
            color: var(--cyan);

            background: #142031;
        }


        .map-option.selected {
            color: var(--cyan);

            background: #101d2c;
        }


        /* =====================================================
           WORKSPACE
        ===================================================== */

        .workspace {
            height:
                calc(
                    100vh - 69px
                );

            margin:
                0 7px 7px;

            display: grid;

            grid-template-columns:
                295px
                minmax(0, 1fr);

            gap: 7px;

            min-height: 0;
        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            min-width: 0;
            min-height: 0;

            padding: 10px;

            display: flex;
            flex-direction: column;

            gap: 10px;

            overflow-y: auto;

            background: var(--panel);

            border: 1px solid var(--border);

            border-radius: 7px;

            scrollbar-width: thin;
        }


        .section {
            display: flex;
            flex-direction: column;

            gap: 5px;
        }


        .section-title {
            color: var(--cyan);

            font-size: 8px;

            letter-spacing: .8px;
        }


        /* =====================================================
           INPUTS
        ===================================================== */

        .input {
            width: 100%;

            height: 38px;

            padding: 0 9px;

            background: #080e17;

            color: var(--text);

            border: 1px solid var(--border);

            border-radius: 5px;

            outline: none;

            font-size: 10px;
        }


        .input::placeholder {
            color: #4f6477;
        }


        .input:focus {
            border-color: var(--cyan);

            box-shadow:
                0 0 0 2px
                rgba(32, 184, 236, .08);
        }


        /* =====================================================
           ACTION BUTTONS
        ===================================================== */

        .action-button {
            width: 100%;

            min-height: 38px;

            padding: 7px 9px;

            border: 0;

            border-radius: 5px;

            color: #041017;

            background: var(--cyan);

            font-size: 8px;
            font-weight: bold;

            letter-spacing: .4px;

            cursor: pointer;
        }


        .action-button.green {
            color: #03140e;

            background: var(--green);
        }


        .action-button:active {
            transform: translateY(1px);
        }


        .action-button:disabled {
            opacity: .55;

            cursor: wait;
        }


        /* =====================================================
           TERMINAL
        ===================================================== */

        .intelligence {
            min-height: 0;

            flex: 1;

            display: flex;
            flex-direction: column;

            gap: 5px;
        }


        .terminal {
            min-height: 120px;

            flex: 1;

            padding: 8px;

            overflow: auto;

            white-space: pre-wrap;

            overflow-wrap: anywhere;

            background: #050a11;

            color: var(--cyan);

            border: 1px solid var(--border);

            border-radius: 5px;

            font-size: 8px;

            line-height: 1.5;

            scrollbar-width: thin;
        }


        .terminal.success {
            color: var(--green);
        }


        .terminal.error {
            color: var(--red);
        }


        /* =====================================================
           MAP CONTAINER
        ===================================================== */

        .map-container {
            position: relative;

            min-width: 0;
            min-height: 0;

            overflow: hidden;

            background: #05080d;

            border: 1px solid var(--border);

            border-radius: 7px;
        }


        #map {
            width: 100%;
            height: 100%;
        }


        /* =====================================================
           MAP STATUS
        ===================================================== */

        .map-status {
            position: absolute;

            left: 8px;
            bottom: 8px;

            z-index: 1000;

            max-width:
                calc(100% - 16px);

            padding: 5px 7px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            pointer-events: none;

            background:
                rgba(5, 9, 15, .88);

            color: var(--cyan);

            border: 1px solid var(--border);

            border-radius: 4px;

            font-size: 7px;
        }


        /* =====================================================
           CYBER DARK
        ===================================================== */

        .cyber-dark-tiles {
            filter:
                invert(92%)
                hue-rotate(180deg)
                brightness(78%)
                contrast(92%);
        }


        /* =====================================================
           LEAFLET
        ===================================================== */

        .leaflet-control-zoom {
            border: 0 !important;
        }


        .leaflet-control-zoom a {
            width: 33px !important;
            height: 33px !important;

            line-height: 33px !important;

            color: #d9e6ef !important;

            background:
                #0b121d !important;

            border-color:
                #223244 !important;
        }


        .leaflet-control-zoom a:hover {
            color: var(--cyan) !important;

            background:
                #101d2c !important;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {
            position: fixed;

            left: 9px;
            bottom: 2px;

            z-index: 1500;

            color: #3d5368;

            font-size: 6px;

            pointer-events: none;
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 900px) {

            .workspace {
                grid-template-columns:
                    255px
                    minmax(0, 1fr);
            }


            .brand-sub {
                display: none;
            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            body {
                overflow-y: auto;
                overflow-x: hidden;
            }


            .topbar {
                height: auto;

                min-height: 49px;

                margin: 6px;

                padding: 7px;

                flex-direction: column;

                align-items: stretch;

                gap: 6px;
            }


            .brand {
                font-size: 12px;
            }


            .top-actions {
                width: 100%;
            }


            .top-btn {
                flex: 1;

                min-height: 31px;

                padding: 5px 4px;

                font-size: 7px;
            }


            .map-menu {
                top: 35px;

                right: 0;

                width: 165px;
            }


            .workspace {
                height: auto;

                margin:
                    0 6px 25px;

                display: flex;

                flex-direction: column;

                gap: 7px;

                overflow: visible;
            }


            .sidebar {
                padding: 9px;

                gap: 9px;

                overflow: visible;
            }


            .section-title {
                font-size: 8px;
            }


            .input {
                height: 38px;

                font-size: 10px;
            }


            .action-button {
                min-height: 38px;

                font-size: 8px;
            }


            .intelligence {
                min-height: 120px;
            }


            .terminal {
                min-height: 105px;

                max-height: 175px;

                font-size: 8px;
            }


            .map-container {
                width: 100%;

                height: 50vh;

                min-height: 290px;
            }


            #map {
                min-height: 290px;
            }

        }


        /* =====================================================
           SMALL PHONES
        ===================================================== */

        @media (max-width: 380px) {

            .brand {
                font-size: 11px;
            }


            .top-btn {
                font-size: 7px;
            }


            .map-container {
                height: 46vh;

                min-height: 270px;
            }


            #map {
                min-height: 270px;
            }

        }


        /* =====================================================
           LANDSCAPE MOBILE
        ===================================================== */

        @media
        (max-width: 900px)
        and (orientation: landscape) {

            body {
                overflow: hidden;
            }


            .topbar {
                height: 46px;

                min-height: 46px;

                flex-direction: row;

                align-items: center;

                padding: 5px 8px;
            }


            .top-actions {
                width: auto;
            }


            .top-btn {
                flex: initial;
            }


            .workspace {
                height:
                    calc(
                        100vh - 59px
                    );

                display: grid;

                grid-template-columns:
                    245px
                    minmax(0, 1fr);

                margin-bottom: 4px;
            }


            .sidebar {
                overflow-y: auto;
            }


            .map-container {
                height: 100%;

                min-height: 0;
            }


            #map {
                min-height: 0;
            }


            .footer {
                display: none;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="topbar">

        <div class="brand">

            <span class="brand-mark">■</span>

            ARGUSSCOPE

        </div>


        <div class="top-actions">

            <button
                id="mapsButton"
                class="top-btn"
                type="button"
            >
                ◇ MAPS
            </button>


            <button
                id="gpsButton"
                class="top-btn"
                type="button"
            >
                ✦ GPS
            </button>


            <!-- =================================================
                 MAP SELECTION
            ================================================== -->

            <div
                id="mapMenu"
                class="map-menu"
            >

                <button
                    class="map-option selected"
                    data-map="street"
                    type="button"
                >
                    STREET MAP
                </button>


                <button
                    class="map-option"
                    data-map="google"
                    type="button"
                >
                    GOOGLE SATELLITE
                </button>


                <button
                    class="map-option"
                    data-map="esri"
                    type="button"
                >
                    ESRI SATELLITE
                </button>


                <button
                    class="map-option"
                    data-map="dark"
                    type="button"
                >
                    CYBER DARK
                </button>

            </div>

        </div>

    </header>



    <!-- =====================================================
         MAIN WORKSPACE
    ====================================================== -->

    <main class="workspace">


        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside class="sidebar">


            <!-- =================================================
                 IP LOOKUP
            ================================================== -->

            <section class="section">

                <div class="section-title">
                    // 01. IP LOOKUP
                </div>


                <input
                    id="ipInput"
                    class="input"
                    type="text"
                    inputmode="decimal"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Target IP"
                >


                <button
                    id="ipButton"
                    class="action-button"
                    type="button"
                >
                    EXECUTE IP SEARCH
                </button>

            </section>



            <!-- =================================================
                 BSSID LOOKUP
            ================================================== -->

            <section class="section">

                <div class="section-title">
                    // 02. BSSID LOOKUP
                </div>


                <input
                    id="bssidInput"
                    class="input"
                    type="text"
                    inputmode="text"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="AA:BB:CC:DD:EE:FF"
                >


                <button
                    id="bssidButton"
                    class="action-button green"
                    type="button"
                >
                    LOCATE BSSID
                </button>

            </section>



            <!-- =================================================
                 INTELLIGENCE OUTPUT
            ================================================== -->

            <section class="intelligence">

                <div class="section-title">
                    // 03. INTELLIGENCE
                </div>


                <div
                    id="terminal"
                    class="terminal"
                >ARGUSSCOPE // ONLINE

Waiting for target acquisition...</div>

            </section>

        </aside>



        <!-- =================================================
             MAP
        ================================================== -->

        <section class="map-container">

            <div id="map"></div>


            <div
                id="mapStatus"
                class="map-status"
            >
                MAP // STREET MAP
            </div>

        </section>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">
        ARGUSSCOPE // RENDER BACKEND // OPENSTREETMAP
    </footer>



    <!-- =====================================================
         LEAFLET
    ====================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""
    ></script>



    <script>

        /* =====================================================
           CONFIG
        ===================================================== */

        const BACKEND_URL =
            "https://argusscope-backend.onrender.com";


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const ipInput =
            document.getElementById(
                "ipInput"
            );


        const bssidInput =
            document.getElementById(
                "bssidInput"
            );


        const ipButton =
            document.getElementById(
                "ipButton"
            );


        const bssidButton =
            document.getElementById(
                "bssidButton"
            );


        const gpsButton =
            document.getElementById(
                "gpsButton"
            );


        const mapsButton =
            document.getElementById(
                "mapsButton"
            );


        const mapMenu =
            document.getElementById(
                "mapMenu"
            );


        const terminal =
            document.getElementById(
                "terminal"
            );


        const mapStatus =
            document.getElementById(
                "mapStatus"
            );


        /* =====================================================
           MAP INITIALIZATION
        ===================================================== */

        const map =
            L.map(
                "map",
                {
                    zoomControl: true,

                    attributionControl: true,

                    scrollWheelZoom: true,

                    doubleClickZoom: true,

                    dragging: true,

                    touchZoom: true
                }
            );


        /*
           Default location:
           Agartala, Tripura.
        */

        map.setView(
            [
                23.8315,
                91.2868
            ],
            13
        );


        /* =====================================================
           STREET MAP
        ===================================================== */

        /*
           OpenStreetMap Standard

           This is the detailed street layer.

           It can display mapped:
           - roads
           - street names
           - places
           - localities
           - landmarks
           - POIs
           - buildings
           - other mapped features

           No API key required.
        */

        const streetLayer =
            L.tileLayer(
                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                    maxZoom: 19,

                    attribution:
                        "&copy; OpenStreetMap contributors"
                }
            );


        /* =====================================================
           GOOGLE SATELLITE
        ===================================================== */

        const googleLayer =
            L.tileLayer(
                "https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",
                {
                    maxZoom: 20,

                    subdomains: [
                        "mt0",
                        "mt1",
                        "mt2",
                        "mt3"
                    ],

                    attribution:
                        "&copy; Google"
                }
            );


        /* =====================================================
           ESRI SATELLITE
        ===================================================== */

        const esriLayer =
            L.tileLayer(
                "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
                {
                    maxZoom: 19,

                    attribution:
                        "Tiles &copy; Esri"
                }
            );


        /* =====================================================
           CYBER DARK
        ===================================================== */

        /*
           Uses OpenStreetMap tiles and a local visual filter.

           No dark-map API key required.
        */

        const darkLayer =
            L.tileLayer(
                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                    maxZoom: 19,

                    className:
                        "cyber-dark-tiles",

                    attribution:
                        "&copy; OpenStreetMap contributors"
                }
            );


        /* =====================================================
           DEFAULT MAP
        ===================================================== */

        streetLayer.addTo(
            map
        );


        let currentLayer =
            "street";


        /* =====================================================
           LAYER HELPERS
        ===================================================== */

        function getLayer(
            name
        ) {

            switch (name) {

                case "google":
                    return googleLayer;

                case "esri":
                    return esriLayer;

                case "dark":
                    return darkLayer;

                case "street":
                default:
                    return streetLayer;
            }
        }


        function getLayerName(
            name
        ) {

            switch (name) {

                case "google":
                    return "GOOGLE SATELLITE";

                case "esri":
                    return "ESRI SATELLITE";

                case "dark":
                    return "CYBER DARK";

                case "street":
                default:
                    return "STREET MAP";
            }
        }


        /* =====================================================
           CHANGE MAP
        ===================================================== */

        function changeMap(
            name
        ) {

            const selectedLayer =
                getLayer(name);


            /*
               Remove every known layer first.
            */

            [
                streetLayer,
                googleLayer,
                esriLayer,
                darkLayer
            ].forEach(
                layer => {

                    if (
                        map.hasLayer(
                            layer
                        )
                    ) {

                        map.removeLayer(
                            layer
                        );
                    }

                }
            );


            /*
               Add selected layer.
            */

            selectedLayer.addTo(
                map
            );


            currentLayer =
                name;


            /*
               Update selection.
            */

            document
                .querySelectorAll(
                    ".map-option"
                )
                .forEach(
                    button => {

                        button.classList.toggle(
                            "selected",
                            button.dataset.map === name
                        );

                    }
                );


            mapStatus.textContent =
                "MAP // " +
                getLayerName(
                    name
                );


            /*
               Close menu.
            */

            mapMenu.classList.remove(
                "open"
            );


            mapsButton.classList.add(
                "active"
            );


            /*
               Fix Leaflet size after
               changing the map.
            */

            setTimeout(
                () => {

                    map.invalidateSize();

                },
                150
            );
        }


        /* =====================================================
           MAP MENU
        ===================================================== */

        mapsButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                mapMenu.classList.toggle(
                    "open"
                );

            }
        );


        mapMenu.addEventListener(
            "click",
            event => {

                const option =
                    event.target.closest(
                        ".map-option"
                    );


                if (!option) {
                    return;
                }


                changeMap(
                    option.dataset.map
                );

            }
        );


        document.addEventListener(
            "click",
            event => {

                if (
                    !mapMenu.contains(
                        event.target
                    ) &&
                    event.target !== mapsButton
                ) {

                    mapMenu.classList.remove(
                        "open"
                    );

                }

            }
        );


        /* =====================================================
           TARGET MARKER
        ===================================================== */

        let targetMarker =
            null;


        let targetCircle =
            null;


        function clearTarget() {

            if (targetMarker) {

                map.removeLayer(
                    targetMarker
                );

                targetMarker =
                    null;
            }


            if (targetCircle) {

                map.removeLayer(
                    targetCircle
                );

                targetCircle =
                    null;
            }
        }


        /* =====================================================
           SHOW TARGET
        ===================================================== */

        function showTarget(
            latitude,
            longitude,
            radius,
            title
        ) {

            const lat =
                Number(
                    latitude
                );


            const lon =
                Number(
                    longitude
                );


            const radiusValue =
                Number(
                    radius
                );


            if (
                !Number.isFinite(
                    lat
                ) ||
                !Number.isFinite(
                    lon
                )
            ) {

                throw new Error(
                    "Backend returned invalid coordinates."
                );
            }


            clearTarget();


            targetMarker =
                L.marker(
                    [
                        lat,
                        lon
                    ]
                )
                .addTo(
                    map
                );


            targetMarker.bindPopup(
                `
                    <strong>
                        ${escapeHtml(title)}
                    </strong>

                    <br>

                    Latitude:
                    ${lat.toFixed(6)}

                    <br>

                    Longitude:
                    ${lon.toFixed(6)}
                `
            );


            /*
               Accuracy radius.
            */

            if (
                Number.isFinite(
                    radiusValue
                ) &&
                radiusValue > 0
            ) {

                targetCircle =
                    L.circle(
                        [
                            lat,
                            lon
                        ],
                        {
                            radius:
                                radiusValue,

                            color:
                                "#20b8ec",

                            fillColor:
                                "#20b8ec",

                            fillOpacity:
                                .10,

                            weight:
                                1.5
                        }
                    )
                    .addTo(
                        map
                    );
            }


            /*
               Move to target.

               This happens only once after
               receiving a result.

               It does NOT continuously reset
               the user's zoom.
            */

            if (
                targetCircle
            ) {

                map.fitBounds(
                    targetCircle.getBounds(),
                    {
                        padding:
                            [
                                35,
                                35
                            ],

                        maxZoom:
                            16
                    }
                );

            } else {

                map.setView(
                    [
                        lat,
                        lon
                    ],
                    14
                );
            }


            mapStatus.textContent =
                "TARGET // " +
                lat.toFixed(4) +
                ", " +
                lon.toFixed(4);


            setTimeout(
                () => {

                    map.invalidateSize();

                },
                200
            );
        }


        /* =====================================================
           ESCAPE HTML
        ===================================================== */

        function escapeHtml(
            value
        ) {

            return String(
                value
            )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
        }


        /* =====================================================
           TERMINAL
        ===================================================== */

        function setTerminal(
            message,
            type = "normal"
        ) {

            terminal.className =
                "terminal";


            if (
                type ===
                "success"
            ) {

                terminal.classList.add(
                    "success"
                );
            }


            if (
                type ===
                "error"
            ) {

                terminal.classList.add(
                    "error"
                );
            }


            terminal.textContent =
                message;
        }


        /* =====================================================
           BUTTON LOADING
        ===================================================== */

        function setLoading(
            button,
            loading,
            text
        ) {

            if (
                loading
            ) {

                if (
                    !button.dataset.originalText
                ) {

                    button.dataset.originalText =
                        button.textContent;
                }


                button.disabled =
                    true;


                button.textContent =
                    text;

            } else {

                button.disabled =
                    false;


                button.textContent =
                    button.dataset.originalText ||
                    button.textContent;
            }
        }


        /* =====================================================
           RESPONSE PARSER
        ===================================================== */

        async function parseResponse(
            response
        ) {

            const text =
                await response.text();


            if (
                !text
            ) {

                throw new Error(
                    "Backend returned an empty response."
                );
            }


            try {

                return JSON.parse(
                    text
                );

            } catch {

                throw new Error(
                    "Backend returned a non-JSON response. HTTP " +
                    response.status
                );
            }
        }


        /* =====================================================
           IP LOOKUP
        ===================================================== */

        async function locateIP() {

            const ip =
                ipInput.value.trim();


            if (
                !ip
            ) {

                setTerminal(
                    "ERROR\n\nEnter an IP address.",
                    "error"
                );

                ipInput.focus();

                return;
            }


            setLoading(
                ipButton,
                true,
                "QUERYING..."
            );


            setTerminal(
                "ARGUSSCOPE // IP LOOKUP\n\n" +
                "Target: " +
                ip +
                "\n\n" +
                "Contacting intelligence backend..."
            );


            mapStatus.textContent =
                "MAP // QUERYING";


            try {

                const url =
                    BACKEND_URL +
                    "/api/v1/locate-ip?ip=" +
                    encodeURIComponent(
                        ip
                    );


                const response =
                    await fetch(
                        url,
                        {
                            method:
                                "GET",

                            headers:
                                {
                                    "Accept":
                                        "application/json"
                                },

                            cache:
                                "no-store"
                        }
                    );


                const data =
                    await parseResponse(
                        response
                    );


                if (
                    data.success ===
                        true &&
                    data.latitude !=
                        null &&
                    data.longitude !=
                        null
                ) {

                    setTerminal(
                        JSON.stringify(
                            data,
                            null,
                            2
                        ),
                        "success"
                    );


                    showTarget(
                        data.latitude,
                        data.longitude,
                        data.accuracy_radius_m,
                        "IP: " +
                        (
                            data.ip ||
                            ip
                        )
                    );

                } else {

                    setTerminal(
                        "IP LOOKUP FAILED\n\n" +
                        (
                            data.error ||
                            "No location data returned."
                        ),
                        "error"
                    );


                    mapStatus.textContent =
                        "MAP // NO RESULT";
                }

            } catch (
                error
            ) {

                setTerminal(
                    "IP LOOKUP ERROR\n\n" +
                    error.message,
                    "error"
                );


                mapStatus.textContent =
                    "MAP // BACKEND ERROR";

            } finally {

                setLoading(
                    ipButton,
                    false
                );
            }
        }


        /* =====================================================
           BSSID NORMALIZATION
        ===================================================== */

        function normalizeBssid(
            value
        ) {

            return value
                .trim()
                .toLowerCase()
                .replace(
                    /-/g,
                    ":"
                );
        }


        function isValidBssid(
            value
        ) {

            const clean =
                value
                    .replace(
                        /:/g,
                        ""
                    )
                    .trim();


            return /^[0-9a-fA-F]{12}$/
                .test(
                    clean
                );
        }


        /* =====================================================
           BSSID LOOKUP
        ===================================================== */

        async function locateBssid() {

            const raw =
                bssidInput.value.trim();


            if (
                !raw
            ) {

                setTerminal(
                    "ERROR\n\nEnter a BSSID.",
                    "error"
                );

                bssidInput.focus();

                return;
            }


            const bssids =
                raw
                    .split(",")
                    .map(
                        normalizeBssid
                    )
                    .filter(
                        Boolean
                    );


            for (
                const bssid
                of bssids
            ) {

                if (
                    !isValidBssid(
                        bssid
                    )
                ) {

                    setTerminal(
                        "INVALID BSSID\n\n" +
                        bssid +
                        "\n\n" +
                        "Expected format:\n" +
                        "AA:BB:CC:DD:EE:FF",
                        "error"
                    );

                    return;
                }
            }


            setLoading(
                bssidButton,
                true,
                "QUERYING..."
            );


            mapStatus.textContent =
                "MAP // QUERYING";


            try {

                /*
                   SINGLE BSSID
                */

                if (
                    bssids.length ===
                    1
                ) {

                    setTerminal(
                        "ARGUSSCOPE // BSSID LOOKUP\n\n" +
                        "Target: " +
                        bssids[0] +
                        "\n\n" +
                        "Querying WiGLE..."
                    );


                    const url =
                        BACKEND_URL +
                        "/api/v1/locate-bssid?netid=" +
                        encodeURIComponent(
                            bssids[0]
                        );


                    const response =
                        await fetch(
                            url,
                            {
                                method:
                                    "GET",

                                headers:
                                    {
                                        "Accept":
                                            "application/json"
                                    },

                                cache:
                                    "no-store"
                            }
                        );


                    const data =
                        await parseResponse(
                            response
                        );


                    if (
                        data.success ===
                            true &&
                        data.latitude !=
                            null &&
                        data.longitude !=
                            null
                    ) {

                        setTerminal(
                            JSON.stringify(
                                data,
                                null,
                                2
                            ),
                            "success"
                        );


                        showTarget(
                            data.latitude,
                            data.longitude,
                            data.accuracy_radius_m,
                            "BSSID: " +
                            (
                                data.bssid ||
                                bssids[0]
                            )
                        );

                    } else {

                        setTerminal(
                            "BSSID LOOKUP FAILED\n\n" +
                            (
                                data.error ||
                                "BSSID was not found."
                            ),
                            "error"
                        );


                        mapStatus.textContent =
                            "MAP // NO RESULT";
                    }


                    return;
                }


                /*
                   MULTI-BSSID CLUSTER
                */

                setTerminal(
                    "ARGUSSCOPE // CLUSTER FUSION\n\n" +
                    "Targets: " +
                    bssids.length +
                    "\n\n" +
                    "Querying WiGLE cluster..."
                );


                const scans =
                    bssids.map(
                        bssid => ({
                            netid:
                                bssid,

                            rssi:
                                -65
                        })
                    );


                const response =
                    await fetch(
                        BACKEND_URL +
                        "/api/v1/triangulate-cluster",
                        {
                            method:
                                "POST",

                            headers:
                                {
                                    "Content-Type":
                                        "application/json",

                                    "Accept":
                                        "application/json"
                                },

                            body:
                                JSON.stringify(
                                    {
                                        scans:
                                            scans
                                    }
                                )
                        }
                    );


                const data =
                    await parseResponse(
                        response
                    );


                if (
                    data.success ===
                        true &&
                    data.latitude !=
                        null &&
                    data.longitude !=
                        null
                ) {

                    setTerminal(
                        JSON.stringify(
                            data,
                            null,
                            2
                        ),
                        "success"
                    );


                    showTarget(
                        data.latitude,
                        data.longitude,
                        data.accuracy_radius_m,
                        "BSSID Cluster"
                    );

                } else {

                    setTerminal(
                        "CLUSTER LOOKUP FAILED\n\n" +
                        (
                            data.error ||
                            "No valid cluster coordinates returned."
                        ),
                        "error"
                    );


                    mapStatus.textContent =
                        "MAP // NO RESULT";
                }

            } catch (
                error
            ) {

                setTerminal(
                    "BSSID LOOKUP ERROR\n\n" +
                    error.message,
                    "error"
                );


                mapStatus.textContent =
                    "MAP // BACKEND ERROR";

            } finally {

                setLoading(
                    bssidButton,
                    false
                );
            }
        }


        /* =====================================================
           DEVICE GPS
        ===================================================== */

        function locateDevice() {

            if (
                !navigator.geolocation
            ) {

                setTerminal(
                    "GPS ERROR\n\n" +
                    "This browser does not support device location.",
                    "error"
                );

                return;
            }


            gpsButton.classList.add(
                "active"
            );


            setTerminal(
                "ARGUSSCOPE // DEVICE GPS\n\n" +
                "Requesting location permission..."
            );


            mapStatus.textContent =
                "MAP // ACQUIRING GPS";


            navigator.geolocation.getCurrentPosition(

                position => {

                    const latitude =
                        position.coords.latitude;


                    const longitude =
                        position.coords.longitude;


                    const accuracy =
                        position.coords.accuracy;


                    setTerminal(
                        [
                            "DEVICE GPS // LOCK ACQUIRED",

                            "",

                            "Latitude : " +
                            latitude,

                            "Longitude: " +
                            longitude,

                            "Accuracy : ±" +
                            Math.round(
                                accuracy
                            ) +
                            " m"

                        ].join(
                            "\n"
                        ),
                        "success"
                    );


                    showTarget(
                        latitude,
                        longitude,
                        accuracy,
                        "DEVICE GPS"
                    );


                    gpsButton.classList.remove(
                        "active"
                    );
                },


                error => {

                    let message;


                    if (
                        error.code ===
                        error.PERMISSION_DENIED
                    ) {

                        message =
                            "Location permission was denied.";

                    } else if (
                        error.code ===
                        error.POSITION_UNAVAILABLE
                    ) {

                        message =
                            "Device location is unavailable.";

                    } else if (
                        error.code ===
                        error.TIMEOUT
                    ) {

                        message =
                            "Location request timed out.";

                    } else {

                        message =
                            "Unable to obtain device location.";
                    }


                    setTerminal(
                        "GPS ERROR\n\n" +
                        message,
                        "error"
                    );


                    mapStatus.textContent =
                        "MAP // GPS FAILED";


                    gpsButton.classList.remove(
                        "active"
                    );
                },


                {
                    enableHighAccuracy:
                        true,

                    timeout:
                        15000,

                    maximumAge:
                        0
                }
            );
        }


        /* =====================================================
           BUTTON EVENTS
        ===================================================== */

        ipButton.addEventListener(
            "click",
            locateIP
        );


        bssidButton.addEventListener(
            "click",
            locateBssid
        );


        gpsButton.addEventListener(
            "click",
            locateDevice
        );


        /* =====================================================
           ENTER KEY
        ===================================================== */

        ipInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    event.preventDefault();

                    locateIP();
                }
            }
        );


        bssidInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    event.preventDefault();

                    locateBssid();
                }
            }
        );


        /* =====================================================
           MAP RESIZE
        ===================================================== */

        window.addEventListener(
            "resize",
            () => {

                setTimeout(
                    () => {

                        map.invalidateSize();

                    },
                    100
                );
            }
        );


        window.addEventListener(
            "orientationchange",
            () => {

                setTimeout(
                    () => {

                        map.invalidateSize();

                    },
                    350
                );
            }
        );


        /* =====================================================
           INITIALIZE
        ===================================================== */

        setTimeout(
            () => {

                map.invalidateSize();

            },
            300
        );

    </script>

</body>
