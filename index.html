<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#070b12"
    >

    <title>ArgusScope</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >

    <style>

        /* =====================================================
           ARGUSSCOPE
           FRONTEND
        ===================================================== */

        :root {
            --bg: #070b12;
            --panel: #0c121c;
            --panel-2: #101824;

            --border: #1b2939;

            --text: #dce7f0;
            --muted: #6d8194;

            --cyan: #20b8ec;
            --green: #10c991;
            --red: #ef5968;

            --header-height: 56px;
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {
            background: var(--bg);

            color: var(--text);

            font-family:
                "Courier New",
                Courier,
                monospace;

            overflow: hidden;

            -webkit-tap-highlight-color: transparent;
        }


        button,
        input {
            font-family: inherit;
        }


        button {
            -webkit-user-select: none;
            user-select: none;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .topbar {
            position: relative;

            z-index: 2000;

            height: var(--header-height);

            margin: 8px;

            padding: 0 10px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            background: var(--panel);

            border: 1px solid var(--border);

            border-radius: 7px;
        }


        .brand {
            flex-shrink: 0;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: .3px;

            white-space: nowrap;
        }


        .brand-mark {
            color: var(--cyan);

            margin-right: 6px;
        }


        .brand-sub {
            color: var(--cyan);

            font-size: 10px;
        }


        /* =====================================================
           HEADER BUTTONS
        ===================================================== */

        .top-actions {
            position: relative;

            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: 5px;
        }


        .top-btn {
            min-height: 34px;

            padding: 6px 9px;

            background: var(--panel-2);

            color: var(--muted);

            border: 1px solid var(--border);

            border-radius: 5px;

            font-size: 9px;

            font-weight: bold;

            cursor: pointer;

            white-space: nowrap;
        }


        .top-btn:hover {
            color: var(--cyan);

            border-color: #28506a;
        }


        .top-btn:active {
            transform: translateY(1px);
        }


        .top-btn.active {
            color: #061018;

            background: var(--cyan);

            border-color: var(--cyan);
        }


        #gpsButton {
            color: var(--green);

            border-color: #155540;
        }


        #gpsButton.active {
            color: #04140e;

            background: var(--green);

            border-color: var(--green);
        }


        /* =====================================================
           MAP MENU
        ===================================================== */

        .map-menu {
            position: absolute;

            top: 40px;

            right: 0;

            width: 170px;

            padding: 5px;

            display: none;

            flex-direction: column;

            gap: 3px;

            background: #0b121d;

            border: 1px solid var(--border);

            border-radius: 6px;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, .55);

            z-index: 5000;
        }


        .map-menu.open {
            display: flex;
        }


        .map-option {
            width: 100%;

            min-height: 35px;

            padding: 7px 9px;

            text-align: left;

            color: #8ca1b3;

            background: transparent;

            border: 0;

            border-radius: 4px;

            font-size: 9px;

            cursor: pointer;
        }


        .map-option:hover {
            color: var(--cyan);

            background: #142031;
        }


        .map-option.selected {
            color: var(--cyan);

            background: #101d2c;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .workspace {
            height:
                calc(
                    100vh
                    - var(--header-height)
                    - 24px
                );

            margin: 0 8px 8px;

            display: grid;

            grid-template-columns:
                300px
                minmax(0, 1fr);

            gap: 8px;

            min-height: 0;
        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            min-width: 0;

            min-height: 0;

            padding: 11px;

            display: flex;

            flex-direction: column;

            gap: 11px;

            overflow-y: auto;

            background: var(--panel);

            border: 1px solid var(--border);

            border-radius: 7px;

            scrollbar-width: thin;
        }


        .section {
            display: flex;

            flex-direction: column;

            gap: 6px;
        }


        .section-title {
            color: var(--cyan);

            font-size: 9px;

            letter-spacing: .8px;
        }


        /* =====================================================
           INPUT
        ===================================================== */

        .input {
            width: 100%;

            height: 39px;

            padding: 0 10px;

            background: #080e17;

            color: var(--text);

            border: 1px solid var(--border);

            border-radius: 5px;

            outline: none;

            font-size: 11px;
        }


        .input::placeholder {
            color: #4f6477;
        }


        .input:focus {
            border-color: var(--cyan);

            box-shadow:
                0 0 0 2px
                rgba(32, 184, 236, .08);
        }


        /* =====================================================
           ACTION BUTTON
        ===================================================== */

        .action-button {
            width: 100%;

            min-height: 39px;

            padding: 7px 10px;

            border: 0;

            border-radius: 5px;

            color: #041017;

            background: var(--cyan);

            font-size: 9px;

            font-weight: bold;

            letter-spacing: .4px;

            cursor: pointer;
        }


        .action-button.green {
            color: #03140e;

            background: var(--green);
        }


        .action-button:active {
            transform: translateY(1px);
        }


        .action-button:disabled {
            opacity: .55;

            cursor: wait;
        }


        /* =====================================================
           INTELLIGENCE OUTPUT
        ===================================================== */

        .intelligence {
            min-height: 0;

            flex: 1;

            display: flex;

            flex-direction: column;

            gap: 6px;
        }


        .terminal {
            min-height: 120px;

            flex: 1;

            padding: 9px;

            overflow: auto;

            white-space: pre-wrap;

            overflow-wrap: anywhere;

            background: #050a11;

            color: var(--cyan);

            border: 1px solid var(--border);

            border-radius: 5px;

            font-size: 9px;

            line-height: 1.5;

            scrollbar-width: thin;
        }


        .terminal.success {
            color: var(--green);
        }


        .terminal.error {
            color: var(--red);
        }


        /* =====================================================
           MAP
        ===================================================== */

        .map-container {
            position: relative;

            min-width: 0;

            min-height: 0;

            overflow: hidden;

            background: #05080d;

            border: 1px solid var(--border);

            border-radius: 7px;
        }


        #map {
            width: 100%;

            height: 100%;
        }


        /*
           Cyber Dark works by applying the filter only to
           the OSM tile layer.

           Markers, circles and Leaflet controls remain normal.
        */

        .cyber-dark-tiles {
            filter:
                invert(92%)
                hue-rotate(180deg)
                brightness(78%)
                contrast(92%);
        }


        /* =====================================================
           MAP STATUS
        ===================================================== */

        .map-status {
            position: absolute;

            left: 9px;

            bottom: 9px;

            z-index: 1000;

            max-width: calc(100% - 18px);

            padding: 5px 7px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            pointer-events: none;

            background: rgba(5, 9, 15, .88);

            color: var(--cyan);

            border: 1px solid var(--border);

            border-radius: 4px;

            font-size: 8px;
        }


        /* =====================================================
           LEAFLET
        ===================================================== */

        .leaflet-control-zoom {
            border: 0 !important;
        }


        .leaflet-control-zoom a {
            width: 34px !important;

            height: 34px !important;

            line-height: 34px !important;

            color: #d9e6ef !important;

            background: #0b121d !important;

            border-color: #223244 !important;
        }


        .leaflet-control-zoom a:hover {
            color: var(--cyan) !important;

            background: #101d2c !important;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {
            position: fixed;

            left: 10px;

            bottom: 3px;

            z-index: 1500;

            color: #3d5368;

            font-size: 7px;

            pointer-events: none;
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 900px) {

            .workspace {
                grid-template-columns:
                    260px
                    minmax(0, 1fr);
            }


            .brand-sub {
                display: none;
            }


            .top-btn {
                padding: 6px 7px;
            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            body {
                overflow-y: auto;

                overflow-x: hidden;
            }


            .topbar {
                height: auto;

                min-height: 50px;

                margin: 6px;

                padding: 7px;

                flex-direction: column;

                align-items: stretch;

                gap: 6px;
            }


            .brand {
                font-size: 12px;
            }


            .top-actions {
                width: 100%;

                display: flex;

                gap: 4px;
            }


            .top-btn {
                flex: 1;

                min-height: 32px;

                padding: 5px 4px;

                font-size: 8px;
            }


            .map-menu {
                top: 36px;

                right: 0;

                width: 160px;
            }


            .workspace {
                height: auto;

                margin:
                    0
                    6px
                    28px;

                display: flex;

                flex-direction: column;

                gap: 7px;

                overflow: visible;
            }


            .sidebar {
                padding: 9px;

                gap: 9px;

                overflow: visible;
            }


            .section {
                gap: 5px;
            }


            .section-title {
                font-size: 8px;
            }


            .input {
                height: 38px;

                font-size: 11px;
            }


            .action-button {
                min-height: 38px;

                font-size: 9px;
            }


            .intelligence {
                min-height: 125px;
            }


            .terminal {
                min-height: 110px;

                max-height: 180px;

                font-size: 8px;
            }


            .map-container {
                width: 100%;

                height: 48vh;

                min-height: 290px;
            }


            #map {
                min-height: 290px;
            }


            .footer {
                left: 7px;

                bottom: 2px;

                font-size: 6px;
            }

        }


        /* =====================================================
           SMALL PHONE
        ===================================================== */

        @media (max-width: 380px) {

            .brand {
                font-size: 11px;
            }


            .top-btn {
                font-size: 7px;
            }


            .map-container {
                height: 45vh;

                min-height: 270px;
            }


            #map {
                min-height: 270px;
            }

        }


        /* =====================================================
           LANDSCAPE MOBILE
        ===================================================== */

        @media
        (max-width: 900px)
        and (orientation: landscape) {

            body {
                overflow: hidden;
            }


            .topbar {
                height: 48px;

                min-height: 48px;

                flex-direction: row;

                align-items: center;

                padding: 5px 8px;
            }


            .top-actions {
                width: auto;
            }


            .top-btn {
                flex: initial;

                min-height: 30px;
            }


            .workspace {
                height:
                    calc(
                        100vh
                        - 62px
                    );

                display: grid;

                grid-template-columns:
                    250px
                    minmax(0, 1fr);

                margin-bottom: 5px;
            }


            .sidebar {
                overflow-y: auto;
            }


            .map-container {
                height: 100%;

                min-height: 0;
            }


            #map {
                min-height: 0;
            }


            .footer {
                display: none;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="topbar">

        <div class="brand">

            <span class="brand-mark">■</span>

            ARGUSSCOPE

            <span class="brand-sub">
                // INTELLIGENCE ENGINE
            </span>

        </div>


        <div class="top-actions">

            <!-- MAP MENU -->

            <button
                id="mapsButton"
                class="top-btn"
                type="button"
            >
                ◇ MAPS
            </button>


            <!-- GPS -->

            <button
                id="gpsButton"
                class="top-btn"
                type="button"
            >
                ✦ GPS
            </button>


            <!-- MAP MENU -->

            <div
                id="mapMenu"
                class="map-menu"
            >

                <button
                    class="map-option"
                    data-map="google"
                    type="button"
                >
                    GOOGLE SATELLITE
                </button>


                <button
                    class="map-option selected"
                    data-map="esri"
                    type="button"
                >
                    ESRI SATELLITE
                </button>


                <button
                    class="map-option"
                    data-map="dark"
                    type="button"
                >
                    CYBER DARK
                </button>

            </div>

        </div>

    </header>



    <!-- =====================================================
         WORKSPACE
    ====================================================== -->

    <main class="workspace">


        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside class="sidebar">


            <!-- IP -->

            <section class="section">

                <div class="section-title">
                    // 01. IP LOOKUP
                </div>


                <input
                    id="ipInput"
                    class="input"
                    type="text"
                    inputmode="decimal"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Target IP"
                >


                <button
                    id="ipButton"
                    class="action-button"
                    type="button"
                >
                    EXECUTE IP SEARCH
                </button>

            </section>



            <!-- BSSID -->

            <section class="section">

                <div class="section-title">
                    // 02. BSSID LOOKUP
                </div>


                <input
                    id="bssidInput"
                    class="input"
                    type="text"
                    inputmode="text"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="AA:BB:CC:DD:EE:FF"
                >


                <button
                    id="bssidButton"
                    class="action-button green"
                    type="button"
                >
                    LOCATE BSSID
                </button>

            </section>



            <!-- INTELLIGENCE -->

            <section class="intelligence">

                <div class="section-title">
                    // 03. INTELLIGENCE
                </div>


                <div
                    id="terminal"
                    class="terminal"
                >
ARGUSSCOPE // ONLINE

Waiting for target acquisition...
                </div>

            </section>

        </aside>



        <!-- =================================================
             MAP
        ================================================== -->

        <section class="map-container">

            <div id="map"></div>


            <div
                id="mapStatus"
                class="map-status"
            >
                MAP // READY
            </div>

        </section>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">
        ARGUSSCOPE // RENDER BACKEND // GITHUB FRONTEND
    </footer>



    <!-- =====================================================
         LEAFLET
    ====================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""
    ></script>



    <script>

        /* =====================================================
           CONFIGURATION
        ===================================================== */

        const BACKEND_URL =
            "https://argusscope-backend.onrender.com";


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const ipInput =
            document.getElementById("ipInput");

        const bssidInput =
            document.getElementById("bssidInput");

        const ipButton =
            document.getElementById("ipButton");

        const bssidButton =
            document.getElementById("bssidButton");

        const gpsButton =
            document.getElementById("gpsButton");

        const mapsButton =
            document.getElementById("mapsButton");

        const mapMenu =
            document.getElementById("mapMenu");

        const terminal =
            document.getElementById("terminal");

        const mapStatus =
            document.getElementById("mapStatus");


        /* =====================================================
           MAP INITIALIZATION
        ===================================================== */

        const map =
            L.map(
                "map",
                {
                    zoomControl: true,

                    attributionControl: true,

                    scrollWheelZoom: true,

                    doubleClickZoom: true,

                    dragging: true,

                    touchZoom: true
                }
            );


        /*
           Default position:
           Agartala / Tripura area.
        */

        map.setView(
            [23.8315, 91.2868],
            6
        );


        /* =====================================================
           TILE LAYERS
        ===================================================== */

        /*
           Google Satellite

           This uses Google's public tile endpoint rather
           than the Google Maps JavaScript API.

           If Google changes/restricts this endpoint,
           the ESRI option remains available.
        */

        const googleLayer =
            L.tileLayer(
                "https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",
                {
                    maxZoom: 20,

                    subdomains: [
                        "mt0",
                        "mt1",
                        "mt2",
                        "mt3"
                    ],

                    attribution:
                        "&copy; Google"
                }
            );


        /*
           ESRI Satellite
        */

        const esriLayer =
            L.tileLayer(
                "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
                {
                    maxZoom: 19,

                    attribution:
                        "Tiles &copy; Esri"
                }
            );


        /*
           Cyber Dark

           IMPORTANT:

           We intentionally use OpenStreetMap here and
           apply a CSS filter to the tile layer.

           Therefore this mode does NOT require a
           separate dark-map API key.
        */

        const darkLayer =
            L.tileLayer(
                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                    maxZoom: 19,

                    className:
                        "cyber-dark-tiles",

                    attribution:
                        "&copy; OpenStreetMap contributors"
                }
            );


        /*
           Start with ESRI.
        */

        esriLayer.addTo(map);


        let currentLayer =
            "esri";


        /* =====================================================
           MAP LAYER FUNCTIONS
        ===================================================== */

        function getLayer(name) {

            if (name === "google") {
                return googleLayer;
            }

            if (name === "dark") {
                return darkLayer;
            }

            return esriLayer;
        }


        function getLayerName(name) {

            if (name === "google") {
                return "GOOGLE SATELLITE";
            }

            if (name === "dark") {
                return "CYBER DARK";
            }

            return "ESRI SATELLITE";
        }


        function changeMap(name) {

            const newLayer =
                getLayer(name);


            if (map.hasLayer(
                googleLayer
            )) {

                map.removeLayer(
                    googleLayer
                );
            }


            if (map.hasLayer(
                esriLayer
            )) {

                map.removeLayer(
                    esriLayer
                );
            }


            if (map.hasLayer(
                darkLayer
            )) {

                map.removeLayer(
                    darkLayer
                );
            }


            newLayer.addTo(map);


            currentLayer =
                name;


            /*
               Update menu selection.
            */

            document
                .querySelectorAll(".map-option")
                .forEach(
                    button => {

                        button.classList.toggle(
                            "selected",
                            button.dataset.map === name
                        );

                    }
                );


            mapStatus.textContent =
                "MAP // " +
                getLayerName(name);


            /*
               Close menu.
            */

            mapMenu.classList.remove(
                "open"
            );


            mapsButton.classList.add(
                "active"
            );


            /*
               Important after changing tile layers.
            */

            setTimeout(
                () => {
                    map.invalidateSize();
                },
                150
            );
        }


        /* =====================================================
           MAP MENU
        ===================================================== */

        mapsButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                mapMenu.classList.toggle(
                    "open"
                );

            }
        );


        mapMenu.addEventListener(
            "click",
            event => {

                const option =
                    event.target.closest(
                        ".map-option"
                    );


                if (!option) {
                    return;
                }


                changeMap(
                    option.dataset.map
                );

            }
        );


        /*
           Close map menu when tapping elsewhere.
        */

        document.addEventListener(
            "click",
            event => {

                if (
                    !mapMenu.contains(
                        event.target
                    ) &&
                    event.target !== mapsButton
                ) {

                    mapMenu.classList.remove(
                        "open"
                    );

                }

            }
        );


        /* =====================================================
           MAP RESULT
        ===================================================== */

        let targetMarker =
            null;

        let targetCircle =
            null;


        function clearTarget() {

            if (targetMarker) {

                map.removeLayer(
                    targetMarker
                );

                targetMarker =
                    null;
            }


            if (targetCircle) {

                map.removeLayer(
                    targetCircle
                );

                targetCircle =
                    null;
            }
        }


        function showTarget(
            latitude,
            longitude,
            radius,
            popupTitle
        ) {

            const lat =
                Number(latitude);

            const lon =
                Number(longitude);

            const radiusNumber =
                Number(radius);


            if (
                !Number.isFinite(lat) ||
                !Number.isFinite(lon)
            ) {

                throw new Error(
                    "Backend returned invalid coordinates."
                );
            }


            clearTarget();


            targetMarker =
                L.marker(
                    [lat, lon]
                )
                .addTo(map);


            targetMarker.bindPopup(
                `
                <strong>
                    ${escapeHtml(popupTitle)}
                </strong>

                <br>

                Latitude:
                ${lat.toFixed(6)}

                <br>

                Longitude:
                ${lon.toFixed(6)}
                `
            );


            /*
               Draw accuracy radius if supplied.
            */

            if (
                Number.isFinite(
                    radiusNumber
                ) &&
                radiusNumber > 0
            ) {

                targetCircle =
                    L.circle(
                        [lat, lon],
                        {
                            radius:
                                radiusNumber,

                            color:
                                "#20b8ec",

                            fillColor:
                                "#20b8ec",

                            fillOpacity:
                                0.10,

                            weight:
                                1.5
                        }
                    )
                    .addTo(map);
            }


            /*
               Fit map to result.

               We don't continuously force the map's zoom,
               so normal user zooming continues to work.
            */

            if (targetCircle) {

                map.fitBounds(
                    targetCircle.getBounds(),
                    {
                        padding:
                            [30, 30],

                        maxZoom:
                            16
                    }
                );

            } else {

                map.setView(
                    [lat, lon],
                    14
                );
            }


            mapStatus.textContent =
                "TARGET // " +
                lat.toFixed(4) +
                ", " +
                lon.toFixed(4);


            setTimeout(
                () => {
                    map.invalidateSize();
                },
                200
            );
        }


        /* =====================================================
           HTML ESCAPE
        ===================================================== */

        function escapeHtml(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );
        }


        /* =====================================================
           TERMINAL
        ===================================================== */

        function setTerminal(
            message,
            type = "normal"
        ) {

            terminal.className =
                "terminal";


            if (type === "success") {

                terminal.classList.add(
                    "success"
                );
            }


            if (type === "error") {

                terminal.classList.add(
                    "error"
                );
            }


            terminal.textContent =
                message;
        }


        /* =====================================================
           BUTTON LOADING
        ===================================================== */

        function setLoading(
            button,
            loading,
            loadingText
        ) {

            if (loading) {

                if (
                    !button.dataset.originalText
                ) {

                    button.dataset.originalText =
                        button.textContent;
                }


                button.disabled =
                    true;

                button.textContent =
                    loadingText;

            } else {

                button.disabled =
                    false;

                button.textContent =
                    button.dataset.originalText ||
                    button.textContent;
            }
        }


        /* =====================================================
           RESPONSE PARSER
        ===================================================== */

        async function parseResponse(
            response
        ) {

            const text =
                await response.text();


            if (!text) {

                throw new Error(
                    "Backend returned an empty response."
                );
            }


            try {

                return JSON.parse(
                    text
                );

            } catch {

                throw new Error(
                    "Backend returned a non-JSON response. HTTP " +
                    response.status
                );
            }
        }


        /* =====================================================
           IP LOOKUP
        ===================================================== */

        async function locateIP() {

            const ip =
                ipInput.value.trim();


            if (!ip) {

                setTerminal(
                    "ERROR\n\nEnter an IP address.",
                    "error"
                );

                ipInput.focus();

                return;
            }


            setLoading(
                ipButton,
                true,
                "QUERYING..."
            );


            setTerminal(
                "ARGUSSCOPE // IP LOOKUP\n\n" +
                "Target: " +
                ip +
                "\n\n" +
                "Contacting intelligence backend..."
            );


            mapStatus.textContent =
                "MAP // QUERYING";


            try {

                const url =
                    BACKEND_URL +
                    "/api/v1/locate-ip?ip=" +
                    encodeURIComponent(ip);


                const response =
                    await fetch(
                        url,
                        {
                            method:
                                "GET",

                            headers:
                                {
                                    "Accept":
                                        "application/json"
                                },

                            cache:
                                "no-store"
                        }
                    );


                const data =
                    await parseResponse(
                        response
                    );


                if (
                    data.success === true &&
                    data.latitude !== null &&
                    data.longitude !== null
                ) {

                    setTerminal(
                        JSON.stringify(
                            data,
                            null,
                            2
                        ),
                        "success"
                    );


                    showTarget(
                        data.latitude,
                        data.longitude,
                        data.accuracy_radius_m,
                        "IP: " +
                        (
                            data.ip ||
                            ip
                        )
                    );

                } else {

                    setTerminal(
                        "IP LOOKUP FAILED\n\n" +
                        (
                            data.error ||
                            "No location data returned."
                        ),
                        "error"
                    );


                    mapStatus.textContent =
                        "MAP // NO RESULT";
                }

            } catch (error) {

                setTerminal(
                    "IP LOOKUP ERROR\n\n" +
                    error.message,
                    "error"
                );


                mapStatus.textContent =
                    "MAP // BACKEND ERROR";

            } finally {

                setLoading(
                    ipButton,
                    false
                );
            }
        }


        /* =====================================================
           BSSID VALIDATION
        ===================================================== */

        function normalizeBssid(
            value
        ) {

            return value
                .trim()
                .toLowerCase()
                .replace(
                    /-/g,
                    ":"
                );
        }


        function isValidBssid(
            value
        ) {

            const clean =
                value
                    .replace(
                        /:/g,
                        ""
                    )
                    .trim();


            return (
                /^[0-9a-fA-F]{12}$/
                .test(clean)
            );
        }


        /* =====================================================
           BSSID LOOKUP
        ===================================================== */

        async function locateBssid() {

            const raw =
                bssidInput.value.trim();


            if (!raw) {

                setTerminal(
                    "ERROR\n\nEnter a BSSID.",
                    "error"
                );

                bssidInput.focus();

                return;
            }


            /*
               Allow:

               AA:BB:CC:DD:EE:FF

               or multiple:

               AA:BB:CC:DD:EE:FF,
               11:22:33:44:55:66
            */

            const bssids =
                raw
                    .split(",")
                    .map(
                        normalizeBssid
                    )
                    .filter(Boolean);


            for (
                const bssid
                of bssids
            ) {

                if (
                    !isValidBssid(
                        bssid
                    )
                ) {

                    setTerminal(
                        "INVALID BSSID\n\n" +
                        bssid +
                        "\n\n" +
                        "Expected format:\n" +
                        "AA:BB:CC:DD:EE:FF",
                        "error"
                    );

                    return;
                }
            }


            setLoading(
                bssidButton,
                true,
                "QUERYING..."
            );


            mapStatus.textContent =
                "MAP // QUERYING";


            try {

                /*
                   SINGLE BSSID
                */

                if (
                    bssids.length === 1
                ) {

                    setTerminal(
                        "ARGUSSCOPE // BSSID LOOKUP\n\n" +
                        "Target: " +
                        bssids[0] +
                        "\n\n" +
                        "Querying WiGLE..."
                    );


                    const url =
                        BACKEND_URL +
                        "/api/v1/locate-bssid?netid=" +
                        encodeURIComponent(
                            bssids[0]
                        );


                    const response =
                        await fetch(
                            url,
                            {
                                method:
                                    "GET",

                                headers:
                                    {
                                        "Accept":
                                            "application/json"
                                    },

                                cache:
                                    "no-store"
                            }
                        );


                    const data =
                        await parseResponse(
                            response
                        );


                    if (
                        data.success === true &&
                        data.latitude !== null &&
                        data.longitude !== null
                    ) {

                        setTerminal(
                            JSON.stringify(
                                data,
                                null,
                                2
                            ),
                            "success"
                        );


                        showTarget(
                            data.latitude,
                            data.longitude,
                            data.accuracy_radius_m,
                            "BSSID: " +
                            (
                                data.bssid ||
                                bssids[0]
                            )
                        );

                    } else {

                        setTerminal(
                            "BSSID LOOKUP FAILED\n\n" +
                            (
                                data.error ||
                                "BSSID was not found."
                            ),
                            "error"
                        );


                        mapStatus.textContent =
                            "MAP // NO RESULT";
                    }


                    return;
                }


                /*
                   MULTI-BSSID CLUSTER
                */

                setTerminal(
                    "ARGUSSCOPE // CLUSTER FUSION\n\n" +
                    "Targets: " +
                    bssids.length +
                    "\n\n" +
                    "Querying WiGLE cluster..."
                );


                const scans =
                    bssids.map(
                        bssid => {

                            return {
                                netid:
                                    bssid,

                                rssi:
                                    -65
                            };

                        }
                    );


                const response =
                    await fetch(
                        BACKEND_URL +
                        "/api/v1/triangulate-cluster",
                        {
                            method:
                                "POST",

                            headers:
                                {
                                    "Content-Type":
                                        "application/json",

                                    "Accept":
                                        "application/json"
                                },

                            body:
                                JSON.stringify(
                                    {
                                        scans:
                                            scans
                                    }
                                )
                        }
                    );


                const data =
                    await parseResponse(
                        response
                    );


                if (
                    data.success === true &&
                    data.latitude !== null &&
                    data.longitude !== null
                ) {

                    setTerminal(
                        JSON.stringify(
                            data,
                            null,
                            2
                        ),
                        "success"
                    );


                    showTarget(
                        data.latitude,
                        data.longitude,
                        data.accuracy_radius_m,
                        "BSSID Cluster"
                    );

                } else {

                    setTerminal(
                        "CLUSTER LOOKUP FAILED\n\n" +
                        (
                            data.error ||
                            "No valid cluster coordinates returned."
                        ),
                        "error"
                    );


                    mapStatus.textContent =
                        "MAP // NO RESULT";
                }

            } catch (error) {

                setTerminal(
                    "BSSID LOOKUP ERROR\n\n" +
                    error.message,
                    "error"
                );


                mapStatus.textContent =
                    "MAP // BACKEND ERROR";

            } finally {

                setLoading(
                    bssidButton,
                    false
                );
            }
        }


        /* =====================================================
           DEVICE GPS
        ===================================================== */

        function locateDevice() {

            if (
                !navigator.geolocation
            ) {

                setTerminal(
                    "GPS ERROR\n\n" +
                    "This browser does not support device location.",
                    "error"
                );

                return;
            }


            gpsButton.classList.add(
                "active"
            );


            setTerminal(
                "ARGUSSCOPE // DEVICE GPS\n\n" +
                "Requesting location permission..."
            );


            mapStatus.textContent =
                "MAP // ACQUIRING GPS";


            navigator.geolocation.getCurrentPosition(

                position => {

                    const latitude =
                        position.coords.latitude;

                    const longitude =
                        position.coords.longitude;

                    const accuracy =
                        position.coords.accuracy;


                    setTerminal(

                        [
                            "DEVICE GPS // LOCK ACQUIRED",

                            "",

                            "Latitude : " +
                            latitude,

                            "Longitude: " +
                            longitude,

                            "Accuracy : ±" +
                            Math.round(
                                accuracy
                            ) +
                            " m"

                        ].join("\n"),

                        "success"
                    );


                    showTarget(
                        latitude,
                        longitude,
                        accuracy,
                        "DEVICE GPS"
                    );


                    gpsButton.classList.remove(
                        "active"
                    );
                },


                error => {

                    let message;


                    if (
                        error.code ===
                        error.PERMISSION_DENIED
                    ) {

                        message =
                            "Location permission was denied.";

                    } else if (
                        error.code ===
                        error.POSITION_UNAVAILABLE
                    ) {

                        message =
                            "Device location is unavailable.";

                    } else if (
                        error.code ===
                        error.TIMEOUT
                    ) {

                        message =
                            "Location request timed out.";

                    } else {

                        message =
                            "Unable to obtain device location.";
                    }


                    setTerminal(
                        "GPS ERROR\n\n" +
                        message,
                        "error"
                    );


                    mapStatus.textContent =
                        "MAP // GPS FAILED";


                    gpsButton.classList.remove(
                        "active"
                    );
                },


                {
                    enableHighAccuracy:
                        true,

                    timeout:
                        15000,

                    maximumAge:
                        0
                }
            );
        }


        /* =====================================================
           BUTTON EVENTS
        ===================================================== */

        ipButton.addEventListener(
            "click",
            locateIP
        );


        bssidButton.addEventListener(
            "click",
            locateBssid
        );


        gpsButton.addEventListener(
            "click",
            locateDevice
        );


        /* =====================================================
           ENTER KEY
        ===================================================== */

        ipInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    locateIP();
                }
            }
        );


        bssidInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    locateBssid();
                }
            }
        );


        /* =====================================================
           MAP RESIZE
        ===================================================== */

        window.addEventListener(
            "resize",
            () => {

                setTimeout(
                    () => {
                        map.invalidateSize();
                    },
                    100
                );
            }
        );


        window.addEventListener(
            "orientationchange",
            () => {

                setTimeout(
                    () => {
                        map.invalidateSize();
                    },
                    350
                );
            }
        );


        /* =====================================================
           INITIALIZE
        ===================================================== */

        setTimeout(
            () => {

                map.invalidateSize();

            },
            300
        );

    </script>

</body>
