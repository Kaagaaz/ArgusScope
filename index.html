<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArgusScope // OSINT Recon</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Navigation Bar */
        .navbar {
            height: 60px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .brand {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent-cyan);
            letter-spacing: 1px;
        }

        .nav-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-btn {
            background-color: #1f2937;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
        }

        .nav-btn.active {
            background-color: var(--accent-cyan);
            color: #030712;
            border-color: var(--accent-cyan);
        }

        .status-badge {
            color: var(--accent-green);
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 10px;
        }

        .status-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
        }

        /* Workspace Layout */
        .workspace {
            display: flex;
            flex-grow: 1;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        /* Sidebar Control Panel */
        .sidebar {
            width: 420px;
            min-width: 420px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            gap: 20px;
        }

        .section-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* EXIF Drop Zone */
        .exif-dropzone {
            background-color: #030712;
            border: 1px dashed var(--border-color);
            border-radius: 4px;
            padding: 20px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .exif-dropzone:hover {
            border-color: var(--accent-cyan);
            color: var(--text-main);
        }

        .exif-dropzone span {
            color: var(--accent-cyan);
            font-weight: bold;
        }

        /* Network Locator Input Row */
        .input-row {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex-grow: 1;
            background-color: #030712;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        button.query-btn {
            background-color: var(--accent-cyan);
            color: #030712;
            border: none;
            padding: 0 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button.query-btn:hover {
            opacity: 0.9;
        }

        /* Intelligence Report Card */
        .report-card {
            background-color: #030712;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 15px;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .report-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #111827;
            padding-bottom: 6px;
        }

        .report-label {
            color: var(--text-muted);
        }

        .report-value {
            color: var(--text-main);
            text-align: right;
            font-weight: bold;
        }

        /* Map Container */
        #map {
            flex-grow: 1;
            height: 100%;
            background-color: var(--bg-color);
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="navbar">
        <div class="brand">
            <span>ARGUSSCOPE // OSINT RECON</span>
        </div>
        <div class="nav-controls">
            <button class="nav-btn" onclick="setMapLayer('dark')">Cyber Dark</button>
            <button class="nav-btn active" onclick="setMapLayer('satellite')">Satellite</button>
            <button class="nav-btn" onclick="setMapLayer('topo')">3D Topo</button>
            <div class="status-badge">API Online</div>
        </div>
    </div>

    <!-- Workspace -->
    <div class="workspace">
        <!-- Sidebar Control Panel -->
        <div class="sidebar">
            
            <!-- 01. Image EXIF Extraction -->
            <div class="control-group">
                <div class="section-title">// 01. Image EXIF Extraction</div>
                <div class="exif-dropzone" onclick="document.getElementById('fileInput').click()">
                    Drop Image or <span>Click to Select</span>
                    <input type="file" id="fileInput" style="display: none;" accept="image/*" onchange="handleImageExif(this)">
                </div>
            </div>

            <!-- 02. Network Locator -->
            <div class="control-group">
                <div class="section-title">// 02. Network Locator</div>
                <div class="input-row">
                    <input type="text" id="ipInput" placeholder="Enter target IP (e.g., 117.200.0.1)">
                    <button class="query-btn" onclick="executeReconSearch()">Query</button>
                </div>
            </div>

            <!-- 03. Intelligence Report -->
            <div class="control-group" style="flex-grow: 1; display: flex; flex-direction: column;">
                <div class="section-title">// 03. Intelligence Report</div>
                <div class="report-card">
                    <div class="report-row">
                        <span class="report-label">TARGET IP</span>
                        <span class="report-value" id="resIp">-</span>
                    </div>
                    <div class="report-row">
                        <span class="report-label">CITY</span>
                        <span class="report-value" id="resCity">-</span>
                    </div>
                    <div class="report-row">
                        <span class="report-label">COUNTRY</span>
                        <span class="report-value" id="resCountry">-</span>
                    </div>
                    <div class="report-row">
                        <span class="report-label">PROVIDER</span>
                        <span class="report-value" id="resProvider">-</span>
                    </div>
                    <div class="report-row" style="border-bottom: none;">
                        <span class="report-label">LAT / LNG</span>
                        <span class="report-value" id="resCoords">-</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Map Canvas -->
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Initialize Map
        const map = L.map('map').setView([20.0, 0.0], 2);

        // Map Layers
        const layers = {
            satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: 'Tiles &copy; Esri'
            }),
            dark: L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png', {
                maxZoom: 19,
                subdomains: 'abcd',
                attribution: '&copy; CARTO'
            }),
            topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                maxZoom: 17,
                attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM'
            })
        };

        // Default to Satellite view
        layers.satellite.addTo(map);

        function setMapLayer(type) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            Object.values(layers).forEach(l => map.removeLayer(l));
            layers[type].addTo(map);
        }

        let currentMarker = null;
        const BACKEND_URL = "https://argusscope-backend.onrender.com";

        function renderTarget(lat, lon, info) {
            if (currentMarker) map.removeLayer(currentMarker);

            currentMarker = L.marker([lat, lon]).addTo(map)
                .bindPopup(`<b>IP: ${info.ip}</b><br>LAT: ${lat}<br>LNG: ${lon}`).openPopup();

            map.setView([lat, lon], 13);
        }

        async function executeReconSearch() {
            const ip = document.getElementById("ipInput").value.trim();
            if (!ip) return;

            document.getElementById("resIp").innerText = "Querying...";

            try {
                const response = await fetch(`${BACKEND_URL}/api/v1/locate-ip?ip=${encodeURIComponent(ip)}`);
                const data = await response.json();

                if (data.latitude && data.longitude) {
                    document.getElementById("resIp").innerText = data.ip || ip;
                    document.getElementById("resCity").innerText = data.city || 'Unknown';
                    document.getElementById("resCountry").innerText = data.country || 'N/A';
                    document.getElementById("resProvider").innerText = data.isp || 'N/A';
                    document.getElementById("resCoords").innerText = `${data.latitude}, ${data.longitude}`;

                    renderTarget(data.latitude, data.longitude, data);
                } else {
                    alert("Query failed: " + (data.error || "Target not found"));
                    document.getElementById("resIp").innerText = "-";
                }
            } catch (err) {
                console.error("Network Error:", err);
                alert("Critical network error connecting to backend.");
                document.getElementById("resIp").innerText = "Error";
            }
        }

        function handleImageExif(input) {
            if (input.files && input.files[0]) {
                alert(`Selected image: ${input.files[0].name}. Ready for EXIF parsing integration.`);
            }
        }
    </script>
</body>
</html>
