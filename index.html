<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>ArgusScope // Intelligence Engine</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
:root {
  --bg: #060b14;
  --panel: #0b1321;
  --panel2: #101b2d;
  --line: #1d3048;

  --text: #dbe8f5;
  --muted: #657b94;

  --cyan: #29b8ef;
  --green: #13c58b;
  --red: #ff5265;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;

  background: var(--bg);
  color: var(--text);

  font-family:
    "JetBrains Mono",
    "Courier New",
    monospace;
}

button,
input {
  font-family: inherit;
}

#app {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;

  padding: 10px;

  display: grid;
  grid-template-rows: 54px minmax(0, 1fr) 24px;
  gap: 8px;

  overflow: hidden;
}

/* =========================
   HEADER
========================= */

.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 8px 13px;

  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 7px;

  position: relative;
  z-index: 5000;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;

  font-size: 15px;
  font-weight: bold;

  white-space: nowrap;
}

.brand-dot {
  width: 11px;
  height: 11px;

  background: var(--cyan);
  border-radius: 2px;

  box-shadow: 0 0 14px #29b8ef99;
}

.brand-slash {
  color: var(--cyan);
}

.brand-sub {
  color: var(--cyan);
}

.nav-controls {
  display: flex;
  align-items: center;
  gap: 7px;
}

.nav-btn {
  height: 34px;

  padding: 0 12px;

  border: 1px solid var(--line);
  border-radius: 5px;

  background: #0d1828;
  color: #91a5ba;

  font-size: 10px;
  font-weight: bold;

  cursor: pointer;
}

.nav-btn:hover {
  color: var(--cyan);
  border-color: var(--cyan);
}

.nav-btn.gps {
  color: #6fe0b4;
}

.nav-btn.gps:hover {
  border-color: var(--green);
}

/* =========================
   VIEW MENU
========================= */

.view-container {
  position: relative;
}

.view-menu {
  display: none;

  position: absolute;

  right: 0;
  top: 40px;

  width: 205px;

  padding: 7px;

  background: #091321;

  border: 1px solid var(--line);
  border-radius: 6px;

  box-shadow: 0 14px 35px #000b;

  z-index: 9000;
}

.view-menu.open {
  display: block;
}

.view-title {
  padding: 7px;

  color: #617994;

  font-size: 9px;
  letter-spacing: 1px;

  border-bottom: 1px solid #ffffff0c;
}

.view-option {
  width: 100%;

  padding: 10px 8px;

  border: 0;
  border-radius: 4px;

  background: transparent;

  color: #8ca0b5;

  text-align: left;

  font-size: 9px;

  cursor: pointer;
}

.view-option:hover,
.view-option.active {
  background: #102238;
  color: var(--cyan);
}

/* =========================
   WORKSPACE
========================= */

.workspace {
  min-width: 0;
  min-height: 0;

  display: grid;

  grid-template-columns: 360px minmax(0, 1fr);

  gap: 8px;

  overflow: hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
  min-width: 0;
  min-height: 0;

  padding: 13px;

  overflow-y: auto;

  background: var(--panel);

  border: 1px solid var(--line);
  border-radius: 7px;
}

.group {
  margin-bottom: 17px;
}

.section-title {
  margin-bottom: 8px;

  color: var(--cyan);

  font-size: 10px;
  letter-spacing: 1px;
}

/* =========================
   INPUT
========================= */

input[type="text"] {
  width: 100%;
  height: 40px;

  padding: 9px 11px;

  background: var(--panel2);

  border: 1px solid var(--line);
  border-radius: 5px;

  color: var(--text);

  outline: none;

  font-size: 11px;
}

input[type="text"]:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 1px #29b8ef22;
}

input::placeholder {
  color: #536a82;
}

/* =========================
   BUTTONS
========================= */

.action-btn {
  width: 100%;
  height: 40px;

  margin-top: 6px;

  border: 0;
  border-radius: 5px;

  background: var(--cyan);

  color: #031019;

  font-size: 10px;
  font-weight: bold;

  cursor: pointer;
}

.action-btn:hover {
  filter: brightness(1.08);
}

.action-btn:disabled {
  opacity: 0.55;
  cursor: wait;
}

.action-btn.green {
  background: var(--green);
}

/* =========================
   RESULT
========================= */

.result {
  min-height: 145px;
  max-height: 220px;

  padding: 10px;

  overflow: auto;

  background: #08111e;

  border: 1px solid var(--line);
  border-radius: 5px;

  font-size: 10px;
}

.result.empty {
  color: var(--muted);
}

.result.error {
  color: var(--red);
}

.result-row {
  display: grid;

  grid-template-columns: 105px minmax(0, 1fr);

  gap: 8px;

  padding: 6px 0;

  border-bottom: 1px solid #ffffff08;
}

.result-key {
  color: #647c95;
}

.result-value {
  color: #dbe8f5;
  overflow-wrap: anywhere;
}

/* =========================
   TELEMETRY
========================= */

.telemetry {
  min-height: 135px;

  padding: 10px;

  background: #050b13;

  border: 1px solid var(--line);
  border-radius: 5px;

  color: #7188a1;

  font-size: 9px;
  line-height: 1.6;

  white-space: pre-wrap;
  overflow: auto;
}

.telemetry.ok {
  color: var(--green);
}

.telemetry.error {
  color: var(--red);
}

/* =========================
   MAP
========================= */

.map-wrapper {
  min-width: 0;
  min-height: 0;

  position: relative;

  overflow: hidden;

  background: #050a11;

  border: 1px solid var(--line);
  border-radius: 7px;
}

#map {
  width: 100%;
  height: 100%;
}

.map-status {
  position: absolute;

  left: 10px;
  bottom: 10px;

  z-index: 1000;

  padding: 7px 10px;

  background: #050a14dd;

  border: 1px solid #24405c;

  border-radius: 5px;

  color: #8094a9;

  font-size: 9px;

  pointer-events: none;
}

/* =========================
   FOOTER
========================= */

.footer {
  display: flex;
  align-items: center;
  gap: 18px;

  padding: 3px 9px;

  background: var(--panel);

  border: 1px solid var(--line);
  border-radius: 5px;

  color: #536a82;

  font-size: 8px;

  white-space: nowrap;
}

.footer b {
  color: var(--cyan);
}

/* =========================
   LEAFLET
========================= */

.leaflet-control-zoom {
  margin: 12px !important;
}

.leaflet-control-zoom a {
  background: #0a1423 !important;
  color: #dce7f3 !important;
  border-color: #29405a !important;
}

.leaflet-control-attribution {
  background: #050a14cc !important;
  color: #7388a0 !important;
}

.leaflet-control-attribution a {
  color: #65a6c4 !important;
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
  background: #0b1524;
  color: #dce7f3;
}

.cyber-dark {
  filter:
    brightness(.5)
    contrast(1.15)
    saturate(.55)
    hue-rotate(8deg);
}
</style>
</head>

<body>

<div id="app">

  <header class="navbar">

    <div class="brand">
      <span class="brand-dot"></span>

      <span>ArgusScope</span>

      <span class="brand-slash">//</span>

      <span class="brand-sub">
        INTELLIGENCE ENGINE
      </span>
    </div>

    <div class="nav-controls">

      <div class="view-container">

        <button
          class="nav-btn"
          id="viewsButton"
        >
          ◈ VIEWS ▾
        </button>

        <div
          class="view-menu"
          id="viewMenu"
        >

          <div class="view-title">
            MAP VIEW
          </div>

          <button
            class="view-option active"
            data-layer="satellite"
          >
            ◈ ESRI SATELLITE
          </button>

          <button
            class="view-option"
            data-layer="osm"
          >
            □ OPENSTREETMAP
          </button>

          <button
            class="view-option"
            data-layer="dark"
          >
            ◉ CYBER DARK
          </button>

          <button
            class="view-option"
            id="googleMapsButton"
          >
            ◎ GOOGLE MAPS ↗
          </button>

        </div>

      </div>

      <button
        class="nav-btn gps"
        id="gpsButton"
      >
        ⌖ DEVICE GPS
      </button>

    </div>

  </header>


  <main class="workspace">

    <aside class="sidebar">

      <section class="group">

        <div class="section-title">
          // 01. STANDARD IP LOOKUP
        </div>

        <input
          type="text"
          id="ipInput"
          placeholder="Enter Target IP (e.g. 8.8.8.8)"
          autocomplete="off"
        >

        <button
          class="action-btn"
          id="ipButton"
        >
          EXECUTE IP SEARCH
        </button>

      </section>


      <section class="group">

        <div class="section-title">
          // 02. WIGLE BSSID LOOKUP
        </div>

        <input
          type="text"
          id="bssidInput"
          placeholder="AA:BB:CC:DD:EE:FF"
          autocomplete="off"
        >

        <button
          class="action-btn green"
          id="bssidButton"
        >
          LOCATE BSSID
        </button>

      </section>


      <section class="group">

        <div class="section-title">
          // 03. INTELLIGENCE
        </div>

        <div
          class="result empty"
          id="result"
        >
          Awaiting target acquisition...
        </div>

      </section>


      <section class="group">

        <div class="section-title">
          // 04. TELEMETRY
        </div>

        <div
          class="telemetry"
          id="telemetry"
        >ArgusScope frontend initialized.
Backend: Render
Status: READY</div>

      </section>

    </aside>


    <section class="map-wrapper">

      <div id="map"></div>

      <div
        class="map-status"
        id="mapStatus"
      >
        MAP // READY
      </div>

    </section>

  </main>


  <footer class="footer">

    <b>ARGUSSCOPE</b>

    <span>
      BACKEND // RENDER
    </span>

    <span id="sourceStatus">
      SOURCE // STANDBY
    </span>

    <span id="coordStatus">
      COORD // —
    </span>

  </footer>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   CONFIG
========================================================= */

const BACKEND =
  "https://argusscope-backend.onrender.com";


/* =========================================================
   ELEMENTS
========================================================= */

const ipInput =
  document.getElementById("ipInput");

const bssidInput =
  document.getElementById("bssidInput");

const ipButton =
  document.getElementById("ipButton");

const bssidButton =
  document.getElementById("bssidButton");

const gpsButton =
  document.getElementById("gpsButton");

const result =
  document.getElementById("result");

const telemetry =
  document.getElementById("telemetry");

const mapStatus =
  document.getElementById("mapStatus");

const sourceStatus =
  document.getElementById("sourceStatus");

const coordStatus =
  document.getElementById("coordStatus");

const viewsButton =
  document.getElementById("viewsButton");

const viewMenu =
  document.getElementById("viewMenu");


/* =========================================================
   MAP
========================================================= */

const map =
  L.map("map", {
    zoomControl: true,
    attributionControl: true,
    scrollWheelZoom: true,
    doubleClickZoom: true,
    touchZoom: true,
    dragging: true
  }).setView(
    [20, 0],
    2
  );


const satellite =
  L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution: "Tiles © Esri"
    }
  );


const osm =
  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "© OpenStreetMap contributors"
    }
  );


const dark =
  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
    {
      maxZoom: 19,
      subdomains: "abcd",
      attribution: "© CARTO © OpenStreetMap",
      className: "cyber-dark"
    }
  );


satellite.addTo(map);


/* =========================================================
   STATE
========================================================= */

let marker = null;
let circle = null;

let lastLat = null;
let lastLon = null;


/* =========================================================
   TELEMETRY
========================================================= */

function log(message, type = "") {

  telemetry.className =
    "telemetry " + type;

  telemetry.textContent =
    message;
}


/* =========================================================
   RESULT
========================================================= */

function clearResult() {

  result.className =
    "result";

  result.innerHTML =
    "";
}


function row(key, value) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {
    return;
  }

  const div =
    document.createElement("div");

  div.className =
    "result-row";

  div.innerHTML = `
    <div class="result-key">${escapeHtml(key)}</div>
    <div class="result-value">${escapeHtml(String(value))}</div>
  `;

  result.appendChild(div);
}


function escapeHtml(value) {

  return value
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function displayData(data) {

  clearResult();

  row("IP", data.ip);
  row("BSSID", data.bssid);
  row("SSID", data.ssid);

  row("CITY", data.city);
  row("REGION", data.region);
  row("COUNTRY", data.country);

  row("LATITUDE", data.latitude);
  row("LONGITUDE", data.longitude);

  row("ACCURACY", data.accuracy_radius_m);
  row("CONFIDENCE", data.confidence);

  row("OBSERVATIONS", data.observations);
  row("CLUSTER SIZE", data.cluster_size);

  row("SOURCE", data.source);

  if (!result.children.length) {

    result.className =
      "result empty";

    result.textContent =
      "Backend returned no displayable fields.";

  }
}


/* =========================================================
   ROBUST FETCH
========================================================= */

async function request(url, options = {}) {

  log(
    `REQUEST\n\n${options.method || "GET"} ${url}\n\nWaiting for backend...`
  );


  let response;

  try {

    response =
      await fetch(
        url,
        {
          ...options,
          cache: "no-store"
        }
      );

  } catch (error) {

    throw new Error(
      "Network error: " +
      error.message
    );

  }


  const text =
    await response.text();


  console.log(
    "ArgusScope HTTP:",
    response.status,
    text
  );


  if (!text.trim()) {

    throw new Error(
      `Backend returned an empty response. HTTP ${response.status}.`
    );

  }


  let data;

  try {

    data =
      JSON.parse(text);

  } catch (error) {

    throw new Error(
      `Backend returned non-JSON data (HTTP ${response.status}).`
    );

  }


  if (!response.ok) {

    throw new Error(
      data.detail ||
      data.error ||
      data.message ||
      `Backend HTTP ${response.status}`
    );

  }


  if (data.error) {

    throw new Error(
      data.error
    );

  }


  return data;
}


/* =========================================================
   MAP POSITION
========================================================= */

function showPosition(
  lat,
  lon,
  radius = 5000,
  title = "ArgusScope Target"
) {

  lat =
    Number(lat);

  lon =
    Number(lon);


  if (
    !Number.isFinite(lat) ||
    !Number.isFinite(lon)
  ) {

    throw new Error(
      "Backend returned invalid coordinates."
    );

  }


  lastLat =
    lat;

  lastLon =
    lon;


  if (marker) {

    map.removeLayer(marker);

  }


  if (circle) {

    map.removeLayer(circle);

  }


  marker =
    L.marker([
      lat,
      lon
    ]).addTo(map);


  marker.bindPopup(
    `<b>${escapeHtml(title)}</b><br>
     ${lat.toFixed(6)}, ${lon.toFixed(6)}`
  );


  const r =
    Number(radius);


  if (
    Number.isFinite(r) &&
    r > 0
  ) {

    circle =
      L.circle(
        [lat, lon],
        {
          radius: Math.min(r, 100000),
          color: "#29b8ef",
          fillColor: "#29b8ef",
          fillOpacity: 0.10,
          weight: 1
        }
      ).addTo(map);

  }


  let zoom = 10;


  if (r > 100000)
    zoom = 4;
  else if (r > 50000)
    zoom = 5;
  else if (r > 10000)
    zoom = 7;
  else if (r > 3000)
    zoom = 9;
  else if (r > 1000)
    zoom = 11;
  else
    zoom = 14;


  map.setView(
    [lat, lon],
    zoom,
    {
      animate: true
    }
  );


  mapStatus.textContent =
    `MAP // ${lat.toFixed(5)}, ${lon.toFixed(5)}`;

  coordStatus.textContent =
    `COORD // ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
}


/* =========================================================
   IP LOOKUP
========================================================= */

async function lookupIP() {

  const ip =
    ipInput.value.trim();


  if (!ip) {

    result.className =
      "result error";

    result.textContent =
      "Enter an IP address.";

    return;
  }


  ipButton.disabled =
    true;

  ipButton.textContent =
    "SEARCHING...";


  try {

    /*
      IMPORTANT:

      Query parameter is sent exactly as
      ?ip=...

      rather than using response.json()
      directly.
    */

    const url =
      `${BACKEND}/api/v1/locate-ip?ip=${encodeURIComponent(ip)}`;


    const data =
      await request(url);


    console.log(
      "ArgusScope IP result:",
      data
    );


    displayData(data);


    if (
      data.latitude !== undefined &&
      data.longitude !== undefined
    ) {

      showPosition(
        data.latitude,
        data.longitude,
        data.accuracy_radius_m || 5000,
        `IP: ${data.ip || ip}`
      );

    }


    sourceStatus.textContent =
      `SOURCE // ${data.source || "IP GEOLOCATION"}`;


    log(
      `IP LOOKUP COMPLETE\n\n` +
      `Target: ${data.ip || ip}\n` +
      `Latitude: ${data.latitude ?? "—"}\n` +
      `Longitude: ${data.longitude ?? "—"}\n` +
      `Source: ${data.source || "—"}`,
      "ok"
    );


  } catch (error) {

    console.error(
      "ArgusScope IP error:",
      error
    );


    result.className =
      "result error";

    result.textContent =
      error.message;


    log(
      `IP LOOKUP FAILED\n\n${error.message}`,
      "error"
    );

  } finally {

    ipButton.disabled =
      false;

    ipButton.textContent =
      "EXECUTE IP SEARCH";

  }
}


/* =========================================================
   BSSID LOOKUP
========================================================= */

async function lookupBSSID() {

  const bssid =
    bssidInput.value.trim();


  if (!bssid) {

    result.className =
      "result error";

    result.textContent =
      "Enter a BSSID.";

    return;
  }


  bssidButton.disabled =
    true;

  bssidButton.textContent =
    "SEARCHING...";


  try {

    const url =
      `${BACKEND}/api/v1/locate-bssid?netid=${encodeURIComponent(bssid)}`;


    const data =
      await request(url);


    displayData(data);


    if (
      data.latitude !== undefined &&
      data.longitude !== undefined
    ) {

      showPosition(
        data.latitude,
        data.longitude,
        data.accuracy_radius_m || 100,
        `BSSID: ${data.bssid || bssid}`
      );

    }


    sourceStatus.textContent =
      `SOURCE // ${data.source || "WIGLE"}`;


    log(
      `BSSID LOOKUP COMPLETE\n\n` +
      `Target: ${data.bssid || bssid}\n` +
      `Latitude: ${data.latitude ?? "—"}\n` +
      `Longitude: ${data.longitude ?? "—"}\n` +
      `Source: ${data.source || "—"}`,
      "ok"
    );


  } catch (error) {

    console.error(
      "ArgusScope BSSID error:",
      error
    );


    result.className =
      "result error";

    result.textContent =
      error.message;


    log(
      `BSSID LOOKUP FAILED\n\n${error.message}`,
      "error"
    );

  } finally {

    bssidButton.disabled =
      false;

    bssidButton.textContent =
      "LOCATE BSSID";

  }
}


/* =========================================================
   DEVICE GPS
========================================================= */

gpsButton.addEventListener(
  "click",
  () => {

    if (!navigator.geolocation) {

      log(
        "DEVICE GPS FAILED\n\nGeolocation is not supported.",
        "error"
      );

      return;
    }


    gpsButton.disabled =
      true;


    log(
      "DEVICE GPS\n\nRequesting device location..."
    );


    navigator.geolocation.getCurrentPosition(

      position => {

        const lat =
          position.coords.latitude;

        const lon =
          position.coords.longitude;

        const accuracy =
          position.coords.accuracy;


        showPosition(
          lat,
          lon,
          accuracy,
          "DEVICE GPS"
        );


        clearResult();


        row(
          "SOURCE",
          "DEVICE GPS"
        );

        row(
          "LATITUDE",
          lat.toFixed(6)
        );

        row(
          "LONGITUDE",
          lon.toFixed(6)
        );

        row(
          "ACCURACY",
          `±${Math.round(accuracy)} m`
        );


        sourceStatus.textContent =
          "SOURCE // DEVICE GPS";


        log(
          `DEVICE GPS LOCK ACQUIRED\n\n` +
          `Latitude: ${lat.toFixed(6)}\n` +
          `Longitude: ${lon.toFixed(6)}\n` +
          `Accuracy: ±${Math.round(accuracy)} m`,
          "ok"
        );


        gpsButton.disabled =
          false;

      },

      error => {

        log(
          `DEVICE GPS FAILED\n\n${error.message}`,
          "error"
        );


        gpsButton.disabled =
          false;

      },

      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 30000
      }

    );

  }
);


/* =========================================================
   BUTTONS
========================================================= */

ipButton.addEventListener(
  "click",
  lookupIP
);


bssidButton.addEventListener(
  "click",
  lookupBSSID
);


/* =========================================================
   ENTER KEY
========================================================= */

ipInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      lookupIP();

    }

  }
);


bssidInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      lookupBSSID();

    }

  }
);


/* =========================================================
   MAP VIEWS
========================================================= */

viewsButton.addEventListener(
  "click",
  event => {

    event.stopPropagation();

    viewMenu.classList.toggle(
      "open"
    );

  }
);


document.addEventListener(
  "click",
  event => {

    if (
      !viewMenu.contains(event.target) &&
      event.target !== viewsButton
    ) {

      viewMenu.classList.remove(
        "open"
      );

    }

  }
);


document
  .querySelectorAll(
    ".view-option[data-layer]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          map.removeLayer(
            satellite
          );

          map.removeLayer(
            osm
          );

          map.removeLayer(
            dark
          );


          const layer =
            button.dataset.layer;


          if (layer === "satellite") {

            satellite.addTo(map);

            mapStatus.textContent =
              "MAP // ESRI SATELLITE";

          }


          if (layer === "osm") {

            osm.addTo(map);

            mapStatus.textContent =
              "MAP // OPENSTREETMAP";

          }


          if (layer === "dark") {

            dark.addTo(map);

            mapStatus.textContent =
              "MAP // CYBER DARK";

          }


          document
            .querySelectorAll(
              ".view-option[data-layer]"
            )
            .forEach(
              x =>
                x.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          viewMenu.classList.remove(
            "open"
          );

        }
      );

    }
  );


/* =========================================================
   GOOGLE MAPS
========================================================= */

document
  .getElementById("googleMapsButton")
  .addEventListener(
    "click",
    () => {

      if (
        lastLat === null ||
        lastLon === null
      ) {

        log(
          "GOOGLE MAPS\n\nNo coordinates available yet.",
          "error"
        );

        return;
      }


      const url =
        `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(
          `${lastLat},${lastLon}`
        )}`;


      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );


      viewMenu.classList.remove(
        "open"
      );

    }
  );


/* =========================================================
   LEAFLET RESIZE
========================================================= */

window.addEventListener(
  "resize",
  () => {

    setTimeout(
      () => {

        map.invalidateSize({
          pan: false
        });

      },
      150
    );

  }
);


setTimeout(
  () => {

    map.invalidateSize({
      pan: false
    });

  },
  500
);

</script>

</body>
</html>
