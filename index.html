<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARGUSSCOPE // Advanced Recon Engine</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #060913;
      --bg-panel: #0d1322;
      --bg-card: #131c31;
      --border-color: #1e2d4a;
      --accent-cyan: #38bdf8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 16px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 20px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      width: 12px; height: 12px;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
      border-radius: 2px;
    }

    header h1 {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      letter-spacing: 2px;
      font-weight: 700;
      color: #fff;
    }
    header h1 span { color: var(--accent-cyan); }

    .header-actions { display: flex; align-items: center; gap: 16px; }

    .map-switcher {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .map-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .map-btn.active {
      background: var(--accent-cyan);
      color: #000;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }

    .btn-gps {
      background: var(--accent-green);
      color: #000;
      border: none;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    .sidebar {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .section-title {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .input-group { display: flex; gap: 8px; }

    input[type="text"] {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 10px 12px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    .btn-action {
      background: var(--accent-cyan);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-weight: 700;
      cursor: pointer;
    }

    .intel-terminal {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.6;
      flex: 1;
      overflow-y: auto;
    }

    .intel-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed var(--border-color);
      padding: 6px 0;
    }
    .intel-row:last-child { border-bottom: none; }
    .intel-key { color: var(--text-muted); }
    .intel-val { color: var(--accent-cyan); font-weight: 500; text-align: right; }

    .map-container {
      position: relative;
      width: 100%; height: 100%;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    #map { width: 100%; height: 100%; background: #000; }

    /* Map mode CSS filters */
    .mode-dark .leaflet-tile { filter: brightness(0.7) invert(1) contrast(1.2) hue-rotate(200deg) saturate(0.3); }
    .mode-satellite .leaflet-tile { filter: brightness(1.05) contrast(1.1); }
    .mode-sentinel .leaflet-tile { filter: brightness(1.1) contrast(1.15) saturate(1.1); }
    .mode-topo .leaflet-tile { filter: contrast(1.1) brightness(0.95); }

    .leaflet-container { background: #060913 !important; }
    .leaflet-popup-content-wrapper {
      background: var(--bg-panel) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-color);
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }
  </style>
</head>
<body class="mode-satellite">

  <header>
    <div class="brand">
      <div class="brand-logo"></div>
      <h1>ARGUS<span>SCOPE</span> // GEOSPATIAL ENGINE</h1>
    </div>

    <div class="header-actions">
      <button class="btn-gps" onclick="locateDeviceGPS()">📍 HARDWARE GPS</button>

      <div class="map-switcher">
        <button class="map-btn active" id="btnSat" onclick="switchMapMode('satellite')">ESRI HD</button>
        <button class="map-btn" id="btnSentinel" onclick="switchMapMode('sentinel')">SENTINEL-2</button>
        <button class="map-btn" id="btnDark" onclick="switchMapMode('dark')">CYBER DARK</button>
        <button class="map-btn" id="btnTopo" onclick="switchMapMode('topo')">TOPO RELIEF</button>
      </div>
    </div>
  </header>

  <div class="dashboard">
    <div class="sidebar">
      <div class="section-title">// 01. Target Coordinates / IP</div>
      <div class="input-group">
        <input type="text" id="ipInput" placeholder="Enter IP or Domain (e.g., 184.84.167.84)">
        <button class="btn-action" onclick="lookupIP()">EXECUTE</button>
      </div>

      <div class="section-title">// 02. Geospatial Telemetry</div>
      <div class="intel-terminal" id="intelTerminal">
        High-Resolution GIS Tile Engine active. Enter an IP or Domain to execute analysis.
      </div>
    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const API_URL = "https://argusscope-backend.onrender.com";

    // High-Resolution GIS Tile Layer Configuration
    const layers = {
      // 1. ESRI World Imagery (High-Res Commercial Satellite)
      satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
      }),
      // 2. EOX Sentinel-2 Cloudless (Earth Observation Satellite Data)
      sentinel: L.tileLayer('https://e.tiles.maps.eox.at/wmts/1.0.0/s2cloudless_3857/default/GoogleMapsCompatible/{z}/{y}/{x}.jpg', {
        maxZoom: 13,
        attribution: 'Sentinel-2 cloudless &copy; EOX IT Services GmbH (Contains modified Copernicus Sentinel data)'
      }),
      // 3. OpenStreetMap Inverted Dark
      dark: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }),
      // 4. OpenTopoMap (Topographic Relief Curves)
      topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        maxZoom: 17,
        attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap (CC-BY-SA)'
      })
    };

    // Initialize map on Esri Satellite HD by default
    const map = L.map('map', { zoomControl: false, layers: [layers.satellite] }).setView([20, 0], 3);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    let activeLayerKey = 'satellite';
    let activeMarker = null;
    let activeRadiusCircle = null;

    function switchMapMode(key) {
      if (key === activeLayerKey) return;
      map.removeLayer(layers[activeLayerKey]);
      map.addLayer(layers[key]);
      activeLayerKey = key;
      document.body.className = `mode-${key}`;

      document.querySelectorAll('.map-btn').forEach(btn => btn.classList.remove('active'));
      if (key === 'satellite') document.getElementById('btnSat').classList.add('active');
      if (key === 'sentinel') document.getElementById('btnSentinel').classList.add('active');
      if (key === 'dark') document.getElementById('btnDark').classList.add('active');
      if (key === 'topo') document.getElementById('btnTopo').classList.add('active');
    }

    function plotCoordinates(lat, lng, label, radiusMeters = 0) {
      if (activeMarker) map.removeLayer(activeMarker);
      if (activeRadiusCircle) map.removeLayer(activeRadiusCircle);

      map.flyTo([lat, lng], 13, { duration: 1.5 });

      if (radiusMeters > 0) {
        activeRadiusCircle = L.circle([lat, lng], {
          color: '#38bdf8',
          fillColor: '#38bdf8',
          fillOpacity: 0.15,
          radius: radiusMeters
        }).addTo(map);
      }

      activeMarker = L.marker([lat, lng]).addTo(map)
        .bindPopup(`<b>${label}</b><br>LAT: ${lat.toFixed(5)}<br>LNG: ${lng.toFixed(5)}`)
        .openPopup();
    }

    function locateDeviceGPS() {
      const log = document.getElementById('intelTerminal');
      log.innerHTML = `Acquiring Hardware Geolocation...`;

      if (!navigator.geolocation) {
        log.innerHTML = `<span style="color:var(--accent-red)">GEOLOCATION UNSUPPORTED.</span>`;
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const acc = pos.coords.accuracy;
          plotCoordinates(lat, lng, "Device GPS Position", acc);
          log.innerHTML = `
            <div class="intel-row"><span class="intel-key">SOURCE</span><span class="intel-val" style="color:var(--accent-green)">HARDWARE GPS</span></div>
            <div class="intel-row"><span class="intel-key">LATITUDE</span><span class="intel-val">${lat.toFixed(5)}</span></div>
            <div class="intel-row"><span class="intel-key">LONGITUDE</span><span class="intel-val">${lng.toFixed(5)}</span></div>
            <div class="intel-row"><span class="intel-key">ACCURACY</span><span class="intel-val">~${Math.round(acc)} meters</span></div>
          `;
        },
        (err) => {
          log.innerHTML = `<span style="color:var(--accent-red)">LOCATION PERMISSION DENIED.</span>`;
        },
        { enableHighAccuracy: true }
      );
    }

    async function lookupIP() {
      const ip = document.getElementById('ipInput').value.trim();
      if (!ip) return;

      const log = document.getElementById('intelTerminal');
      log.innerHTML = `Querying GIS Coordinates for target: <br><span style="color:var(--accent-cyan);">${ip}</span>...`;

      try {
        const res = await fetch(`${API_URL}/api/v1/locate-ip?ip=${encodeURIComponent(ip)}&_t=${Date.now()}`);
        const data = await res.json();

        if (data.latitude && data.longitude) {
          plotCoordinates(data.latitude, data.longitude, `Target: ${data.ip}`, data.accuracy_radius_m || 8000);
          log.innerHTML = `
            <div class="intel-row"><span class="intel-key">TARGET</span><span class="intel-val">${data.ip}</span></div>
            <div class="intel-row"><span class="intel-key">CITY / REGION</span><span class="intel-val">${data.city || 'Unknown'}, ${data.country || 'Unknown'}</span></div>
            <div class="intel-row"><span class="intel-key">COORDINATES</span><span class="intel-val">${data.latitude}, ${data.longitude}</span></div>
            <div class="intel-row"><span class="intel-key">NETWORK / ISP</span><span class="intel-val">${data.org || 'Unknown'}</span></div>
          `;
        } else {
          log.innerHTML = `<span style="color:var(--accent-red)">UNABLE TO RESOLVE TARGET.</span>`;
        }
      } catch (err) {
        log.innerHTML = `<span style="color:var(--accent-red)">API CONNECTION ERROR.</span>`;
      }
    }
  </script>
</body>
</html>
