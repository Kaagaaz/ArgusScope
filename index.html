<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARGUSSCOPE // OSINT Recon Dashboard</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts: JetBrains Mono & Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #060913;
      --bg-panel: #0d1322;
      --bg-card: #131c31;
      --border-color: #1e2d4a;
      --accent-cyan: #38bdf8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 16px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }

    /* Header Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 12px;
      height: 12px;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
      border-radius: 2px;
    }

    header h1 {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      letter-spacing: 2px;
      font-weight: 700;
      color: #fff;
    }

    header h1 span { color: var(--accent-cyan); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Map Switcher Buttons */
    .map-switcher {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .map-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .map-btn.active {
      background: var(--accent-cyan);
      color: #000;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }

    .system-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eab308;
      box-shadow: 0 0 8px #eab308;
    }

    .status-dot.online {
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    /* Dashboard Grid Layout */
    .dashboard {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    .sidebar {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .section-title {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '//';
      color: var(--text-muted);
    }

    .drop-zone {
      background: var(--bg-card);
      border: 1px dashed var(--border-color);
      border-radius: 6px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .drop-zone:hover {
      border-color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.03);
    }

    .drop-zone-text {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .drop-zone-text b { color: var(--text-main); }

    input[type="file"] { display: none; }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 10px 12px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-cyan);
    }

    .btn-action {
      background: var(--accent-cyan);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .intel-terminal {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.6;
      flex: 1;
      overflow-y: auto;
    }

    .intel-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed var(--border-color);
      padding: 6px 0;
    }

    .intel-row:last-child { border-bottom: none; }
    .intel-key { color: var(--text-muted); }
    .intel-val { color: var(--accent-cyan); font-weight: 500; }

    .map-container {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    #map { width: 100%; height: 100%; background: #000; }

    /* Map Mode Filter Overrides */
    .mode-dark .leaflet-tile { filter: brightness(0.7) invert(1) contrast(1.2) hue-rotate(200deg) saturate(0.3); }
    .mode-satellite .leaflet-tile { filter: none !important; }
    .mode-topo .leaflet-tile { filter: contrast(1.1) brightness(0.9); }

    .leaflet-container { background: #060913 !important; }
    .leaflet-popup-content-wrapper {
      background: var(--bg-panel) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-color);
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }
    .leaflet-popup-tip { background: var(--bg-panel) !important; }

    @media (max-width: 900px) {
      body { height: auto; overflow: auto; }
      .dashboard { grid-template-columns: 1fr; height: auto; }
      .map-container { height: 450px; }
      .header-actions { flex-direction: column; align-items: flex-end; }
    }
  </style>
</head>
<body class="mode-dark">

  <header>
    <div class="brand">
      <div class="brand-logo"></div>
      <h1>ARGUS<span>SCOPE</span> // OSINT RECON</h1>
    </div>

    <div class="header-actions">
      <!-- Mode Switcher Controls -->
      <div class="map-switcher">
        <button class="map-btn active" id="btnDark" onclick="switchMapMode('dark')">CYBER DARK</button>
        <button class="map-btn" id="btnSat" onclick="switchMapMode('satellite')">SATELLITE</button>
        <button class="map-btn" id="btnTopo" onclick="switchMapMode('topo')">3D TOPO</button>
      </div>

      <div class="system-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">CONNECTING...</span>
      </div>
    </div>
  </header>

  <div class="dashboard">

    <div class="sidebar">

      <div class="section-title">01. Image EXIF Extraction</div>
      <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
        <p class="drop-zone-text" id="fileLabel">Drop image or <b>Click to Select</b></p>
        <input type="file" id="fileInput" accept="image/*" onchange="handleFileUpload(this.files[0])">
      </div>

      <div class="section-title">02. Network Locator</div>
      <div class="input-group">
        <input type="text" id="ipInput" placeholder="Enter target IP (e.g. 8.8.8.8)">
        <button class="btn-action" onclick="lookupIP()">QUERY</button>
      </div>

      <div class="section-title">03. Intelligence Report</div>
      <div class="intel-terminal" id="intelTerminal">
        System initialized. Select an image or query an IP address to begin telemetry extraction.
      </div>

    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const API_URL = "https://argusscope-backend.onrender.com";

    // Define Tile Layers
    const layers = {
      dark: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }),
      satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }),
      topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17 })
    };

    // Initialize Map with Dark Mode Layer
    const map = L.map('map', { zoomControl: false, layers: [layers.dark] }).setView([20, 0], 2);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    let activeLayerKey = 'dark';
    let activeMarker = null;

    // Switch Map Views
    function switchMapMode(key) {
      if (key === activeLayerKey) return;

      map.removeLayer(layers[activeLayerKey]);
      map.addLayer(layers[key]);
      activeLayerKey = key;

      // Update Body Class for CSS Filter effects
      document.body.className = `mode-${key}`;

      // Update Button Highlight State
      document.querySelectorAll('.map-btn').forEach(btn => btn.classList.remove('active'));
      if (key === 'dark') document.getElementById('btnDark').classList.add('active');
      if (key === 'satellite') document.getElementById('btnSat').classList.add('active');
      if (key === 'topo') document.getElementById('btnTopo').classList.add('active');
    }

    // Check API Status on Load
    async function checkBackendStatus() {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      try {
        const res = await fetch(`${API_URL}/`);
        if (res.ok) {
          dot.classList.add('online');
          text.innerText = "API ONLINE";
        } else {
          text.innerText = "API ERROR";
        }
      } catch (e) {
        text.innerText = "WAKING BACKEND...";
        setTimeout(checkBackendStatus, 5000);
      }
    }
    checkBackendStatus();

    function plotCoordinates(lat, lng, label) {
      if (activeMarker) map.removeLayer(activeMarker);

      map.flyTo([lat, lng], 13, { duration: 1.5 });
      
      activeMarker = L.marker([lat, lng]).addTo(map)
        .bindPopup(`<b>${label}</b><br>LAT: ${lat.toFixed(5)}<br>LNG: ${lng.toFixed(5)}`)
        .openPopup();
    }

    async function handleFileUpload(file) {
      if (!file) return;
      document.getElementById('fileLabel').innerText = file.name;
      const log = document.getElementById('intelTerminal');
      log.innerHTML = `Parsing EXIF metadata for: <br><span style="color:var(--accent-cyan);">${file.name}</span>...`;

      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch(`${API_URL}/api/v1/extract-exif`, { method: "POST", body: formData });
        const data = await res.json();

        if (data.latitude && data.longitude) {
          plotCoordinates(data.latitude, data.longitude, file.name);
          log.innerHTML = `
            <div class="intel-row"><span class="intel-key">FILE</span><span class="intel-val">${data.filename}</span></div>
            <div class="intel-row"><span class="intel-key">LATITUDE</span><span class="intel-val">${data.latitude.toFixed(5)}</span></div>
            <div class="intel-row"><span class="intel-key">LONGITUDE</span><span class="intel-val">${data.longitude.toFixed(5)}</span></div>
            <div class="intel-row"><span class="intel-key">STATUS</span><span class="intel-val" style="color:var(--accent-green)">COORDINATES RESOLVED</span></div>
          `;
        } else {
          log.innerHTML = `<span style="color:var(--accent-red)">NO GPS METADATA FOUND IN IMAGE EXIF.</span>`;
        }
      } catch (err) {
        log.innerHTML = `<span style="color:var(--accent-red)">ERROR CONNECTING TO BACKEND API.</span>`;
      }
    }

    async function lookupIP() {
      const ip = document.getElementById('ipInput').value.trim();
      if (!ip) return;
      
      const log = document.getElementById('intelTerminal');
      log.innerHTML = `Querying network routing info for: <br><span style="color:var(--accent-cyan);">${ip}</span>...`;

      try {
        const res = await fetch(`${API_URL}/api/v1/locate-ip?ip=${ip}`);
        const data = await res.json();

        if (data.latitude && data.longitude) {
          plotCoordinates(data.latitude, data.longitude, `IP: ${ip}`);
          log.innerHTML = `
            <div class="intel-row"><span class="intel-key">TARGET IP</span><span class="intel-val">${data.ip}</span></div>
            <div class="intel-row"><span class="intel-key">CITY</span><span class="intel-val">${data.city || 'N/A'}</span></div>
            <div class="intel-row"><span class="intel-key">COUNTRY</span><span class="intel-val">${data.country || 'N/A'}</span></div>
            <div class="intel-row"><span class="intel-key">PROVIDER</span><span class="intel-val">${data.org || 'N/A'}</span></div>
            <div class="intel-row"><span class="intel-key">LAT / LNG</span><span class="intel-val">${data.latitude}, ${data.longitude}</span></div>
          `;
        } else {
          log.innerHTML = `<span style="color:var(--accent-red)">UNABLE TO RESOLVE ROUTE FOR SPECIFIED IP.</span>`;
        }
      } catch (err) {
        log.innerHTML = `<span style="color:var(--accent-red)">ERROR CONNECTING TO BACKEND API.</span>`;
      }
    }
  </script>
</body>
</html>
