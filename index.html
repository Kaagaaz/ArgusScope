<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ArgusScope // Intelligence Engine</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
:root {
    --bg: #070b14;
    --panel: #0d1422;
    --panel-2: #111b2d;
    --border: #1c2a40;

    --cyan: #20b8ec;
    --green: #10c991;

    --text: #e9f1f8;
    --muted: #6f8da8;
    --danger: #ef5363;

    --header-height: 64px;
}

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", monospace;

    overflow: hidden;

    -webkit-tap-highlight-color: transparent;
}

/* =========================
   HEADER
========================= */

.navbar {
    height: var(--header-height);

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;

    padding: 0 16px;

    background: var(--panel);

    border: 1px solid var(--border);
    border-radius: 8px;

    margin: 10px;

    position: relative;
    z-index: 2000;
}

.brand {
    min-width: 0;

    font-size: 17px;
    font-weight: bold;

    color: var(--text);

    white-space: nowrap;
}

.brand span {
    color: var(--cyan);
}

.brand::before {
    content: "■";
    color: var(--cyan);
    margin-right: 9px;
}

/* =========================
   NAV CONTROLS
========================= */

.nav-controls {
    display: flex;
    align-items: center;

    gap: 7px;

    flex-wrap: wrap;
    justify-content: flex-end;
}

.nav-btn {
    border: 1px solid var(--border);

    background: #101a2a;

    color: var(--muted);

    padding: 9px 12px;

    min-height: 38px;

    border-radius: 6px;

    font-family: inherit;
    font-size: 11px;
    font-weight: bold;

    cursor: pointer;

    white-space: nowrap;

    transition:
        background .15s ease,
        color .15s ease,
        border-color .15s ease;
}

.nav-btn:active {
    transform: translateY(1px);
}

.nav-btn.active {
    background: var(--cyan);
    color: #031019;
    border-color: var(--cyan);
}

#gpsBtn {
    color: #d9fff3;
    border-color: var(--green);
}

#gpsBtn.active {
    background: var(--green);
    color: #03150f;
}

/* =========================
   MAIN WORKSPACE
========================= */

.workspace {
    height: calc(100vh - var(--header-height) - 30px);

    margin: 0 10px 10px;

    display: grid;

    grid-template-columns: minmax(280px, 390px) minmax(0, 1fr);

    gap: 10px;

    min-height: 0;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    min-width: 0;
    min-height: 0;

    background: var(--panel);

    border: 1px solid var(--border);
    border-radius: 8px;

    padding: 15px;

    overflow-y: auto;

    display: flex;
    flex-direction: column;

    gap: 16px;

    scrollbar-width: thin;
}

.control-group {
    display: flex;
    flex-direction: column;

    gap: 8px;
}

.section-title {
    color: var(--cyan);

    font-size: 12px;

    letter-spacing: 1px;

    margin-bottom: 2px;
}

/* =========================
   INPUTS
========================= */

input[type="text"] {
    width: 100%;

    height: 48px;

    padding: 0 13px;

    background: #0a1220;

    border: 1px solid var(--border);

    border-radius: 6px;

    color: var(--text);

    font-family: inherit;

    font-size: 14px;

    outline: none;

    -webkit-appearance: none;
}

input[type="text"]::placeholder {
    color: #50657d;
}

input[type="text"]:focus {
    border-color: var(--cyan);

    box-shadow:
        0 0 0 2px rgba(32,184,236,.10);
}

/* =========================
   ACTION BUTTONS
========================= */

.action-btn {
    width: 100%;

    min-height: 48px;

    padding: 10px 12px;

    border: 0;

    border-radius: 6px;

    background: var(--cyan);

    color: #031019;

    font-family: inherit;

    font-size: 12px;

    font-weight: bold;

    letter-spacing: .4px;

    cursor: pointer;

    touch-action: manipulation;
}

.action-btn.green {
    background: var(--green);
}

.action-btn:active {
    transform: translateY(1px);
    filter: brightness(.9);
}

.action-btn:disabled {
    opacity: .55;
    cursor: wait;
}

/* =========================
   TELEMETRY
========================= */

.telemetry-group {
    min-height: 150px;

    flex: 1;

    display: flex;
    flex-direction: column;

    min-width: 0;
}

.terminal {
    flex: 1;

    min-height: 150px;

    background: #050a12;

    border: 1px solid var(--border);

    border-radius: 6px;

    padding: 12px;

    overflow: auto;

    white-space: pre-wrap;

    overflow-wrap: anywhere;

    font-size: 11px;

    line-height: 1.55;

    color: var(--cyan);

    scrollbar-width: thin;
}

.terminal.error {
    color: var(--danger);
}

.terminal.success {
    color: var(--green);
}

/* =========================
   MAP
========================= */

.map-wrapper {
    position: relative;

    min-width: 0;
    min-height: 0;

    border: 1px solid var(--border);

    border-radius: 8px;

    overflow: hidden;

    background: #050a12;
}

#map {
    width: 100%;
    height: 100%;

    min-height: 300px;
}

/*
   Keep Leaflet controls visible above
   application elements.
*/

.leaflet-top,
.leaflet-bottom {
    z-index: 900 !important;
}

.leaflet-control-zoom a {
    width: 38px !important;
    height: 38px !important;

    line-height: 38px !important;

    font-size: 20px !important;
}

/* =========================
   MAP STATUS
========================= */

.map-status {
    position: absolute;

    left: 12px;
    bottom: 12px;

    z-index: 1000;

    background: rgba(5,10,18,.88);

    border: 1px solid var(--border);

    border-radius: 5px;

    padding: 7px 9px;

    color: var(--cyan);

    font-size: 10px;

    pointer-events: none;

    max-width: calc(100% - 24px);

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* =========================
   FOOTER
========================= */

.footer {
    position: fixed;

    left: 10px;
    right: 10px;
    bottom: 7px;

    height: 22px;

    display: flex;
    align-items: center;

    padding: 0 10px;

    color: #38526b;

    font-size: 9px;

    pointer-events: none;

    z-index: 1500;
}

/* =========================
   TABLET
========================= */

@media (max-width: 1000px) {

    .workspace {
        grid-template-columns: 320px minmax(0, 1fr);
    }

    .nav-btn {
        padding: 8px 9px;
        font-size: 10px;
    }

    .brand {
        font-size: 15px;
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 720px) {

    body {
        overflow-y: auto;
        overflow-x: hidden;
    }

    .navbar {
        height: auto;

        min-height: 58px;

        margin: 7px;

        padding: 9px;

        align-items: flex-start;

        flex-direction: column;

        gap: 8px;
    }

    .brand {
        width: 100%;

        font-size: 14px;
    }

    .nav-controls {
        width: 100%;

        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 6px;
    }

    .nav-btn {
        width: 100%;

        min-height: 42px;

        padding: 8px 5px;

        font-size: 10px;
    }

    .workspace {
        height: auto;

        margin: 0 7px 35px;

        display: flex;

        flex-direction: column;

        gap: 8px;

        overflow: visible;
    }

    .sidebar {
        width: 100%;

        max-height: none;

        overflow: visible;

        padding: 12px;

        gap: 14px;
    }

    .control-group {
        gap: 7px;
    }

    .section-title {
        font-size: 11px;
    }

    input[type="text"] {
        height: 50px;

        font-size: 15px;
    }

    .action-btn {
        min-height: 50px;

        font-size: 12px;
    }

    .telemetry-group {
        min-height: 180px;
    }

    .terminal {
        min-height: 180px;

        max-height: 280px;

        font-size: 11px;
    }

    .map-wrapper {
        height: 55vh;

        min-height: 380px;

        width: 100%;
    }

    #map {
        height: 100%;
        min-height: 380px;
    }

    .leaflet-control-zoom {
        margin-top: 10px !important;
        margin-left: 10px !important;
    }

    .leaflet-control-zoom a {
        width: 42px !important;
        height: 42px !important;

        line-height: 42px !important;

        font-size: 22px !important;
    }

    .footer {
        height: 25px;

        bottom: 2px;

        left: 7px;
        right: 7px;

        background: rgba(7,11,20,.92);

        border-top: 1px solid var(--border);

        font-size: 8px;
    }
}

/* =========================
   SMALL PHONES
========================= */

@media (max-width: 420px) {

    .brand {
        font-size: 12px;
    }

    .nav-btn {
        font-size: 9px;
    }

    .sidebar {
        padding: 10px;
    }

    .map-wrapper {
        min-height: 340px;
        height: 52vh;
    }

    #map {
        min-height: 340px;
    }
}

/* =========================
   LANDSCAPE PHONE
========================= */

@media (max-width: 900px) and (orientation: landscape) {

    .navbar {
        flex-direction: row;

        align-items: center;

        height: 55px;
    }

    .nav-controls {
        width: auto;

        grid-template-columns: none;

        display: flex;
    }

    .workspace {
        display: grid;

        grid-template-columns: minmax(260px, 330px) minmax(0, 1fr);

        height: calc(100vh - 75px);

        overflow: hidden;
    }

    .sidebar {
        overflow-y: auto;
    }

    .map-wrapper {
        height: 100%;
        min-height: 0;
    }

    #map {
        min-height: 0;
    }

    .footer {
        display: none;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="navbar">

    <div class="brand">
        ArgusScope <span>// INTELLIGENCE ENGINE</span>
    </div>

    <div class="nav-controls">

        <button
            class="nav-btn"
            id="btnViews"
            onclick="toggleViews()">
            ◇ VIEWS
        </button>

        <button
            class="nav-btn"
            id="gpsBtn"
            onclick="triggerHardwareGps()">
            ✦ DEVICE GPS
        </button>

        <button
            class="nav-btn"
            id="btnGoogle"
            onclick="setMapLayer('google')">
            GOOGLE HD
        </button>

        <button
            class="nav-btn active"
            id="btnEsri"
            onclick="setMapLayer('esri')">
            ESRI SATELLITE
        </button>

        <button
            class="nav-btn"
            id="btnDark"
            onclick="setMapLayer('dark')">
            CYBER DARK
        </button>

    </div>

</header>


<!-- =========================
     WORKSPACE
========================= -->

<main class="workspace">

    <!-- =====================
         SIDEBAR
    ====================== -->

    <aside class="sidebar">

        <!-- IP -->

        <section class="control-group">

            <div class="section-title">
                // 01. STANDARD IP LOOKUP
            </div>

            <input
                id="ipInput"
                type="text"
                inputmode="decimal"
                autocomplete="off"
                spellcheck="false"
                placeholder="Enter Target IP (e.g. 8.8.8.8)"
            >

            <button
                id="ipButton"
                class="action-btn"
                onclick="executeIpSearch()">
                EXECUTE IP SEARCH
            </button>

        </section>


        <!-- BSSID -->

        <section class="control-group">

            <div class="section-title">
                // 02. WIGLE BSSID LOOKUP
            </div>

            <input
                id="bssidInput"
                type="text"
                inputmode="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="AA:BB:CC:DD:EE:FF"
            >

            <button
                id="bssidButton"
                class="action-btn green"
                onclick="executeBssidSearch()">
                LOCATE BSSID
            </button>

        </section>


        <!-- TELEMETRY -->

        <section class="telemetry-group">

            <div class="section-title">
                // 03. INTELLIGENCE
            </div>

            <div
                id="telemetryOutput"
                class="terminal">
                ArgusScope frontend initialized.
                Awaiting target acquisition parameters...
            </div>

        </section>

    </aside>


    <!-- =====================
         MAP
    ====================== -->

    <section class="map-wrapper">

        <div id="map"></div>

        <div
            id="mapStatus"
            class="map-status">
            MAP // READY
        </div>

    </section>

</main>


<footer class="footer">
    ARGUSSCOPE&nbsp;&nbsp; // &nbsp;&nbsp;BACKEND: RENDER&nbsp;&nbsp; // &nbsp;&nbsp;SOURCE: GITHUB
</footer>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ========================================================
   CONFIG
======================================================== */

const BACKEND_URL =
    "https://argusscope-backend.onrender.com";


/* ========================================================
   MAP
======================================================== */

const map = L.map("map", {
    zoomControl: true,
    attributionControl: true,

    // Prevent the map from interfering with page scrolling
    scrollWheelZoom: true,
    doubleClickZoom: true,
    dragging: true,
    touchZoom: true
}).setView([23.83, 91.28], 5);


/* ========================================================
   MAP LAYERS
======================================================== */

const layers = {

    esri: L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom: 19,
            attribution: "Tiles &copy; Esri"
        }
    ),

    google: L.tileLayer(
        "https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",
        {
            maxZoom: 20,
            subdomains: ["mt0", "mt1", "mt2", "mt3"],
            attribution: "&copy; Google Maps"
        }
    ),

    dark: L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
            maxZoom: 20,
            subdomains: "abcd",
            attribution: "&copy; CARTO"
        }
    )
};


/* Default */

layers.esri.addTo(map);


/* ========================================================
   LAYER SWITCHING
======================================================== */

function setMapLayer(type) {

    Object.values(layers).forEach(layer => {

        if (map.hasLayer(layer)) {
            map.removeLayer(layer);
        }

    });

    if (layers[type]) {
        layers[type].addTo(map);
    }

    document
        .querySelectorAll(".nav-btn")
        .forEach(button => {

            button.classList.remove("active");

        });

    const buttonMap = {

        google: "btnGoogle",
        esri: "btnEsri",
        dark: "btnDark"

    };

    if (buttonMap[type]) {

        document
            .getElementById(buttonMap[type])
            .classList.add("active");

    }

    updateMapStatus(
        "MAP // " + type.toUpperCase()
    );
}


/* ========================================================
   VIEWS BUTTON
======================================================== */

function toggleViews() {

    const controls =
        document.querySelectorAll(
            "#btnGoogle, #btnEsri, #btnDark"
        );

    const hidden =
        controls[0].style.display === "none";

    controls.forEach(button => {

        button.style.display =
            hidden ? "" : "none";

    });

    document
        .getElementById("btnViews")
        .classList.toggle("active", !hidden);
}


/* ========================================================
   MAP MARKERS
======================================================== */

let currentMarker = null;
let currentCircle = null;


function clearMapResult() {

    if (currentMarker) {

        map.removeLayer(currentMarker);
        currentMarker = null;

    }

    if (currentCircle) {

        map.removeLayer(currentCircle);
        currentCircle = null;

    }

}


function renderMapPosition(
    lat,
    lon,
    radiusMeters,
    titleInfo
) {

    if (
        typeof lat !== "number" ||
        typeof lon !== "number" ||
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
    ) {

        return;

    }

    clearMapResult();


    currentMarker = L.marker(
        [lat, lon]
    )
    .addTo(map)
    .bindPopup(
        `<b>${escapeHtml(titleInfo)}</b>
         <br>Lat: ${lat.toFixed(6)}
         <br>Lon: ${lon.toFixed(6)}`
    );


    if (
        radiusMeters &&
        Number.isFinite(Number(radiusMeters)) &&
        Number(radiusMeters) > 0
    ) {

        currentCircle = L.circle(
            [lat, lon],
            {
                radius: Number(radiusMeters),

                color: "#20b8ec",

                fillColor: "#20b8ec",

                fillOpacity: .12,

                weight: 2
            }
        ).addTo(map);

    }


    /*
       IMPORTANT:
       fitBounds is used instead of repeatedly forcing
       a fixed zoom level. This prevents the marker/circle
       from being lost when the user zooms.
    */

    if (currentCircle) {

        map.fitBounds(
            currentCircle.getBounds(),
            {
                padding: [30, 30],
                maxZoom: 17
            }
        );

    } else {

        map.setView(
            [lat, lon],
            14,
            {
                animate: true
            }
        );

    }


    updateMapStatus(
        `MAP // ${lat.toFixed(4)}, ${lon.toFixed(4)}`
    );


    setTimeout(() => {

        map.invalidateSize();

    }, 250);
}


/* ========================================================
   HTML ESCAPE
======================================================== */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* ========================================================
   STATUS
======================================================== */

function setTelemetry(
    message,
    type = "normal"
) {

    const terminal =
        document.getElementById(
            "telemetryOutput"
        );

    terminal.className =
        "terminal";

    if (type === "error") {
        terminal.classList.add("error");
    }

    if (type === "success") {
        terminal.classList.add("success");
    }

    terminal.textContent = message;
}


function updateMapStatus(message) {

    document.getElementById(
        "mapStatus"
    ).textContent = message;
}


/* ========================================================
   SAFE JSON RESPONSE
======================================================== */

async function readResponse(response) {

    const text =
        await response.text();

    if (!text) {

        throw new Error(
            `Server returned an empty response (HTTP ${response.status}).`
        );

    }

    try {

        return JSON.parse(text);

    } catch {

        throw new Error(
            `Server returned HTTP ${response.status} with a non-JSON response.`
        );

    }
}


/* ========================================================
   BUTTON STATE
======================================================== */

function setButtonLoading(
    buttonId,
    loading
) {

    const button =
        document.getElementById(buttonId);

    if (!button) return;

    button.disabled = loading;

    if (loading) {

        button.dataset.originalText =
            button.textContent;

        button.textContent =
            "QUERYING...";

    } else {

        button.textContent =
            button.dataset.originalText ||
            button.textContent;

    }
}


/* ========================================================
   IP LOOKUP
======================================================== */

async function executeIpSearch() {

    const input =
        document.getElementById(
            "ipInput"
        );

    const ip =
        input.value.trim();


    if (!ip) {

        setTelemetry(
            "Enter an IP address first.",
            "error"
        );

        input.focus();

        return;
    }


    setButtonLoading(
        "ipButton",
        true
    );


    setTelemetry(
        `Querying IP telemetry for ${ip}...`
    );


    updateMapStatus(
        "MAP // QUERYING"
    );


    try {

        const url =
            `${BACKEND_URL}/api/v1/locate-ip?ip=${encodeURIComponent(ip)}`;


        const response =
            await fetch(
                url,
                {
                    method: "GET",
                    headers: {
                        "Accept":
                            "application/json"
                    },

                    cache: "no-store"
                }
            );


        const data =
            await readResponse(
                response
            );


        if (
            data.success &&
            Number.isFinite(
                Number(data.latitude)
            ) &&
            Number.isFinite(
                Number(data.longitude)
            )
        ) {

            setTelemetry(
                JSON.stringify(
                    data,
                    null,
                    2
                ),
                "success"
            );


            renderMapPosition(

                Number(data.latitude),

                Number(data.longitude),

                Number(
                    data.accuracy_radius_m ||
                    5000
                ),

                `IP Target: ${data.ip || ip}`

            );

        } else {

            setTelemetry(
                data.error ||
                "IP lookup failed.",
                "error"
            );

            updateMapStatus(
                "MAP // NO RESULT"
            );

        }

    } catch (error) {

        setTelemetry(
            `IP LOOKUP FAILED\n\n${error.message}`,
            "error"
        );

        updateMapStatus(
            "MAP // BACKEND ERROR"
        );

    } finally {

        setButtonLoading(
            "ipButton",
            false
        );

    }
}


/* ========================================================
   BSSID LOOKUP
======================================================== */

async function executeBssidSearch() {

    const input =
        document.getElementById(
            "bssidInput"
        );


    const rawInput =
        input.value.trim();


    if (!rawInput) {

        setTelemetry(
            "Enter a BSSID first.",
            "error"
        );

        input.focus();

        return;
    }


    /*
       Multiple BSSIDs may be separated by commas.
    */

    const macList =
        rawInput
            .split(",")
            .map(
                mac => mac.trim()
            )
            .filter(Boolean);


    setButtonLoading(
        "bssidButton",
        true
    );


    try {

        let endpoint;

        let options;


        if (macList.length > 1) {

            endpoint =
                `${BACKEND_URL}/api/v1/triangulate-cluster`;


            options = {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "Accept":
                        "application/json"
                },

                body: JSON.stringify({

                    scans:
                        macList.map(
                            mac => ({
                                netid: mac,
                                rssi: -65
                            })
                        )

                })

            };


            setTelemetry(
                `Resolving ${macList.length} BSSID observations...`
            );

        } else {

            endpoint =
                `${BACKEND_URL}/api/v1/locate-bssid?netid=${encodeURIComponent(macList[0])}`;


            options = {

                method: "GET",

                headers: {
                    "Accept":
                        "application/json"
                },

                cache: "no-store"

            };


            setTelemetry(
                `Querying BSSID telemetry for ${macList[0]}...`
            );

        }


        updateMapStatus(
            "MAP // QUERYING"
        );


        const response =
            await fetch(
                endpoint,
                options
            );


        const data =
            await readResponse(
                response
            );


        if (
            data.success &&
            Number.isFinite(
                Number(data.latitude)
            ) &&
            Number.isFinite(
                Number(data.longitude)
            )
        ) {

            setTelemetry(
                JSON.stringify(
                    data,
                    null,
                    2
                ),
                "success"
            );


            const label =
                data.cluster_size
                    ? `Cluster Target (${data.cluster_size} Nodes)`
                    : `BSSID: ${data.bssid || macList[0]}`;


            renderMapPosition(

                Number(data.latitude),

                Number(data.longitude),

                Number(
                    data.accuracy_radius_m ||
                    25
                ),

                label

            );

        } else {

            setTelemetry(
                data.error ||
                "BSSID not found in WiGLE database.",
                "error"
            );

            updateMapStatus(
                "MAP // NO RESULT"
            );

        }

    } catch (error) {

        setTelemetry(
            `BSSID LOOKUP FAILED\n\n${error.message}`,
            "error"
        );

        updateMapStatus(
            "MAP // BACKEND ERROR"
        );

    } finally {

        setButtonLoading(
            "bssidButton",
            false
        );

    }
}


/* ========================================================
   DEVICE GPS
======================================================== */

function triggerHardwareGps() {

    const button =
        document.getElementById(
            "gpsBtn"
        );


    if (!navigator.geolocation) {

        setTelemetry(
            "Device GPS is not supported by this browser.",
            "error"
        );

        return;
    }


    button.classList.add(
        "active"
    );


    setTelemetry(
        "Requesting device GPS permission..."
    );


    updateMapStatus(
        "MAP // ACQUIRING GPS"
    );


    navigator.geolocation.getCurrentPosition(

        position => {

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;


            setTelemetry(

                [
                    "GPS LOCK ACQUIRED",

                    `Latitude : ${lat}`,

                    `Longitude: ${lon}`,

                    `Accuracy : ±${Math.round(accuracy)} m`

                ].join("\n"),

                "success"

            );


            renderMapPosition(

                lat,

                lon,

                accuracy,

                "Device GPS"

            );


            button.classList.remove(
                "active"
            );

        },


        error => {

            let message =
                "GPS acquisition failed.";

            if (error.code === 1) {

                message =
                    "GPS permission was denied.";

            } else if (error.code === 2) {

                message =
                    "Device location is unavailable.";

            } else if (error.code === 3) {

                message =
                    "GPS request timed out.";

            }


            setTelemetry(
                message,
                "error"
            );


            updateMapStatus(
                "MAP // GPS FAILED"
            );


            button.classList.remove(
                "active"
            );

        },

        {

            enableHighAccuracy: true,

            timeout: 15000,

            maximumAge: 0

        }

    );
}
