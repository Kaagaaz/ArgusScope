<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArgusScope // WiGLE ENGINE</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Navigation Bar */
        .navbar {
            height: 60px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .brand {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent-cyan);
            letter-spacing: 1px;
        }

        .nav-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-btn {
            background-color: #1f2937;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
        }

        .nav-btn.active {
            background-color: var(--accent-cyan);
            color: #030712;
            border-color: var(--accent-cyan);
        }

        .nav-btn#gpsBtn {
            background-color: #065f46;
            color: #ecfdf5;
            border-color: var(--accent-green);
        }

        /* Workspace Layout */
        .workspace {
            display: flex;
            flex-grow: 1;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        /* Sidebar Control Panel */
        .sidebar {
            width: 420px;
            min-width: 420px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            gap: 15px;
        }

        .section-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        input[type="text"] {
            width: 100%;
            background-color: #030712;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        button.action-btn {
            width: 100%;
            background-color: var(--accent-cyan);
            color: #030712;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button.action-btn:hover {
            opacity: 0.9;
        }

        /* Telemetry Terminal Output */
        .terminal {
            background-color: #030712;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
            font-size: 0.75rem;
            color: #ef4444; /* Error/status color matching screenshot */
            height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Map Container */
        #map {
            flex-grow: 1;
            height: 100%;
            background-color: var(--bg-color);
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="navbar">
        <div class="brand">
            <span>ArgusScope // WiGLE ENGINE</span>
        </div>
        <div class="nav-controls">
            <button class="nav-btn" id="gpsBtn" onclick="triggerHardwareGps()">Hardware GPS</button>
            <button class="nav-btn" onclick="setMapLayer('google')" id="btnGoogle">Google HD</button>
            <button class="nav-btn active" onclick="setMapLayer('esri')" id="btnEsri">Esri Satellite</button>
            <button class="nav-btn" onclick="setMapLayer('dark')" id="btnDark">Cyber Dark</button>
        </div>
    </div>

    <!-- Workspace -->
    <div class="workspace">
        <!-- Sidebar Control Panel -->
        <div class="sidebar">
            
            <!-- 01. Standard IP Lookup -->
            <div class="control-group">
                <div class="section-title">// 01. Standard IP Lookup</div>
                <input type="text" id="ipInput" placeholder="Enter Target IP (e.g., 184.84.167.84)">
                <button class="action-btn" onclick="executeIpSearch()">Execute IP Search</button>
            </div>

            <!-- 02. WiGLE BSSID Triangulation -->
            <div class="control-group">
                <div class="section-title">// 02. WiGLE BSSID Triangulation</div>
                <input type="text" id="bssidInput" value="1C:F2:9A:BC:FB:20" placeholder="Single BSSID or cluster">
                <button class="action-btn" style="background-color: var(--accent-green); color: #030712;" onclick="executeBssidSearch()">Triangulate BSSID</button>
            </div>

            <!-- 03. Telemetry Terminal -->
            <div class="control-group" style="flex-grow: 1; display: flex; flex-direction: column;">
                <div class="section-title">// 03. Telemetry Terminal</div>
                <div id="telemetryOutput" class="terminal">System initialized. Awaiting target acquisition parameters...</div>
            </div>

        </div>

        <!-- Map Canvas -->
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Initialize Map
        const map = L.map('map').setView([30.0, 10.0], 3);

        // Map Layers
        const layers = {
            esri: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: 'Tiles &copy; Esri'
            }),
            google: L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: '&copy; Google Maps'
            }),
            dark: L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png', {
                maxZoom: 19,
                subdomains: 'abcd',
                attribution: '&copy; CARTO'
            })
        };

        // Default to Esri Satellite view
        layers.esri.addTo(map);

        function setMapLayer(type) {
            document.querySelectorAll('.nav-btn:not(#gpsBtn)').forEach(btn => btn.classList.remove('active'));
            if (type === 'esri') document.getElementById('btnEsri').classList.add('active');
            if (type === 'google') document.getElementById('btnGoogle').classList.add('active');
            if (type === 'dark') document.getElementById('btnDark').classList.add('active');

            Object.values(layers).forEach(l => map.removeLayer(l));
            layers[type].addTo(map);
        }

        let currentMarker = null;
        let currentCircle = null;
        const BACKEND_URL = "https://argusscope-backend.onrender.com";

        function renderMapPosition(lat, lon, radiusMeters, titleInfo) {
            if (currentMarker) map.removeLayer(currentMarker);
            if (currentCircle) map.removeLayer(currentCircle);

            currentMarker = L.marker([lat, lon]).addTo(map)
                .bindPopup(`<b>${titleInfo}</b><br>Lat: ${lat}<br>Lon: ${lon}`).openPopup();

            if (radiusMeters) {
                currentCircle = L.circle([lat, lon], {
                    radius: radiusMeters,
                    color: '#06b6d4',
                    fillColor: '#06b6d4',
                    fillOpacity: 0.15
                }).addTo(map);
            }

            map.setView([lat, lon], 16);
        }

        async function executeIpSearch() {
            const ip = document.getElementById("ipInput").value.trim();
            if (!ip) return;

            const terminal = document.getElementById("telemetryOutput");
            terminal.style.color = "var(--accent-cyan)";
            terminal.innerText = `Querying IP telemetry for ${ip}...`;

            try {
                const response = await fetch(`${BACKEND_URL}/api/v1/locate-ip?ip=${encodeURIComponent(ip)}`);
                const data = await response.json();

                terminal.innerText = JSON.stringify(data, null, 2);

                if (data.latitude && data.longitude) {
                    renderMapPosition(data.latitude, data.longitude, data.accuracy_radius_m || 5000, `IP Target: ${data.ip}`);
                } else {
                    terminal.style.color = "#ef4444";
                    terminal.innerText = "IP resolution failed: " + (data.error || "Unknown error");
                }
            } catch (err) {
                terminal.style.color = "#ef4444";
                terminal.innerText = `Critical Network Error: ${err.message}`;
            }
        }

        async function executeBssidSearch() {
            const rawInput = document.getElementById("bssidInput").value.trim();
            if (!rawInput) return;

            const macList = rawInput.split(',').map(m => m.trim()).filter(m => m.length > 0);
            const terminal = document.getElementById("telemetryOutput");
            terminal.style.color = "var(--accent-cyan)";
            
            let endpoint = "";
            let options = {};

            if (macList.length > 1) {
                endpoint = `${BACKEND_URL}/api/v1/triangulate-cluster`;
                options = {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        scans: macList.map(mac => ({ netid: mac, rssi: -65 })) 
                    })
                };
                terminal.innerText = `Computing multi-point sensor fusion across ${macList.length} nodes...`;
            } else {
                endpoint = `${BACKEND_URL}/api/v1/locate-bssid?netid=${encodeURIComponent(macList[0])}`;
                options = { method: "GET" };
                terminal.innerText = `Querying single BSSID telemetry for ${macList[0]}...`;
            }

            try {
                const response = await fetch(endpoint, options);
                const data = await response.json();

                terminal.innerText = JSON.stringify(data, null, 2);

                if (data.latitude && data.longitude) {
                    const label = data.cluster_size ? `Cluster Target (${data.cluster_size} Nodes)` : `BSSID: ${data.bssid || macList[0]}`;
                    renderMapPosition(data.latitude, data.longitude, data.accuracy_radius_m || 25, label);
                } else {
                    terminal.style.color = "#ef4444";
                    terminal.innerText = data.error || "BSSID not found in WiGLE database";
                }
            } catch (err) {
                terminal.style.color = "#ef4444";
                terminal.innerText = `BSSID not found in WiGLE database (${err.message})`;
            }
        }

        function triggerHardwareGps() {
            const terminal = document.getElementById("telemetryOutput");
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser");
                return;
            }

            terminal.style.color = "var(--accent-green)";
            terminal.innerText = "Acquiring hardware GPS coordinates...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    terminal.innerText = `GPS Lock Acquired:\nLat: ${lat}\nLon: ${lon}\nAccuracy: ±${accuracy}m`;
                    renderMapPosition(lat, lon, accuracy, "Hardware GPS Target");
                },
                (error) => {
                    terminal.style.color = "#ef4444";
                    terminal.innerText = `GPS Acquisition Failed: ${error.message}`;
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }
    </script>
</body>
</html>
