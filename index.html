<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARGUSSCOPE // Advanced Network Recon</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #060913;
      --bg-panel: #0d1322;
      --bg-card: #131c31;
      --border-color: #1e2d4a;
      --accent-cyan: #38bdf8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 16px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 20px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-logo {
      width: 12px; height: 12px;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
      border-radius: 2px;
    }

    header h1 {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      letter-spacing: 2px;
      font-weight: 700;
      color: #fff;
    }

    header h1 span { color: var(--accent-cyan); }

    .header-actions { display: flex; align-items: center; gap: 16px; }

    .map-switcher {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .map-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .map-btn.active {
      background: var(--accent-cyan);
      color: #000;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }

    .btn-gps {
      background: var(--accent-green);
      color: #000;
      border: none;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .system-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #eab308;
    }

    .status-dot.online {
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .dashboard {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    .sidebar {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .section-title {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .input-group { display: flex; gap: 8px; }

    input[type="text"] {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 10px 12px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    .btn-action {
      background: var(--accent-cyan);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-weight: 700;
      cursor: pointer;
    }

    .intel-terminal {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.6;
      flex: 1;
      overflow-y: auto;
    }

    .intel-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed var(--border-color);
      padding: 6px 0;
    }

    .intel-row:last-child { border-bottom: none; }
    .intel-key { color: var(--text-muted); }
    .intel-val { color: var(--accent-cyan); font-weight: 500; text-align: right; word-break: break-all; }

    .map-container {
      position: relative;
      width: 100%; height: 100%;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    #map { width: 100%; height: 100%; background: #000; }

    .mode-dark .leaflet-tile { filter: brightness(0.7) invert(1) contrast(1.2) hue-rotate(200deg) saturate(0.3); }
    .mode-satellite .leaflet-tile { filter: none !important; }
    .mode-topo .leaflet-tile { filter: contrast(1.1) brightness(0.9); }

    .leaflet-container { background: #060913 !important; }
    .leaflet-popup-content-wrapper {
      background: var(--bg-panel) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-color);
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }
  </style>
</head>
<body class="mode-dark">

  <header>
    <div class="brand">
      <div class="brand-logo"></div>
      <h1>ARGUS<span>SCOPE</span> // CONSENSUS ENGINE</h1>
    </div>

    <div class="header-actions">
      <button class="btn-gps" onclick="locateDeviceGPS()">📍 MY GPS</button>

      <div class="map-switcher">
        <button class="map-btn active" id="btnDark" onclick="switchMapMode('dark')">CYBER DARK</button>
        <button class="map-btn" id="btnSat" onclick="switchMapMode('satellite')">SATELLITE</button>
        <button class="map-btn" id="btnTopo" onclick="switchMapMode('topo')">3D TOPO</button>
      </div>

      <div class="system-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">CONNECTING...</span>
      </div>
    </div>
  </header>

  <div class="dashboard">

    <div class="sidebar">

      <div class="section-title">// 01. Network Target Intelligence</div>
      <div class="input-group">
        <input type="text" id="ipInput" placeholder="Enter IP or Domain (e.g. 8.8.8.8)">
        <button class="btn-action" onclick="lookupIP()">QUERY</button>
      </div>

      <div class="section-title">// 02. Multi-Source Telemetry</div>
      <div class="intel-terminal" id="intelTerminal">
        Consensus Engine active. Enter an IP or domain to execute multi-database triangulation.
      </div>

    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const API_URL = "https://argusscope-backend.onrender.com";

    const layers = {
      dark: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }),
      satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }),
      topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17 })
    };

    const map = L.map('map', { zoomControl: false, layers: [layers.dark] }).setView([20, 0], 2);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    let activeLayerKey = 'dark';
    let activeMarker = null;
    let activeRadiusCircle = null;

    function switchMapMode(key) {
      if (key === activeLayerKey) return;
      map.removeLayer(layers[activeLayerKey]);
      map.addLayer(layers[key]);
      activeLayerKey = key;
      document.body.className = `mode-${key}`;

      document.querySelectorAll('.map-btn').forEach(btn => btn.classList.remove('active'));
      if (key === 'dark') document.getElementById('btnDark').classList.add('active');
      if (key === 'satellite') document.getElementById('btnSat').classList.add('active');
      if (key === 'topo') document.getElementById('btnTopo').classList.add('active');
    }

    async function checkBackendStatus() {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      try {
        const res = await fetch(`${API_URL}/`);
        if (res.ok) {
          dot.classList.add('online');
          text.innerText = "ENGINE ONLINE";
        } else {
          text.innerText = "API ERROR";
        }
      } catch (e) {
        text.innerText = "WAKING ENGINE...";
        setTimeout(checkBackendStatus, 5000);
      }
    }
    checkBackendStatus();

    function plotCoordinates(lat, lng, label, radiusMeters = 0) {
      if (activeMarker) map.removeLayer(activeMarker);
      if (activeRadiusCircle) map.removeLayer(activeRadiusCircle);

      map.flyTo([lat, lng], 11, { duration: 1.2 });

      // Draw dynamic uncertainty radius circle
      if (radiusMeters > 0) {
        activeRadiusCircle = L.circle([lat, lng], {
          color: '#38bdf8',
          fillColor: '#38bdf8',
          fillOpacity: 0.15,
          radius: radiusMeters
        }).addTo(map);
      }

      activeMarker = L.marker([lat, lng]).addTo(map)
        .bindPopup(`<b>${label}</b><br>LAT: ${lat.toFixed(5)}<br>LNG: ${lng.toFixed(5)}<br>Uncertainty: ~${Math.round(radiusMeters/1000)} km`)
        .openPopup();
    }

    function locateDeviceGPS() {
      const log = document.getElementById('intelTerminal');
      log.innerHTML = `Requesting device hardware location...`;

      if (!navigator.geolocation) {
        log.innerHTML = `<span style="color:var(--accent-red)">GEOLOCATION NOT SUPPORTED.</span>`;
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const acc = position.coords.accuracy;
          plotCoordinates(lat, lng, "Device GPS Position", acc);
          log.innerHTML = `
            <div class="intel-row"><span class="intel-key">SOURCE</span><span class="intel-val" style="color:var(--accent-green)">HARDWARE GPS</span></div>
            <div class="intel-row"><span class="intel-key">LATITUDE</span><span class="intel-val">${lat.toFixed(5)}</span></div>
            <div class="intel-row"><span class="intel-key">LONGITUDE</span><span class="intel-val">${lng.toFixed(5)}</span></div>
            <div class="intel-row"><span class="intel-key">ACCURACY</span><span class="intel-val">~${Math.round(acc)} meters</span></div>
          `;
        },
        (error) => {
          log.innerHTML = `<span style="color:var(--accent-red)">LOCATION ACCESS DENIED.</span>`;
        },
        { enableHighAccuracy: true }
      );
    }

    async function lookupIP() {
      const ipInput = document.getElementById('ipInput');
      const ip = ipInput.value.trim();
      if (!ip) return;

      const log = document.getElementById('intelTerminal');
      log.innerHTML = `Executing consensus triangulation on: <br><span style="color:var(--accent-cyan);">${ip}</span>...`;

      try {
        const res = await fetch(`${API_URL}/api/v1/locate-ip?ip=${encodeURIComponent(ip)}&_t=${Date.now()}`);
        const data = await res.json();

        if (data.latitude && data.longitude) {
          plotCoordinates(data.latitude, data.longitude, `Target: ${data.ip}`, data.accuracy_radius_m);
          log.innerHTML = `
            <div class="intel-row"><span class="intel-key">TARGET IP</span><span class="intel-val">${data.ip}</span></div>
            <div class="intel-row"><span class="intel-key">CONFIDENCE</span><span class="intel-val" style="color:var(--accent-green)">${data.confidence}</span></div>
            <div class="intel-row"><span class="intel-key">CITY / COUNTRY</span><span class="intel-val">${data.city}, ${data.country}</span></div>
            <div class="intel-row"><span class="intel-key">rDNS HOSTNAME</span><span class="intel-val">${data.hostname}</span></div>
            <div class="intel-row"><span class="intel-key">rDNS CITY HINT</span><span class="intel-val">${data.rdns_city_hint}</span></div>
            <div class="intel-row"><span class="intel-key">ISP / NETWORK</span><span class="intel-val">${data.org}</span></div>
            <div class="intel-row"><span class="intel-key">CONSENSUS COORDS</span><span class="intel-val">${data.latitude}, ${data.longitude}</span></div>
            <div class="intel-row"><span class="intel-key">RADIUS / UNCERTAINTY</span><span class="intel-val">~${Math.round(data.accuracy_radius_m/1000)} km</span></div>
            <div class="intel-row"><span class="intel-key">APIS QUERIED</span><span class="intel-val">${data.sources_queried} Providers</span></div>
          `;
        } else {
          log.innerHTML = `<span style="color:var(--accent-red)">UNABLE TO RESOLVE SPECIFIED TARGET.</span>`;
        }
      } catch (err) {
        log.innerHTML = `<span style="color:var(--accent-red)">ERROR CONNECTING TO BACKEND API.</span>`;
      }
    }
  </script>
</body>
</html>
