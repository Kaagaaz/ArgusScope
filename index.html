<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArgusScope // Intelligence Engine</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
  --bg:#050a13;
  --panel:#0b1321;
  --panel2:#101b2d;
  --line:#1b2b45;
  --text:#dce8f5;
  --muted:#647a95;
  --cyan:#27baf2;
  --green:#12c58b;
  --red:#ff5365;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:"JetBrains Mono",Consolas,monospace;
}

button,input{
  font:inherit;
}

.app{
  height:100vh;
  padding:9px;
  display:grid;
  grid-template-rows:46px 1fr 23px;
  gap:7px;
}

/* HEADER */

header{
  border:1px solid var(--line);
  border-radius:6px;
  background:var(--panel);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:6px 11px;
}

.logo{
  display:flex;
  align-items:center;
  gap:7px;

  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
}

.logo-dot{
  width:10px;
  height:10px;
  background:var(--cyan);
  border-radius:2px;
  box-shadow:0 0 12px #27baf288;
}

.logo span{
  color:var(--cyan);
}

/* HEADER BUTTONS */

.header-actions{
  display:flex;
  gap:5px;
}

.header-btn{
  border:1px solid var(--line);
  background:#0d1828;
  color:#72869e;

  padding:6px 10px;
  border-radius:4px;

  font-size:9px;
  font-weight:bold;

  cursor:pointer;
}

.header-btn:hover{
  border-color:var(--cyan);
  color:var(--cyan);
}

.header-btn.gps{
  color:#72cfae;
}

.header-btn.gps:hover{
  border-color:var(--green);
  color:var(--green);
}

/* VIEW MENU */

.view-container{
  position:relative;
}

.view-menu{
  display:none;

  position:absolute;
  right:0;
  top:34px;

  width:190px;

  padding:6px;

  background:#0b1321;
  border:1px solid var(--line);
  border-radius:5px;

  z-index:2000;
  box-shadow:0 10px 30px #0008;
}

.view-menu.open{
  display:block;
}

.view-label{
  padding:6px 7px;

  color:#58708d;
  font-size:8px;
  letter-spacing:1px;

  border-bottom:1px solid #ffffff08;
  margin-bottom:4px;
}

.view-option{
  width:100%;

  padding:8px;

  border:0;
  border-radius:3px;

  background:transparent;
  color:#8295aa;

  text-align:left;
  font-size:9px;

  cursor:pointer;
}

.view-option:hover{
  background:#122137;
  color:var(--cyan);
}

.view-option.active{
  color:var(--cyan);
}

/* MAIN */

main{
  min-height:0;

  display:grid;
  grid-template-columns:292px 1fr;
  gap:7px;
}

/* SIDEBAR */

.sidebar{
  min-height:0;

  overflow:auto;

  padding:10px;

  border:1px solid var(--line);
  border-radius:6px;

  background:var(--panel);
}

.section{
  margin-bottom:13px;
}

.title{
  color:var(--cyan);

  font-size:9px;
  letter-spacing:1px;

  margin-bottom:6px;
}

input{
  width:100%;
  height:33px;

  padding:7px 9px;

  border:1px solid var(--line);
  border-radius:4px;

  background:var(--panel2);
  color:var(--text);

  outline:none;

  font-size:10px;
}

input:focus{
  border-color:var(--cyan);
}

input::placeholder{
  color:#536881;
}

.action{
  width:100%;
  height:33px;

  margin-top:5px;

  border:0;
  border-radius:4px;

  background:var(--cyan);
  color:#031019;

  font-size:9px;
  font-weight:bold;

  cursor:pointer;
}

.action.green{
  background:var(--green);
}

.action:disabled{
  opacity:.5;
  cursor:wait;
}

/* RESULT */

.result{
  min-height:115px;

  padding:8px;

  border:1px solid var(--line);
  border-radius:4px;

  background:#091322;

  font-size:9px;
}

.empty{
  color:#536983;
}

.error{
  color:var(--red);
}

.row{
  display:grid;
  grid-template-columns:88px 1fr;

  gap:6px;

  padding:4px 0;

  border-bottom:1px solid #ffffff08;
}

.key{
  color:#617895;
}

.value{
  overflow-wrap:anywhere;
}

/* TERMINAL */

.terminal{
  min-height:100px;
  max-height:155px;

  overflow:auto;

  padding:8px;

  border:1px solid var(--line);
  border-radius:4px;

  background:#060c15;

  color:#70859f;

  font-size:8px;
  line-height:1.55;
}

.ok{
  color:var(--green);
}

.info{
  color:var(--cyan);
}

.err{
  color:var(--red);
}

/* MAP */

.map{
  position:relative;

  min-width:0;
  min-height:0;

  border:1px solid var(--line);
  border-radius:6px;

  overflow:hidden;
}

#map{
  width:100%;
  height:100%;
}

/* MAP STATUS */

.map-status{
  position:absolute;

  z-index:999;

  left:8px;
  bottom:8px;

  padding:5px 8px;

  background:#050a14dd;

  border:1px solid #1b3653;
  border-radius:4px;

  color:#71869f;

  font-size:8px;

  pointer-events:none;
}

/* FOOTER */

footer{
  border:1px solid var(--line);
  border-radius:4px;

  background:var(--panel);

  display:flex;
  align-items:center;

  gap:14px;

  padding:4px 8px;

  color:#536983;

  font-size:7px;

  white-space:nowrap;
  overflow:hidden;
}

footer b{
  color:var(--cyan);
}

/* LEAFLET */

.leaflet-control-zoom a{
  background:#0b1321!important;
  color:#dce8f5!important;
  border-color:#213653!important;
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip{
  background:#0b1524;
  color:#dce8f5;
}

/* CYBER DARK MAP
   Uses the reliable Esri street layer with a
   visual dark filter instead of an unreliable tile server.
*/

.cyber-dark-tiles{
  filter:
    brightness(.55)
    contrast(1.15)
    saturate(.55)
    hue-rotate(8deg);
}


/* MOBILE */

@media(max-width:750px){

  main{
    grid-template-columns:245px 1fr;
  }

  .logo{
    font-size:11px;
  }

  .header-btn{
    padding:6px 7px;
  }
}

@media(max-width:600px){

  html,body{
    overflow:auto;
  }

  .app{
    height:auto;
    min-height:100vh;

    grid-template-rows:46px auto 23px;
  }

  main{
    grid-template-columns:1fr;
    grid-template-rows:auto 56vh;
  }

  .map{
    min-height:400px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<header>

  <div class="logo">
    <div class="logo-dot"></div>

    ArgusScope

    <span>//</span>

    INTELLIGENCE ENGINE
  </div>


  <div class="header-actions">

    <!-- VIEW MENU -->

    <div class="view-container">

      <button
        class="header-btn"
        id="viewButton"
      >
        ◈ VIEWS ▾
      </button>

      <div
        class="view-menu"
        id="viewMenu"
      >

        <div class="view-label">
          MAP VIEW
        </div>

        <button
          class="view-option active"
          data-view="satellite"
        >
          ◈ ESRI SATELLITE
        </button>

        <button
          class="view-option"
          data-view="osm"
        >
          □ OPENSTREETMAP
        </button>

        <button
          class="view-option"
          data-view="dark"
        >
          ◉ CYBER DARK
        </button>

        <button
          class="view-option"
          id="googleMaps"
        >
          ◎ GOOGLE MAPS ↗
        </button>

      </div>

    </div>


    <!-- SEPARATE GPS BUTTON -->

    <button
      class="header-btn gps"
      id="gpsButton"
    >
      ⌖ DEVICE GPS
    </button>

  </div>

</header>


<!-- MAIN -->

<main>

<!-- SIDEBAR -->

<aside class="sidebar">


  <!-- IP -->

  <section class="section">

    <div class="title">
      // 01. STANDARD IP LOOKUP
    </div>

    <input
      id="ip"
      type="text"
      inputmode="decimal"
      autocomplete="off"
      placeholder="Enter target IP (e.g. 8.8.8.8)"
    >

    <button
      class="action"
      id="ipButton"
    >
      EXECUTE IP SEARCH
    </button>

  </section>


  <!-- BSSID -->

  <section class="section">

    <div class="title">
      // 02. WIGLE BSSID LOOKUP
    </div>

    <input
      id="bssid"
      type="text"
      autocomplete="off"
      placeholder="AA:BB:CC:DD:EE:FF"
    >

    <button
      class="action green"
      id="bssidButton"
    >
      LOCATE BSSID
    </button>

  </section>


  <!-- RESULT -->

  <section class="section">

    <div class="title">
      // 03. INTELLIGENCE
    </div>

    <div
      class="result empty"
      id="result"
    >
      Awaiting target...
    </div>

  </section>


  <!-- TELEMETRY -->

  <section class="section">

    <div class="title">
      // 04. TELEMETRY
    </div>

    <div
      class="terminal"
      id="terminal"
    ></div>

  </section>

</aside>


<!-- MAP -->

<section class="map">

  <div id="map"></div>

  <div
    class="map-status"
    id="mapStatus"
  >
    MAP // READY
  </div>

</section>

</main>


<!-- FOOTER -->

<footer>

  <b>ARGUSSCOPE</b>

  <span>
    BACKEND // RENDER
  </span>

  <span id="source">
    SOURCE // STANDBY
  </span>

  <span id="coordinates">
    COORD // —
  </span>

</footer>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =====================================================
   ARGUSSCOPE CONFIGURATION
===================================================== */

const API =
"https://argusscope-backend.onrender.com";


/* =====================================================
   MAP
===================================================== */

const map =
L.map("map").setView([20,0],2);


/* SATELLITE */

const satellite =
L.tileLayer(
"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
{
  maxZoom:19,
  attribution:"Esri"
}
).addTo(map);


/* OPENSTREETMAP */

const osm =
L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
  maxZoom:19,
  attribution:"OpenStreetMap"
}
);


/* CYBER DARK
   Same reliable Esri street map,
   visually transformed with CSS.
*/

const cyberDark =
L.tileLayer(
"https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
{
  maxZoom:19,
  attribution:"Esri",
  className:"cyber-dark-tiles"
}
);


/* TARGET */

let targetMarker = null;
let accuracyCircle = null;

let lastLatitude = null;
let lastLongitude = null;


/* =====================================================
   ELEMENTS
===================================================== */

const ip =
document.getElementById("ip");

const bssid =
document.getElementById("bssid");

const ipButton =
document.getElementById("ipButton");

const bssidButton =
document.getElementById("bssidButton");

const result =
document.getElementById("result");

const terminal =
document.getElementById("terminal");

const mapStatus =
document.getElementById("mapStatus");

const source =
document.getElementById("source");

const coordinates =
document.getElementById("coordinates");

const viewButton =
document.getElementById("viewButton");

const viewMenu =
document.getElementById("viewMenu");


/* =====================================================
   TELEMETRY
===================================================== */

function log(message,type="info"){

  const line =
  document.createElement("div");

  line.className = type;

  line.textContent =
  "["+
  new Date().toLocaleTimeString()+
  "] "+
  message;

  terminal.appendChild(line);

  terminal.scrollTop =
  terminal.scrollHeight;
}


/* =====================================================
   RESULT DISPLAY
===================================================== */

function displayResult(data){

  result.className="result";

  result.innerHTML="";

  const fields=[

    ["IP / BSSID",
     data.ip || data.bssid],

    ["NETWORK",
     data.ssid],

    ["CITY",
     data.city],

    ["COUNTRY",
     data.country],

    ["LATITUDE",
     data.latitude],

    ["LONGITUDE",
     data.longitude],

    ["CONFIDENCE",
     data.confidence],

    ["RADIUS",
     data.accuracy_radius_m != null
     ? data.accuracy_radius_m+" m"
     : null],

    ["OBSERVATIONS",
     data.observations || data.cluster_size],

    ["SOURCE",
     data.source]

  ];


  fields.forEach(
    ([key,value])=>{

      if(
        value === undefined ||
        value === null
      ) return;


      const row =
      document.createElement("div");

      row.className="row";


      const keyElement =
      document.createElement("div");

      keyElement.className="key";

      keyElement.textContent=key;


      const valueElement =
      document.createElement("div");

      valueElement.className="value";

      valueElement.textContent=value;


      row.appendChild(keyElement);

      row.appendChild(valueElement);

      result.appendChild(row);

    }
  );
}


/* =====================================================
   PLOT TARGET
===================================================== */

function plotTarget(data){

  const lat =
  Number(data.latitude);

  const lon =
  Number(data.longitude);


  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lon)
  ){

    throw new Error(
      "Invalid coordinates received."
    );
  }


  lastLatitude=lat;
  lastLongitude=lon;


  /* REMOVE OLD */

  if(targetMarker)
    map.removeLayer(targetMarker);

  if(accuracyCircle)
    map.removeLayer(accuracyCircle);


  /* MARKER */

  targetMarker =
  L.marker([lat,lon])
  .addTo(map);


  targetMarker.bindPopup(
    `<b>ARGUSSCOPE TARGET</b><br>
     ${lat.toFixed(5)},
     ${lon.toFixed(5)}`
  ).openPopup();


  /* ACCURACY */

  const radius =
  Number(data.accuracy_radius_m);


  if(
    Number.isFinite(radius) &&
    radius > 0
  ){

    accuracyCircle =
    L.circle(
      [lat,lon],
      {
        radius:
          Math.min(radius,100000),

        color:"#27baf2",

        fillColor:"#27baf2",

        fillOpacity:.08,

        weight:1
      }
    ).addTo(map);
  }


  /* ZOOM */

  let zoom=8;

  if(radius>50000)
    zoom=5;

  else if(radius>10000)
    zoom=7;

  else if(radius>1000)
    zoom=10;

  else
    zoom=13;


  map.setView(
    [lat,lon],
    zoom
  );


  mapStatus.textContent =
  `MAP // ${lat.toFixed(5)}, ${lon.toFixed(5)}`;


  coordinates.textContent =
  `COORD // ${lat.toFixed(5)}, ${lon.toFixed(5)}`;


  source.textContent =
  `SOURCE // ${data.source || "UNKNOWN"}`;
}


/* =====================================================
   IP LOOKUP
===================================================== */

async function locateIP(){

  const target =
  ip.value.trim();


  if(!target){

    result.className=
    "result error";

    result.textContent=
    "Enter an IP address.";

    return;
  }


  ipButton.disabled=true;

  ipButton.textContent=
  "QUERYING...";


  log(
    `IP lookup requested: ${target}`
  );


  try{

    const response =
    await fetch(
      API+
      "/api/v1/locate-ip?ip="+
      encodeURIComponent(target)
    );


    if(!response.ok){

      throw new Error(
        "Backend HTTP "+
        response.status
      );
    }


    const data =
    await response.json();


    if(data.error)
      throw new Error(data.error);


    displayResult(data);

    plotTarget(data);


    log(
      `IP resolved: ${data.ip || target}`,
      "ok"
    );


    log(
      `Coordinates: ${data.latitude}, ${data.longitude}`,
      "info"
    );


  }catch(error){

    result.className=
    "result error";

    result.textContent=
    error.message;

    log(
      error.message,
      "err"
    );

  }finally{

    ipButton.disabled=false;

    ipButton.textContent=
    "EXECUTE IP SEARCH";
  }
}


/* =====================================================
   BSSID LOOKUP
===================================================== */

async function locateBSSID(){

  const target =
  bssid.value.trim();


  if(!target){

    result.className=
    "result error";

    result.textContent=
    "Enter a BSSID.";

    return;
  }


  bssidButton.disabled=true;

  bssidButton.textContent=
  "QUERYING...";


  log(
    `BSSID lookup requested: ${target}`
  );


  try{

    const response =
    await fetch(
      API+
      "/api/v1/locate-bssid?netid="+
      encodeURIComponent(target)
    );


    if(!response.ok){

      throw new Error(
        "Backend HTTP "+
        response.status
      );
    }


    const data =
    await response.json();


    if(data.error)
      throw new Error(data.error);


    displayResult(data);

    plotTarget(data);


    log(
      `BSSID resolved: ${data.bssid}`,
      "ok"
    );


  }catch(error){

    result.className=
    "result error";

    result.textContent=
    error.message;

    log(
      error.message,
      "err"
    );

  }finally{

    bssidButton.disabled=false;

    bssidButton.textContent=
    "LOCATE BSSID";
  }
}


/* =====================================================
   DEVICE GPS
===================================================== */

document
.getElementById("gpsButton")
.addEventListener(
"click",
()=>{

  if(!navigator.geolocation){

    log(
      "Device geolocation unavailable.",
      "err"
    );

    return;
  }


  log(
    "Requesting device GPS..."
  );


  navigator.geolocation.getCurrentPosition(

    position=>{

      const lat =
      position.coords.latitude;

      const lon =
      position.coords.longitude;

      const accuracy =
      position.coords.accuracy;


      L.marker([lat,lon])
      .addTo(map)
      .bindPopup(
        `<b>DEVICE GPS</b><br>
         ${lat.toFixed(5)},
         ${lon.toFixed(5)}<br>
         Accuracy: ${Math.round(accuracy)} m`
      )
      .openPopup();


      map.setView(
        [lat,lon],
        15
      );


      log(
        `Device GPS: ${lat.toFixed(5)}, ${lon.toFixed(5)}`,
        "ok"
      );

    },

    error=>{

      log(
        "GPS error: "+
        error.message,
        "err"
      );

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:30000
    }

  );

});


/* =====================================================
   VIEW MENU
===================================================== */

viewButton.addEventListener(
"click",
event=>{

  event.stopPropagation();

  viewMenu.classList.toggle("open");

});


document.addEventListener(
"click",
event=>{

  if(
    !viewMenu.contains(event.target) &&
    event.target !== viewButton
  ){

    viewMenu.classList.remove(
      "open"
    );
  }

});


/* =====================================================
   CHANGE MAP VIEW
===================================================== */

document
.querySelectorAll(".view-option[data-view]")
.forEach(button=>{

  button.addEventListener(
    "click",
    ()=>{

      const view =
      button.dataset.view;


      /* REMOVE CURRENT */

      if(map.hasLayer(satellite))
        map.removeLayer(satellite);

      if(map.hasLayer(osm))
        map.removeLayer(osm);

      if(map.hasLayer(cyberDark))
        map.removeLayer(cyberDark);


      /* ADD NEW */

      if(view==="satellite"){

        map.addLayer(satellite);

        mapStatus.textContent=
        "MAP // ESRI SATELLITE";
      }


      if(view==="osm"){

        map.addLayer(osm);

        mapStatus.textContent=
        "MAP // OPENSTREETMAP";
      }


      if(view==="dark"){

        map.addLayer(cyberDark);

        mapStatus.textContent=
        "MAP // CYBER DARK";
      }


      /* ACTIVE */

      document
      .querySelectorAll(
        ".view-option"
      )
      .forEach(
        b=>b.classList.remove("active")
      );


      button.classList.add("active");


      viewMenu.classList.remove(
        "open"
      );


      log(
        "Map view: "+
        button.textContent.trim()
      );

    }
  );

});


/* =====================================================
   GOOGLE MAPS
===================================================== */

document
.getElementById("googleMaps")
.addEventListener(
"click",
()=>{

  if(
    lastLatitude === null ||
    lastLongitude === null
  ){

    log(
      "No target coordinates available for Google Maps.",
      "err"
    );

    return;
  }


  const url =
  "https://www.google.com/maps/search/?api=1"+
  "&query="+
  encodeURIComponent(
    lastLatitude+
    ","+
    lastLongitude
  );


  window.open(
    url,
    "_blank"
  );


  log(
    "Opening target in Google Maps...",
    "ok"
  );


  viewMenu.classList.remove(
    "open"
  );

});


/* =====================================================
   INPUTS
===================================================== */

ipButton.onclick =
locateIP;

bssidButton.onclick =
locateBSSID;


ip.addEventListener(
"keydown",
event=>{

  if(event.key==="Enter")
    locateIP();

});


bssid.addEventListener(
"keydown",
event=>{

  if(event.key==="Enter")
    locateBSSID();

});


/* =====================================================
   STARTUP
===================================================== */

log(
"ArgusScope frontend initialized.",
"ok"
);

log(
"Backend: Render",
"info"
);

log(
"Awaiting target..."
);

</script>

</body>
</html>
