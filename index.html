<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ArgusScope</title>

<!-- =====================================================
     LEAFLET
===================================================== -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<!-- =====================================================
     MAPLIBRE
===================================================== -->
<link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>

<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>

<style>

/* =====================================================
   ROOT
===================================================== */

:root {
    --bg: #050b13;
    --panel: #07111d;
    --panel2: #091522;

    --border: #16314a;

    --text: #b9c8d8;
    --muted: #60788e;

    --cyan: #20b8e8;
    --green: #12c997;
    --red: #e05b6f;

    --shadow:
        0 8px 30px rgba(0,0,0,.30);

    --radius: 9px;
}


/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: var(--bg);

    color: var(--text);

    font-family:
        "JetBrains Mono",
        "Roboto Mono",
        monospace;

    overflow-x: hidden;
}

button,
input {
    font: inherit;
}


/* =====================================================
   APP
===================================================== */

.app {
    width: min(1500px, 100%);
    margin: 0 auto;

    padding: 12px;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    min-height: 58px;

    padding: 10px 14px;

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: var(--radius);

    box-shadow: var(--shadow);

    margin-bottom: 10px;
}

.brand {
    display: flex;
    align-items: center;

    gap: 10px;

    white-space: nowrap;
}

.brand-dot {
    width: 11px;
    height: 11px;

    background: var(--cyan);

    border-radius: 2px;

    box-shadow:
        0 0 12px rgba(32,184,232,.5);
}

.brand-name {
    font-size: 14px;
    letter-spacing: .08em;
    color: #d3deea;
}

.brand-slash {
    color: #21769b;
}

.brand-sub {
    color: #1587b2;
}


/* =====================================================
   HEADER BUTTONS
===================================================== */

.header-actions {
    display: flex;
    gap: 7px;
}

.top-btn {
    height: 36px;

    padding: 0 12px;

    border: 1px solid var(--border);

    border-radius: 7px;

    background: #081321;

    color: #7590a5;

    cursor: pointer;

    font-size: 10px;

    transition:
        background .15s,
        border-color .15s,
        color .15s;
}

.top-btn:hover,
.top-btn.active {
    background: #0c1d2d;
    border-color: #1c6c8d;
    color: var(--cyan);
}


/* =====================================================
   MAIN GRID
===================================================== */

.main {
    display: grid;

    grid-template-columns:
        360px
        minmax(0, 1fr);

    gap: 10px;

    min-height: 650px;
}


/* =====================================================
   LEFT PANEL
===================================================== */

.sidebar {
    display: flex;
    flex-direction: column;

    gap: 10px;

    min-width: 0;
}

.panel {
    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: var(--radius);

    padding: 12px;

    box-shadow: var(--shadow);
}

.section-title {
    margin-bottom: 9px;

    color: #16779e;

    font-size: 10px;

    letter-spacing: .12em;

    text-transform: uppercase;
}


/* =====================================================
   INPUTS
===================================================== */

.input {
    width: 100%;

    height: 43px;

    padding: 0 12px;

    border: 1px solid var(--border);

    border-radius: 7px;

    outline: none;

    background: #06101c;

    color: #a9bacb;

    font-size: 11px;

    margin-bottom: 8px;
}

.input:focus {
    border-color: #1b6c8c;

    box-shadow:
        0 0 0 2px rgba(32,184,232,.08);
}

.input::placeholder {
    color: #42576a;
}


/* =====================================================
   ACTION BUTTONS
===================================================== */

.action {
    width: 100%;

    height: 43px;

    border: 1px solid transparent;

    border-radius: 7px;

    cursor: pointer;

    font-size: 10px;

    letter-spacing: .05em;

    font-weight: 600;

    transition:
        transform .1s,
        filter .15s;
}

.action:active {
    transform: scale(.985);
}

.action:hover {
    filter: brightness(1.08);
}

.ip-button {
    background: var(--cyan);
    color: #03101a;
}

.bssid-button {
    background: var(--green);
    color: #03150f;
}


/* =====================================================
   INTELLIGENCE
===================================================== */

.intelligence {
    min-height: 220px;

    background: #030a12;

    border: 1px solid var(--border);

    border-radius: 7px;

    padding: 9px;

    overflow-y: auto;

    scrollbar-width: thin;
}

.result-row {
    display: grid;

    grid-template-columns:
        105px
        minmax(0, 1fr);

    gap: 8px;

    padding: 7px 3px;

    border-bottom: 1px solid rgba(31,64,88,.45);

    font-size: 10px;

    line-height: 1.4;
}

.result-row:last-child {
    border-bottom: 0;
}

.result-label {
    color: #567086;
}

.result-value {
    color: #aebdcb;

    overflow-wrap: anywhere;
}

.result-value.good {
    color: #21cfa1;
}

.result-value.bad {
    color: #e56a7a;
}

.result-value.accent {
    color: var(--cyan);
}


/* =====================================================
   TELEMETRY
===================================================== */

.telemetry {
    min-height: 110px;

    background: #02080e;

    border: 1px solid var(--border);

    border-radius: 7px;

    padding: 10px;

    color: #378c70;

    font-size: 9px;

    line-height: 1.65;

    overflow-y: auto;

    white-space: pre-wrap;
}


/* =====================================================
   MAP
===================================================== */

.map-panel {
    min-width: 0;

    min-height: 650px;

    position: relative;

    background: #02070d;

    border: 1px solid var(--border);

    border-radius: var(--radius);

    overflow: hidden;

    box-shadow: var(--shadow);
}

#map {
    width: 100%;
    height: 100%;

    min-height: 650px;
}


/* =====================================================
   MAP STATUS
===================================================== */

.map-status {
    position: absolute;

    left: 12px;
    bottom: 12px;

    z-index: 1000;

    padding: 8px 11px;

    border-radius: 6px;

    background: rgba(3,12,20,.88);

    border: 1px solid #17405a;

    color: #208db7;

    font-size: 9px;

    pointer-events: none;
}


/* =====================================================
   MAP SELECTOR
===================================================== */

.map-menu {
    position: absolute;

    top: 58px;
    right: 12px;

    z-index: 2000;

    width: 210px;

    background: rgba(5,13,22,.97);

    border: 1px solid #1a415b;

    border-radius: 8px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.55);

    padding: 7px;

    display: none;
}

.map-menu.open {
    display: block;
}

.map-menu-title {
    padding: 8px;

    color: #258eb9;

    font-size: 9px;

    letter-spacing: .1em;

    border-bottom: 1px solid #16334a;

    margin-bottom: 5px;
}

.map-option {
    width: 100%;

    border: 0;

    background: transparent;

    color: #8299ab;

    text-align: left;

    padding: 10px;

    border-radius: 5px;

    cursor: pointer;

    font-size: 10px;
}

.map-option:hover,
.map-option.selected {
    background: #0b1e2e;

    color: var(--cyan);
}

.map-option small {
    display: block;

    margin-top: 3px;

    color: #4b6478;

    font-size: 8px;
}


/* =====================================================
   MODAL
===================================================== */

.modal-backdrop {
    position: fixed;

    inset: 0;

    z-index: 5000;

    background: rgba(0,0,0,.62);

    display: none;

    align-items: center;
    justify-content: center;

    padding: 15px;
}

.modal-backdrop.open {
    display: flex;
}

.modal {
    width: min(420px, 100%);

    background: #06101b;

    border: 1px solid #1c5672;

    border-radius: 10px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.7);

    padding: 18px;
}

.modal-title {
    color: var(--cyan);

    font-size: 12px;

    letter-spacing: .08em;

    margin-bottom: 12px;
}

.modal-text {
    color: #73899b;

    font-size: 10px;

    line-height: 1.7;

    margin-bottom: 14px;
}

.modal-btn {
    width: 100%;

    height: 40px;

    border: 1px solid #173a51;

    border-radius: 6px;

    background: #091725;

    color: #8097a9;

    cursor: pointer;

    font-size: 10px;
}

.modal-btn:hover {
    color: var(--cyan);
    border-color: #1c6687;
}


/* =====================================================
   FOOTER
===================================================== */

.footer {
    margin-top: 10px;

    min-height: 34px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 8px 12px;

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 7px;

    color: #456075;

    font-size: 8px;

    letter-spacing: .04em;
}

.footer-accent {
    color: #1682a8;
}


/* =====================================================
   LEAFLET OVERRIDES
===================================================== */

.leaflet-control-zoom {
    border: 1px solid #19374d !important;
}

.leaflet-control-zoom a {
    background: #071421 !important;

    color: #8ca1b1 !important;

    border-bottom-color: #19374d !important;
}

.leaflet-control-zoom a:hover {
    color: var(--cyan) !important;
}

.leaflet-control-attribution {
    background: rgba(2,8,14,.78) !important;

    color: #617487 !important;

    font-size: 8px !important;
}

.leaflet-control-attribution a {
    color: #72899b !important;
}


/* =====================================================
   MARKER
===================================================== */

.argus-marker {
    width: 18px;
    height: 18px;

    border-radius: 50%;

    background: #20b8e8;

    border: 3px solid white;

    box-shadow:
        0 0 0 5px rgba(32,184,232,.20),
        0 0 20px rgba(32,184,232,.7);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 850px) {

    .app {
        padding: 7px;
    }

    .header {
        min-height: 50px;

        padding: 8px 10px;
    }

    .brand-name {
        font-size: 12px;
    }

    .brand-sub,
    .brand-slash {
        display: none;
    }

    .top-btn {
        height: 32px;

        padding: 0 9px;

        font-size: 9px;
    }

    .main {
        grid-template-columns: 1fr;

        min-height: auto;
    }

    .sidebar {
        order: 2;
    }

    .map-panel {
        order: 1;

        height: 52vh;

        min-height: 390px;
    }

    #map {
        min-height: 390px;

        height: 100%;
    }

    .panel {
        padding: 10px;
    }

    .intelligence {
        min-height: 170px;
    }

    .telemetry {
        min-height: 90px;
    }

    .footer {
        display: none;
    }

    .map-menu {
        top: 50px;
        right: 8px;

        width: 190px;
    }
}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media (max-width: 420px) {

    .app {
        padding: 5px;
    }

    .brand-name {
        font-size: 11px;
    }

    .header-actions {
        gap: 4px;
    }

    .top-btn {
        padding: 0 7px;
    }

    .map-panel {
        height: 48vh;

        min-height: 340px;
    }

    #map {
        min-height: 340px;
    }

    .result-row {
        grid-template-columns:
            90px
            minmax(0,1fr);

        font-size: 9px;
    }
}

</style>
</head>


<body>

<div class="app">

    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="header">

        <div class="brand">

            <span class="brand-dot"></span>

            <span class="brand-name">
                ARGUSSCOPE
            </span>

            <span class="brand-slash">
                //
            </span>

            <span class="brand-sub">
                INTELLIGENCE ENGINE
            </span>

        </div>


        <div class="header-actions">

            <button
                id="mapsButton"
                class="top-btn"
                type="button"
            >
                ◈ MAPS
            </button>

            <button
                id="gpsButton"
                class="top-btn"
                type="button"
            >
                ✦ GPS
            </button>

        </div>

    </header>


    <!-- =================================================
         MAIN
    ================================================== -->

    <main class="main">


        <!-- =============================================
             SIDEBAR
        ============================================== -->

        <aside class="sidebar">


            <!-- IP -->

            <section class="panel">

                <div class="section-title">
                    // 01. IP LOOKUP
                </div>

                <input
                    id="ipInput"
                    class="input"
                    type="text"
                    value="8.8.8.8"
                    placeholder="8.8.8.8"
                    autocomplete="off"
                    spellcheck="false"
                >

                <button
                    id="ipButton"
                    class="action ip-button"
                    type="button"
                >
                    EXECUTE IP SEARCH
                </button>

            </section>


            <!-- BSSID -->

            <section class="panel">

                <div class="section-title">
                    // 02. BSSID LOOKUP
                </div>

                <input
                    id="bssidInput"
                    class="input"
                    type="text"
                    placeholder="AA:BB:CC:DD:EE:FF"
                    autocomplete="off"
                    spellcheck="false"
                >

                <button
                    id="bssidButton"
                    class="action bssid-button"
                    type="button"
                >
                    LOCATE BSSID
                </button>

            </section>


            <!-- INTELLIGENCE -->

            <section class="panel">

                <div class="section-title">
                    // 03. INTELLIGENCE
                </div>

                <div
                    id="intelligence"
                    class="intelligence"
                >

                    <div class="result-row">

                        <span class="result-label">
                            SYSTEM
                        </span>

                        <span class="result-value good">
                            ArgusScope frontend initialized.
                        </span>

                    </div>

                    <div class="result-row">

                        <span class="result-label">
                            BACKEND
                        </span>

                        <span
                            id="backendStatus"
                            class="result-value"
                        >
                            Connecting...
                        </span>

                    </div>

                    <div class="result-row">

                        <span class="result-label">
                            TARGET
                        </span>

                        <span class="result-value">
                            Awaiting target...
                        </span>

                    </div>

                </div>

            </section>


            <!-- TELEMETRY -->

            <section class="panel">

                <div class="section-title">
                    // 04. TELEMETRY
                </div>

                <div
                    id="telemetry"
                    class="telemetry"
                ></div>

            </section>

        </aside>


        <!-- =============================================
             MAP
        ============================================== -->

        <section class="map-panel">

            <div id="map"></div>

            <div
                id="mapStatus"
                class="map-status"
            >
                MAP // READY
            </div>


            <!-- MAP SELECTOR -->

            <div
                id="mapMenu"
                class="map-menu"
            >

                <div class="map-menu-title">
                    MAP SOURCES
                </div>


                <button
                    class="map-option selected"
                    data-map="street"
                    type="button"
                >
                    STREET
                    <small>
                        Detailed OpenFreeMap streets
                    </small>
                </button>


                <button
                    class="map-option"
                    data-map="cyberdark"
                    type="button"
                >
                    CYBERDARK
                    <small>
                        OpenFreeMap dark • no API key
                    </small>
                </button>


                <button
                    class="map-option"
                    data-map="light"
                    type="button"
                >
                    LIGHT
                    <small>
                        OpenFreeMap bright
                    </small>
                </button>


                <button
                    class="map-option"
                    data-map="satellite"
                    type="button"
                >
                    SATELLITE
                    <small>
                        Esri World Imagery
                    </small>
                >


                <button
                    class="map-option"
                    data-map="google"
                    type="button"
                >
                    GOOGLE MAPS
                    <small>
                        Open Google Maps
                    </small>
                </button>

            </div>

        </section>

    </main>


    <!-- =================================================
         FOOTER
    ================================================== -->

    <footer class="footer">

        <span class="footer-accent">
            ARGUSSCOPE
        </span>

        <span>
            BACKEND // API
        </span>

        <span id="coordinates">
            COORD // --
        </span>

    </footer>

</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div
    id="modalBackdrop"
    class="modal-backdrop"
>

    <div class="modal">

        <div
            id="modalTitle"
            class="modal-title"
        >
            GOOGLE MAPS
        </div>

        <div
            id="modalText"
            class="modal-text"
        ></div>

        <button
            id="modalClose"
            class="modal-btn"
            type="button"
        >
            CLOSE
        </button>

    </div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_BASE =
    "https://argusscope-backend.onrender.com";


/* =====================================================
   OPENFREEMAP STYLES
===================================================== */

const MAP_STYLES = {

    street:
        "https://tiles.openfreemap.org/styles/liberty",

    cyberdark:
        "https://tiles.openfreemap.org/styles/dark",

    light:
        "https://tiles.openfreemap.org/styles/bright"

};


/* =====================================================
   DOM
===================================================== */

const ipInput =
    document.getElementById("ipInput");

const bssidInput =
    document.getElementById("bssidInput");

const ipButton =
    document.getElementById("ipButton");

const bssidButton =
    document.getElementById("bssidButton");

const intelligence =
    document.getElementById("intelligence");

const telemetry =
    document.getElementById("telemetry");

const backendStatus =
    document.getElementById("backendStatus");

const coordinates =
    document.getElementById("coordinates");

const mapStatus =
    document.getElementById("mapStatus");

const mapsButton =
    document.getElementById("mapsButton");

const gpsButton =
    document.getElementById("gpsButton");

const mapMenu =
    document.getElementById("mapMenu");

const modalBackdrop =
    document.getElementById("modalBackdrop");

const modalTitle =
    document.getElementById("modalTitle");

const modalText =
    document.getElementById("modalText");

const modalClose =
    document.getElementById("modalClose");


/* =====================================================
   TELEMETRY
===================================================== */

function log(message) {

    const now =
        new Date()
            .toLocaleTimeString([], {
                hour12: false
            });

    telemetry.textContent +=
        `[${now}] ${message}\n`;

    telemetry.scrollTop =
        telemetry.scrollHeight;
}


/* =====================================================
   RESULT PANEL
===================================================== */

function clearResults() {

    intelligence.innerHTML = "";

}


function addResult(
    label,
    value,
    className = ""
) {

    const row =
        document.createElement("div");

    row.className =
        "result-row";


    const labelElement =
        document.createElement("span");

    labelElement.className =
        "result-label";

    labelElement.textContent =
        label;


    const valueElement =
        document.createElement("span");

    valueElement.className =
        "result-value " + className;

    /*
     * IMPORTANT:
     * textContent is deliberately used here.
     *
     * This prevents API strings containing
     * HTML from being interpreted as markup.
     */

    valueElement.textContent =
        value === null ||
        value === undefined ||
        value === ""
            ? "N/A"
            : String(value);


    row.appendChild(labelElement);

    row.appendChild(valueElement);

    intelligence.appendChild(row);
}


/* =====================================================
   MAP INITIALIZATION
===================================================== */

let currentMapType =
    "street";

let marker =
    null;

let mapLayer =
    null;


/*
 * Default center.
 *
 * This is only a visual starting point.
 * It is NOT treated as the user's location.
 */

const DEFAULT_CENTER =
    [20, 0];

const DEFAULT_ZOOM =
    2;


const map =
    L.map("map", {

        minZoom: 1,

        maxBounds:
            [
                [-85, -180],
                [85, 180]
            ],

        maxBoundsViscosity: 1,

        zoomControl: true

    }).setView(
        DEFAULT_CENTER,
        DEFAULT_ZOOM
    );


/* =====================================================
   MAP LAYER
===================================================== */

function removeCurrentMapLayer() {

    if (mapLayer) {

        map.removeLayer(
            mapLayer
        );

        mapLayer = null;
    }

}


/* =====================================================
   SATELLITE STYLE
===================================================== */

function createSatelliteStyle() {

    return {

        version: 8,

        sources: {

            esri: {

                type: "raster",

                tiles: [

                    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"

                ],

                tileSize: 256,

                attribution:
                    "Tiles © Esri"

            }

        },

        layers: [

            {

                id: "esri-satellite",

                type: "raster",

                source: "esri",

                minzoom: 0,

                maxzoom: 19

            }

        ]

    };

}


/* =====================================================
   LOAD MAP
===================================================== */

function loadMap(type) {

    removeCurrentMapLayer();


    if (type === "satellite") {

        mapLayer =
            L.maplibreGL({

                style:
                    createSatelliteStyle()

            }).addTo(map);

    }

    else {

        mapLayer =
            L.maplibreGL({

                style:
                    MAP_STYLES[type]

            }).addTo(map);

    }


    currentMapType =
        type;


    document
        .querySelectorAll(".map-option")
        .forEach(button => {

            button.classList.toggle(
                "selected",
                button.dataset.map === type
            );

        });


    const names = {

        street:
            "MAP // STREET",

        cyberdark:
            "MAP // CYBERDARK",

        light:
            "MAP // LIGHT",

        satellite:
            "MAP // SATELLITE"

    };


    mapStatus.textContent =
        names[type] || "MAP // READY";


    setTimeout(() => {

        map.invalidateSize();

    }, 250);

}


/* =====================================================
   INITIAL MAP
===================================================== */

loadMap("street");


/* =====================================================
   MARKER
===================================================== */

function createMarkerIcon() {

    return L.divIcon({

        className: "",

        html:
            '<div class="argus-marker"></div>',

        iconSize:
            [18, 18],

        iconAnchor:
            [9, 9]

    });

}


/* =====================================================
   SET LOCATION
===================================================== */

function setLocation(
    latitude,
    longitude,
    label = "Target"
) {

    const lat =
        Number(latitude);

    const lon =
        Number(longitude);


    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
    ) {

        return false;

    }


    if (marker) {

        map.removeLayer(
            marker
        );

    }


    marker =
        L.marker(
            [lat, lon],
            {
                icon:
                    createMarkerIcon()
            }
        )
        .addTo(map);


    marker.bindPopup(
        `<b>${label}</b><br>` +
        `${lat.toFixed(6)}, ` +
        `${lon.toFixed(6)}`
    );


    map.setView(
        [lat, lon],
        14,
        {
            animate: true
        }
    );


    coordinates.textContent =
        `COORD // ${lat.toFixed(5)}, ${lon.toFixed(5)}`;


    mapStatus.textContent =
        "MAP // TARGET LOCATED";


    return true;
}


/* =====================================================
   IP LOOKUP
===================================================== */

async function lookupIP() {

    const ip =
        ipInput.value.trim();


    if (!ip) {

        clearResults();

        addResult(
            "ERROR",
            "Please enter an IP address.",
            "bad"
        );

        return;
    }


    ipButton.disabled =
        true;

    ipButton.textContent =
        "QUERYING...";


    clearResults();


    addResult(
        "STATUS",
        "Querying geolocation providers...",
        "accent"
    );


    log(
        `IP lookup requested: ${ip}`
    );


    try {

        const response =
            await fetch(
                `${API_BASE}/api/v1/locate-ip?ip=${encodeURIComponent(ip)}`,
                {
                    method: "GET",

                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        let data = null;


        try {

            data =
                await response.json();

        }

        catch {

            throw new Error(
                `Backend returned HTTP ${response.status} with invalid JSON.`
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                `HTTP ${response.status}`
            );

        }


        if (!data.success) {

            addResult(
                "IP LOOKUP",
                "FAILED",
                "bad"
            );

            addResult(
                "MESSAGE",
                data.error ||
                "No IP geolocation provider could resolve this address.",
                "bad"
            );


            if (Array.isArray(data.details)) {

                data.details.forEach(
                    (detail, index) => {

                        addResult(
                            `PROVIDER ${index + 1}`,
                            detail,
                            "bad"
                        );

                    }
                );

            }


            log(
                `IP lookup failed: ${
                    data.error || "Unknown error"
                }`
            );


            return;
        }


        /* =============================================
           SUCCESS
        ============================================== */

        addResult(
            "IP",
            data.ip,
            "accent"
        );

        addResult(
            "Hostname",
            data.hostname
        );

        addResult(
            "Country",
            data.country
        );

        addResult(
            "Country Code",
            data.country_code
        );

        addResult(
            "City",
            data.city
        );

        addResult(
            "Region",
            data.region
        );

        addResult(
            "Postal",
            data.postal
        );

        addResult(
            "Latitude",
            data.latitude
        );

        addResult(
            "Longitude",
            data.longitude
        );

        addResult(
            "ISP",
            data.isp
        );

        addResult(
            "Organization",
            data.org ||
            data.organization
        );

        addResult(
            "ASN",
            data.asn
        );

        addResult(
            "Datacenter",
            data.is_datacenter === true
                ? "YES"
                : data.is_datacenter === false
                    ? "NO"
                    : "N/A"
        );

        addResult(
            "VPN",
            data.is_vpn === true
                ? "YES"
                : data.is_vpn === false
                    ? "NO"
                    : "N/A"
        );

        addResult(
            "Proxy",
            data.is_proxy === true
                ? "YES"
                : data.is_proxy === false
                    ? "NO"
                    : "N/A"
        );

        addResult(
            "Tor",
            data.is_tor === true
                ? "YES"
                : data.is_tor === false
                    ? "NO"
                    : "N/A"
        );

        addResult(
            "Confidence",
            data.confidence
        );

        addResult(
            "Source",
            data.source,
            "accent"
        );


        if (
            data.latitude !== null &&
            data.longitude !== null &&
            data.latitude !== undefined &&
            data.longitude !== undefined
        ) {

            setLocation(
                data.latitude,
                data.longitude,
                `IP: ${data.ip || ip}`
            );

        }


        log(
            `IP lookup successful: ${data.ip || ip}`
        );


    }

    catch (error) {

        clearResults();

        addResult(
            "IP LOOKUP",
            "FAILED",
            "bad"
        );

        addResult(
            "ERROR",
            error.message ||
            "Network request failed.",
            "bad"
        );


        log(
            `IP lookup error: ${error.message}`
        );

    }

    finally {

        ipButton.disabled =
            false;

        ipButton.textContent =
            "EXECUTE IP SEARCH";

    }

}

/* =====================================================
   BACKEND HEALTH
===================================================== */

async function checkBackend() {

    try {

        const response =
            await fetch(
                `${API_BASE}/health`,
                {
                    method: "GET"
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        backendStatus.textContent =
            `ONLINE • ${data.version || "API"}`;

        backendStatus.className =
            "result-value good";


        log(
            `Backend connection ready: ${API_BASE}`
        );

    }

    catch (error) {

        backendStatus.textContent =
            "UNREACHABLE";

        backendStatus.className =
            "result-value bad";


        log(
            `Backend connection failed: ${error.message}`
        );

    }

}


/* =====================================================
   GOOGLE MAPS
===================================================== */

function openGoogleMaps() {

    let lat = null;
    let lon = null;


    if (marker) {

        const position =
            marker.getLatLng();

        lat =
            position.lat;

        lon =
            position.lng;

    }


    if (
        lat === null ||
        lon === null
    ) {

        openModal(
            "GOOGLE MAPS",
            "Run an IP or BSSID lookup first so ArgusScope has coordinates to open in Google Maps."
        );

        return;
    }


    /*
     * Google Maps URL.
     *
     * On Android, Google Maps commonly
     * intercepts this URL when installed.
     *
     * Otherwise it opens Google Maps
     * in the browser.
     */

    const url =
        `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(
            `${lat},${lon}`
        )}`;


    window.location.href =
        url;

}


/* =====================================================
   GPS
===================================================== */

function useGPS() {

    if (!navigator.geolocation) {

        openModal(
            "GPS",
            "This browser does not provide the Geolocation API."
        );

        return;
    }


    mapStatus.textContent =
        "GPS // REQUESTING";


    log(
        "Device GPS requested."
    );


    navigator.geolocation.getCurrentPosition(

        position => {

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;


            setLocation(
                lat,
                lon,
                "Device GPS"
            );


            log(
                `GPS location acquired: ${
                    lat.toFixed(6)
                }, ${
                    lon.toFixed(6)
                }`
            );

        },

        error => {

            mapStatus.textContent =
                "GPS // UNAVAILABLE";


            let message =
                "Unable to obtain device location.";


            if (error.code === 1) {

                message =
                    "Location permission was denied.";

            }

            else if (error.code === 2) {

                message =
                    "Device location is unavailable.";

            }

            else if (error.code === 3) {

                message =
                    "Location request timed out.";

            }


            log(
                `GPS failed: ${message}`
            );


            openModal(
                "GPS",
                message
            );

        },

        {
            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 0
        }

    );

}


/* =====================================================
   MODAL
===================================================== */

function openModal(
    title,
    text
) {

    modalTitle.textContent =
        title;

    modalText.textContent =
        text;

    modalBackdrop.classList.add(
        "open"
    );

}


function closeModal() {

    modalBackdrop.classList.remove(
        "open"
    );

}


/* =====================================================
   MAP MENU
===================================================== */

mapsButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        mapMenu.classList.toggle(
            "open"
        );

    }
);


document
    .querySelectorAll(".map-option")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const type =
                    button.dataset.map;


                mapMenu.classList.remove(
                    "open"
                );


                if (type === "google") {

                    openGoogleMaps();

                    return;
                }


                loadMap(type);

            }
        );

    });


document.addEventListener(
    "click",
    event => {

        if (
            !mapMenu.contains(event.target) &&
            event.target !== mapsButton
        ) {

            mapMenu.classList.remove(
                "open"
            );

        }

    }
);

   BUTTON EVENTS
===================================================== */

ipButton.addEventListener(
    "click",
    lookupIP
);


bssidButton.addEventListener(
    "click",
    lookupBSSID
);


gpsButton.addEventListener(
    "click",
    useGPS
);


modalClose.addEventListener(
    "click",
    closeModal
);


modalBackdrop.addEventListener(
    "click",
    event => {

        if (
            event.target === modalBackdrop
        ) {

            closeModal();

        }

    }
);

===================================================== */

        }

);

===================================================== */

    }
);

);

checkBackend();
