<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

<title>ArgusScope</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
/* =========================================================
   ARGUSSCOPE
   FINAL RESPONSIVE FRONTEND
   ========================================================= */

:root {
    --bg: #050b14;
    --panel: #091321;
    --panel2: #0d1929;
    --border: #1a3048;
    --cyan: #20b8eb;
    --cyan2: #168bb5;
    --green: #13c995;
    --red: #d75b6c;
    --text: #d5e0eb;
    --muted: #698198;
    --mono: "JetBrains Mono", "Courier New", monospace;
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    background: var(--bg);
}

body {
    margin: 0;
    min-height: 100%;
    background:
        radial-gradient(
            circle at top,
            rgba(22, 70, 105, 0.16),
            transparent 38%
        ),
        var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    overflow-x: hidden;
}

/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.app {
    width: min(1500px, calc(100% - 24px));
    margin: 14px auto;
}

/* =========================================================
   HEADER
   ========================================================= */

.header {
    min-height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;

    padding: 10px 14px;

    background: rgba(9, 19, 33, 0.96);
    border: 1px solid var(--border);
    border-radius: 8px;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.22);
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 14px;
    letter-spacing: 0.8px;
    white-space: nowrap;
}

.brand-dot {
    width: 10px;
    height: 10px;
    background: var(--cyan);
    border-radius: 2px;

    box-shadow:
        0 0 12px rgba(32, 184, 235, 0.55);
}

.header-actions {
    display: flex;
    gap: 8px;
}

/* =========================================================
   BUTTONS
   ========================================================= */

button {
    font-family: inherit;
    border: 0;
    cursor: pointer;
}

.header-btn {
    min-height: 36px;
    padding: 0 12px;

    color: var(--text);
    background: #0d1a2b;

    border: 1px solid var(--border);
    border-radius: 6px;

    font-size: 10px;
    letter-spacing: 0.5px;
}

.header-btn:hover {
    border-color: var(--cyan);
}

.header-btn.active {
    background: var(--cyan);
    color: #03101a;
    border-color: var(--cyan);
}

/* =========================================================
   MAP MENU
   ========================================================= */

.map-wrapper {
    position: relative;
}

.map-menu {
    position: absolute;
    top: calc(100% + 7px);
    right: 0;

    width: 185px;

    padding: 6px;

    background: #081321;
    border: 1px solid var(--border);
    border-radius: 7px;

    box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.45);

    z-index: 5000;

    display: none;
}

.map-menu.open {
    display: block;
}

.map-option {
    width: 100%;

    padding: 9px 10px;

    text-align: left;

    background: transparent;
    color: var(--text);

    border-radius: 5px;

    font-family: inherit;
    font-size: 10px;
}

.map-option:hover {
    background: #10243a;
}

.map-option.active {
    color: var(--cyan);
    background: #0d2032;
}

/* =========================================================
   MAIN GRID
   ========================================================= */

.main {
    display: grid;
    grid-template-columns: 355px minmax(0, 1fr);
    gap: 10px;

    margin-top: 10px;
}

/* =========================================================
   LEFT PANEL
   ========================================================= */

.sidebar {
    min-width: 0;

    display: flex;
    flex-direction: column;
    gap: 8px;

    background: rgba(8, 18, 31, 0.96);
    border: 1px solid var(--border);
    border-radius: 8px;

    padding: 10px;
}

.section {
    border: 1px solid rgba(26, 48, 72, 0.75);
    border-radius: 6px;

    padding: 10px;

    background: rgba(7, 16, 28, 0.7);
}

.section-title {
    margin-bottom: 8px;

    color: #2389b3;

    font-size: 10px;
    letter-spacing: 0.8px;
}

input {
    width: 100%;

    height: 40px;

    padding: 0 11px;

    color: var(--text);
    background: #0c192b;

    border: 1px solid #1a3048;
    border-radius: 6px;

    outline: none;

    font-family: inherit;
    font-size: 11px;
}

input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 2px rgba(32, 184, 235, 0.08);
}

.action {
    width: 100%;

    height: 40px;

    margin-top: 7px;

    border-radius: 6px;

    font-family: inherit;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 0.4px;
}

.action-ip {
    background: var(--cyan);
    color: #03121b;
}

.action-bssid {
    background: var(--green);
    color: #031811;
}

.action:hover {
    filter: brightness(1.08);
}

/* =========================================================
   INTELLIGENCE
   ========================================================= */

.results {
    min-height: 135px;
    max-height: 300px;

    overflow-y: auto;

    padding: 8px;

    background: #040b14;

    border: 1px solid #172b40;
    border-radius: 6px;

    scrollbar-width: thin;
}

.result-row {
    display: grid;
    grid-template-columns: 105px minmax(0, 1fr);

    gap: 8px;

    padding: 6px 0;

    border-bottom: 1px solid rgba(26, 48, 72, 0.45);

    line-height: 1.4;
}

.result-row:last-child {
    border-bottom: 0;
}

.result-label {
    color: #60778d;
    word-break: break-word;
}

.result-value {
    color: #c9d7e4;
    word-break: break-word;
}

.status-success {
    color: #25dca8;
}

.status-error {
    color: var(--red);
}

.status-muted {
    color: var(--muted);
}

/* =========================================================
   TELEMETRY
   ========================================================= */

.telemetry {
    min-height: 95px;
    max-height: 170px;

    overflow-y: auto;

    padding: 8px;

    background: #030910;

    border: 1px solid #172b40;
    border-radius: 6px;

    color: #159c79;

    font-size: 10px;
    line-height: 1.65;

    white-space: pre-wrap;
}

/* =========================================================
   MAP
   ========================================================= */

.map-panel {
    min-width: 0;

    position: relative;

    height: 650px;

    border: 1px solid var(--border);
    border-radius: 8px;

    overflow: hidden;

    background: #07111d;
}

#map {
    width: 100%;
    height: 100%;
}

.map-status {
    position: absolute;

    left: 12px;
    bottom: 12px;

    z-index: 1000;

    padding: 7px 10px;

    background: rgba(5, 14, 24, 0.9);

    border: 1px solid var(--border);
    border-radius: 5px;

    color: var(--cyan);

    font-size: 9px;
    letter-spacing: 0.5px;
    pointer-events: none;
}

/* =========================================================
   LEAFLET
   ========================================================= */

.leaflet-control-zoom a {
    background: #091522 !important;
    color: #d9e6f0 !important;
    border-color: #20364c !important;
}

.leaflet-control-attribution {
    font-size: 8px !important;
}

/* =========================================================
   FOOTER
   ========================================================= */

.footer {
    margin-top: 8px;

    min-height: 32px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 7px 11px;

    background: #07111d;

    border: 1px solid var(--border);
    border-radius: 7px;

    color: #466077;

    font-size: 9px;
}

.footer strong {
    color: #1987b0;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 900px) {

    .app {
        width: calc(100% - 14px);
        margin: 7px auto;
    }

    body {
        font-size: 11px;
    }

    .main {
        grid-template-columns: 1fr;
    }

    .sidebar {
        order: 1;
    }

    .map-panel {
        order: 2;
        height: 430px;
    }

    .header {
        min-height: 52px;
        padding: 8px 10px;
    }

    .brand {
        font-size: 12px;
    }

    .header-btn {
        min-height: 34px;
        padding: 0 9px;
        font-size: 9px;
    }
}

/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 520px) {

    .app {
        width: calc(100% - 10px);
        margin: 5px auto;
    }

    .header {
        gap: 6px;
    }

    .brand {
        font-size: 10px;
        letter-spacing: 0.4px;
    }

    .brand-dot {
        width: 8px;
        height: 8px;
    }

    .header-actions {
        gap: 4px;
    }

    .header-btn {
        min-height: 32px;
        padding: 0 7px;
        font-size: 8px;
    }

    .sidebar {
        padding: 7px;
    }

    .section {
        padding: 8px;
    }

    .section-title {
        font-size: 9px;
        margin-bottom: 7px;
    }

    input {
        height: 37px;
        font-size: 10px;
    }

    .action {
        height: 37px;
        font-size: 9px;
    }

    .map-panel {
        height: 350px;
    }

    .result-row {
        grid-template-columns: 88px minmax(0, 1fr);
        font-size: 9px;
    }

    .telemetry {
        font-size: 9px;
        max-height: 140px;
    }

    .footer {
        font-size: 8px;
        overflow: hidden;
        white-space: nowrap;
    }
}

/* =========================================================
   VERY SMALL DEVICES
   ========================================================= */

@media (max-width: 360px) {

    .map-panel {
        height: 310px;
    }

    .brand {
        display: none;
    }

    .header {
        justify-content: flex-end;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header">

        <div class="brand">
            <span class="brand-dot"></span>
            <span>ARGUSSCOPE</span>
        </div>

        <div class="header-actions">

            <div class="map-wrapper">

                <button
                    id="mapsButton"
                    class="header-btn"
                    type="button"
                    aria-expanded="false"
                >
                    ◇ MAPS
                </button>

                <div
                    id="mapMenu"
                    class="map-menu"
                >

                    <button
                        class="map-option active"
                        data-map="street"
                        type="button"
                    >
                        STREET MAP
                    </button>

                    <button
                        class="map-option"
                        data-map="dark"
                        type="button"
                    >
                        CYBER DARK
                    </button>

                    <button
                        class="map-option"
                        data-map="satellite"
                        type="button"
                    >
                        SATELLITE
                    </button>

                    <button
                        class="map-option"
                        data-map="terrain"
                        type="button"
                    >
                        TERRAIN
                    </button>

                    <button
                        id="googleMapsButton"
                        class="map-option"
                        type="button"
                    >
                        GOOGLE MAPS ↗
                    </button>

                </div>

            </div>

            <button
                id="gpsButton"
                class="header-btn"
                type="button"
            >
                ✦ GPS
            </button>

        </div>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="main">

        <!-- =================================================
             SIDEBAR
             ================================================= -->

        <aside class="sidebar">

            <!-- IP -->

            <section class="section">

                <div class="section-title">
                    // 01. IP LOOKUP
                </div>

                <input
                    id="ipInput"
                    type="text"
                    inputmode="decimal"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="8.8.8.8"
                >

                <button
                    id="ipButton"
                    class="action action-ip"
                    type="button"
                >
                    EXECUTE IP SEARCH
                </button>

            </section>


            <!-- BSSID -->

            <section class="section">

                <div class="section-title">
                    // 02. BSSID LOOKUP
                </div>

                <input
                    id="bssidInput"
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="AA:BB:CC:DD:EE:FF"
                >

                <button
                    id="bssidButton"
                    class="action action-bssid"
                    type="button"
                >
                    LOCATE BSSID
                </button>

            </section>


            <!-- INTELLIGENCE -->

            <section class="section">

                <div class="section-title">
                    // 03. INTELLIGENCE
                </div>

                <div
                    id="results"
                    class="results"
                >
                    <div class="status-muted">
                        Awaiting target...
                    </div>
                </div>

            </section>


            <!-- TELEMETRY -->

            <section class="section">

                <div class="section-title">
                    // 04. TELEMETRY
                </div>

                <div
                    id="telemetry"
                    class="telemetry"
                ></div>

            </section>

        </aside>


        <!-- =================================================
             MAP
             ================================================= -->

        <section class="map-panel">

            <div id="map"></div>

            <div
                id="mapStatus"
                class="map-status"
            >
                MAP // READY
            </div>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="footer">

        <span>
            <strong>ARGUSSCOPE</strong>
            &nbsp;//&nbsp; INTELLIGENCE ENGINE
        </span>

        <span id="footerStatus">
            BACKEND // API
        </span>

        <span id="coordinates">
            COORD // --
        </span>

    </footer>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================================================
   ARGUSSCOPE FRONTEND
   FINAL VERSION
   ========================================================= */

"use strict";


/* =========================================================
   CONFIG
   ========================================================= */

const BACKEND =
    "https://argusscope-backend.onrender.com";


/* =========================================================
   DOM
   ========================================================= */

const ipInput =
    document.getElementById("ipInput");

const bssidInput =
    document.getElementById("bssidInput");

const ipButton =
    document.getElementById("ipButton");

const bssidButton =
    document.getElementById("bssidButton");

const results =
    document.getElementById("results");

const telemetry =
    document.getElementById("telemetry");

const mapsButton =
    document.getElementById("mapsButton");

const mapMenu =
    document.getElementById("mapMenu");

const gpsButton =
    document.getElementById("gpsButton");

const mapStatus =
    document.getElementById("mapStatus");

const footerStatus =
    document.getElementById("footerStatus");

const coordinates =
    document.getElementById("coordinates");

const googleMapsButton =
    document.getElementById("googleMapsButton");


/* =========================================================
   STATE
   ========================================================= */

let currentCoordinates = null;

let currentLayerName = "street";


/* =========================================================
   TELEMETRY
   ========================================================= */

function log(message) {

    const now =
        new Date().toLocaleTimeString();

    telemetry.textContent +=
        `[${now}] ${message}\n`;

    telemetry.scrollTop =
        telemetry.scrollHeight;
}


/* =========================================================
   SAFE RESULT RENDERING
   IMPORTANT:
   Uses DOM textContent.
   Never injects API values as HTML.
   ========================================================= */

function clearResults() {

    results.replaceChildren();

}


function addResultRow(label, value) {

    const row =
        document.createElement("div");

    row.className =
        "result-row";


    const labelElement =
        document.createElement("span");

    labelElement.className =
        "result-label";

    labelElement.textContent =
        label;


    const valueElement =
        document.createElement("span");

    valueElement.className =
        "result-value";

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        valueElement.textContent =
            "—";
    } else {
        valueElement.textContent =
            String(value);
    }


    row.appendChild(labelElement);
    row.appendChild(valueElement);

    results.appendChild(row);
}


function showMessage(message, type = "muted") {

    clearResults();

    const element =
        document.createElement("div");

    element.className =
        `status-${type}`;

    element.textContent =
        message;

    results.appendChild(element);
}


/* =========================================================
   MAP
   ========================================================= */

const map =
    L.map("map", {
        zoomControl: true,
        attributionControl: true
    }).setView(
        [20.5937, 78.9629],
        4
    );


/* =========================================================
   MAP LAYERS
   No API key required.
   ========================================================= */

const layers = {};


/* STREET */

layers.street =
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                '&copy; OpenStreetMap contributors'
        }
    );


/* CYBER DARK */

layers.dark =
    L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
            maxZoom: 20,
            attribution:
                '&copy; OpenStreetMap &copy; CARTO'
        }
    );


/* SATELLITE */

layers.satellite =
    L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/" +
        "World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom: 19,
            attribution:
                'Tiles &copy; Esri'
        }
    );


/* TERRAIN */

layers.terrain =
    L.tileLayer(
        "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 17,
            attribution:
                'Map data &copy; OpenStreetMap contributors, SRTM | OpenTopoMap'
        }
    );


layers.street.addTo(map);


/* =========================================================
   MAP SWITCHING
   ========================================================= */

function switchMap(name) {

    if (!layers[name]) {
        return;
    }

    Object.keys(layers).forEach(key => {

        if (map.hasLayer(layers[key])) {
            map.removeLayer(layers[key]);
        }

    });


    layers[name].addTo(map);

    currentLayerName = name;


    document
        .querySelectorAll(".map-option[data-map]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.map === name
            );

        });


    const labels = {
        street: "MAP // STREET",
        dark: "MAP // CYBER DARK",
        satellite: "MAP // SATELLITE",
        terrain: "MAP // TERRAIN"
    };


    mapStatus.textContent =
        labels[name] || "MAP // READY";


    setTimeout(() => {
        map.invalidateSize();
    }, 100);
}


/* =========================================================
   MAP MENU
   ========================================================= */

mapsButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        const open =
            mapMenu.classList.toggle("open");

        mapsButton.classList.toggle(
            "active",
            open
        );

        mapsButton.setAttribute(
            "aria-expanded",
            String(open)
        );
    }
);


document.addEventListener(
    "click",
    event => {

        if (
            !mapMenu.contains(event.target) &&
            event.target !== mapsButton
        ) {

            mapMenu.classList.remove("open");

            mapsButton.classList.remove(
                "active"
            );

            mapsButton.setAttribute(
                "aria-expanded",
                "false"
            );
        }

    }
);


document
    .querySelectorAll(".map-option[data-map]")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                switchMap(
                    button.dataset.map
                );

                mapMenu.classList.remove(
                    "open"
                );

                mapsButton.classList.remove(
                    "active"
                );

                mapsButton.setAttribute(
                    "aria-expanded",
                    "false"
                );
            }
        );

    });


/* =========================================================
   MARKER
   ========================================================= */

let marker = null;


function showCoordinates(
    latitude,
    longitude,
    zoom = 13
) {

    const lat =
        Number(latitude);

    const lon =
        Number(longitude);


    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
    ) {
        return;
    }


    currentCoordinates = {
        latitude: lat,
        longitude: lon
    };


    if (marker) {
        map.removeLayer(marker);
    }


    marker =
        L.marker([lat, lon])
        .addTo(map);


    map.setView(
        [lat, lon],
        zoom,
        {
            animate: true
        }
    );


    coordinates.textContent =
        `COORD // ${lat.toFixed(5)}, ${lon.toFixed(5)}`;


    mapStatus.textContent =
        `MAP // ${currentLayerName.toUpperCase()}`;
}


/* =========================================================
   GOOGLE MAPS
   Does not require a Google Maps API key.
   ========================================================= */

googleMapsButton.addEventListener(
    "click",
    () => {

        if (!currentCoordinates) {

            showMessage(
                "No coordinates available yet.",
                "muted"
            );

            return;
        }


        const {
            latitude,
            longitude
        } = currentCoordinates;


        const url =
            `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(
                latitude + "," + longitude
            )}`;


        window.open(
            url,
            "_blank",
            "noopener,noreferrer"
        );

    }
);


/* =========================================================
   IP LOOKUP
   ========================================================= */

async function lookupIP() {

    const ip =
        ipInput.value.trim();


    if (!ip) {

        showMessage(
            "Enter an IP address.",
            "error"
        );

        return;
    }


    showMessage(
        "Querying IP geolocation service...",
        "muted"
    );


    log(
        `IP lookup requested: ${ip}`
    );


    ipButton.disabled = true;

    ipButton.textContent =
        "QUERYING...";


    try {

        const response =
            await fetch(
                `${BACKEND}/api/v1/locate-ip?ip=${encodeURIComponent(ip)}`,
                {
                    method: "GET",
                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        let data;


        try {

            data =
                await response.json();

        } catch {

            throw new Error(
                "Backend returned invalid JSON."
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                `Backend HTTP ${response.status}`
            );

        }


        if (!data.success) {

            clearResults();

            addResultRow(
                "STATUS",
                "LOOKUP FAILED"
            );

            addResultRow(
                "ERROR",
                data.error ||
                "No geolocation provider could resolve this address."
            );


            if (
                Array.isArray(data.details)
            ) {

                data.details.forEach(
                    (detail, index) => {

                        addResultRow(
                            `PROVIDER ${index + 1}`,
                            detail
                        );

                    }
                );

            }


            log(
                `IP lookup failed: ${
                    data.error || "unknown error"
                }`
            );

            return;
        }


        renderIPResult(data);


        if (
            data.latitude !== null &&
            data.longitude !== null &&
            data.latitude !== undefined &&
            data.longitude !== undefined
        ) {

            showCoordinates(
                data.latitude,
                data.longitude,
                13
            );

            log(
                `IP coordinates resolved: ${
                    data.latitude
                }, ${
                    data.longitude
                }`
            );

        }


        log(
            `IP lookup successful: ${ip}`
        );


    } catch (error) {

        showMessage(
            `IP LOOKUP FAILED — ${error.message}`,
            "error"
        );


        log(
            `IP request error: ${error.message}`
        );

    } finally {

        ipButton.disabled = false;

        ipButton.textContent =
            "EXECUTE IP SEARCH";
    }
}


/* =========================================================
   IP RESULT
   ========================================================= */

function renderIPResult(data) {

    clearResults();


    const fields = [

        ["STATUS", "SUCCESS"],

        ["IP", data.ip],

        ["Hostname", data.hostname],

        ["Country", data.country],

        ["Country Code", data.country_code],

        ["Region", data.region],

        ["City", data.city],

        ["Postal", data.postal],

        ["Latitude", data.latitude],

        ["Longitude", data.longitude],

        ["Timezone", data.timezone],

        ["ISP", data.isp],

        ["Organization", data.organization || data.org],

        ["ASN", data.asn],

        ["Datacenter",
            data.is_datacenter === true
                ? "YES"
                : data.is_datacenter === false
                    ? "NO"
                    : null
        ],

        ["VPN",
            data.is_vpn === true
                ? "YES"
                : data.is_vpn === false
                    ? "NO"
                    : null
        ],

        ["Proxy",
            data.is_proxy === true
                ? "YES"
                : data.is_proxy === false
                    ? "NO"
                    : null
        ],

        ["Tor",
            data.is_tor === true
                ? "YES"
                : data.is_tor === false
                    ? "NO"
                    : null
        ],

        ["Confidence", data.confidence],

        ["Source", data.source]

    ];


    fields.forEach(
        ([label, value]) => {

            addResultRow(
                label,
                value
            );

        }
    );
}


/* =========================================================
   BSSID LOOKUP
   ========================================================= */

async function lookupBSSID() {

    const bssid =
        bssidInput.value
            .trim()
            .replace(/-/g, ":")
            .toLowerCase();


    if (!bssid) {

        showMessage(
            "Enter a BSSID / MAC address.",
            "error"
        );

        return;
    }


    showMessage(
        "Querying WiGLE...",
        "muted"
    );


    log(
        `BSSID lookup requested: ${bssid}`
    );


    bssidButton.disabled = true;

    bssidButton.textContent =
        "QUERYING...";


    try {

        const response =
            await fetch(
                `${BACKEND}/api/v1/locate-bssid?netid=${encodeURIComponent(bssid)}`,
                {
                    method: "GET",
                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        let data;


        try {

            data =
                await response.json();

        } catch {

            throw new Error(
                "Backend returned invalid JSON."
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                `Backend HTTP ${response.status}`
            );

        }


        if (!data.success) {

            showMessage(
                data.error ||
                "BSSID lookup failed.",
                "error"
            );


            log(
                `BSSID lookup failed: ${
                    data.error || "unknown error"
                }`
            );

            return;
        }


        renderBSSIDResult(data);


        if (
            data.latitude !== undefined &&
            data.longitude !== undefined
        ) {

            showCoordinates(
                data.latitude,
                data.longitude,
                17
            );

        }


        log(
            `BSSID lookup successful: ${bssid}`
        );


    } catch (error) {

        showMessage(
            `BSSID LOOKUP FAILED — ${error.message}`,
            "error"
        );


        log(
            `BSSID request error: ${error.message}`
        );

    } finally {

        bssidButton.disabled = false;

        bssidButton.textContent =
            "LOCATE BSSID";
    }
}


/* =========================================================
   BSSID RESULT
   ========================================================= */

function renderBSSIDResult(data) {

    clearResults();


    const fields = [

        ["STATUS", "SUCCESS"],

        ["BSSID", data.bssid],

        ["SSID", data.ssid],

        ["Latitude", data.latitude],

        ["Longitude", data.longitude],

        ["Accuracy", data.accuracy_radius_m
            ? `${data.accuracy_radius_m} m`
            : null
        ],

        ["Confidence", data.confidence],

        ["Observations", data.observations],

        ["Source", data.source]

    ];


    fields.forEach(
        ([label, value]) => {

            addResultRow(
                label,
                value
            );

        }
    );
}


/* =========================================================
   GPS
   ========================================================= */

gpsButton.addEventListener(
    "click",
    () => {

        if (
            !navigator.geolocation
        ) {

            showMessage(
                "Device GPS is not supported by this browser.",
                "error"
            );

            return;
        }


        gpsButton.disabled = true;

        gpsButton.textContent =
            "LOCATING...";


        log(
            "Device GPS requested."
        );


        navigator.geolocation.getCurrentPosition(

            position => {

                const {
                    latitude,
                    longitude
                } = position.coords;


                showCoordinates(
                    latitude,
                    longitude,
                    16
                );


                clearResults();

                addResultRow(
                    "STATUS",
                    "DEVICE LOCATION"
                );

                addResultRow(
                    "Latitude",
                    latitude
                );

                addResultRow(
                    "Longitude",
                    longitude
                );

                addResultRow(
                    "Accuracy",
                    `${Math.round(
                        position.coords.accuracy
                    )} m`
                );


                log(
                    `GPS location acquired: ${
                        latitude
                    }, ${
                        longitude
                    }`
                );


                gpsButton.disabled = false;

                gpsButton.textContent =
                    "✦ GPS";
            },


            error => {

                let message =
                    "Unable to obtain device location.";


                if (
                    error.code ===
                    error.PERMISSION_DENIED
                ) {

                    message =
                        "Location permission was denied.";

                } else if (
                    error.code ===
                    error.POSITION_UNAVAILABLE
                ) {

                    message =
                        "Device location is unavailable.";

                } else if (
                    error.code ===
                    error.TIMEOUT
                ) {

                    message =
                        "Location request timed out.";

                }


                showMessage(
                    message,
                    "error"
                );


                log(
                    `GPS error: ${message}`
                );


                gpsButton.disabled = false;

                gpsButton.textContent =
                    "✦ GPS";
            },

            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );
    }
);


/* =========================================================
   ENTER KEY SUPPORT
   ========================================================= */

ipInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            lookupIP();
        }

    }
);


bssidInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            lookupBSSID();
        }

    }
);


/* =========================================================
   BUTTON EVENTS
   ========================================================= */

ipButton.addEventListener(
    "click",
    lookupIP
);


bssidButton.addEventListener(
    "click",
    lookupBSSID
);


/* =========================================================
   INITIALIZATION
   ========================================================= */

function initialize() {

    footerStatus.textContent =
        "BACKEND // API";

    coordinates.textContent =
        "COORD // --";


    log(
        "ArgusScope frontend initialized."
    );

    log(
        "Backend: " + BACKEND
    );

    log(
        "Map system initialized."
    );

    log(
        "Street / Cyber Dark / Satellite / Terrain available."
    );

    log(
        "Awaiting target..."
    );


    setTimeout(
        () => map.invalidateSize(),
        250
    );
}


initialize();


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        map.invalidateSize();

    }
);

</script>
